name: WORLDIFACT RunPod Flex provisioning safety contracts (offline, no secrets)
on:
  push:
    branches: ['ops/runpod-worldifact-flex-provisioning-20261016']
    paths:
      - 'scripts/runpod-provision-on-demand.mjs'
      - 'tests/runpod-provision-on-demand.test.mjs'
      - '.github/workflows/runpod-flex-*.yml'
  pull_request:
    paths:
      - 'scripts/runpod-provision-on-demand.mjs'
      - 'tests/runpod-provision-on-demand.test.mjs'
      - '.github/workflows/runpod-flex-*.yml'
permissions:
  contents: read
jobs:
  offline-provisioning-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test zero-active worker, image approvals, no Pod, no duplicate POST
        run: node --test tests/runpod-provision-on-demand.test.mjs
