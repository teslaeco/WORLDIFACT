name: Prepare detailed Studio routing repair
on:
  push:
    branches: ['fix/restore-detailed-studio-20260930']
    paths: ['.github/workflows/prepare-detailed-studio-repair.yml']
permissions:
  contents: read
concurrency:
  group: detailed-studio-repair
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply integrity-checked implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/detailed.gz"
          for blob in e417007d7cc093a027ac253bec1d4a98fcfa4e4c 30ab29d9c2ebc4978f15fb06c33cb2974f3471f5 ae81a6e03c89ebd71884cb1d7b7f6edd3ea70374 a7494508139d9b79994659c155242ea51db010fe; do
            gh api "repos/teslaeco/WORLDIFACT/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/detailed.gz"
          done
          gzip -dc "$RUNNER_TEMP/detailed.gz" > "$RUNNER_TEMP/detailed.patch"
          echo "a02b0e9a4a46a00889f9425d4afaa2b062ff5aa567d5f4461c2a501bab3451ba  $RUNNER_TEMP/detailed.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/detailed.patch"
          git apply "$RUNNER_TEMP/detailed.patch"
          gh api repos/teslaeco/WORLDIFACT/git/blobs/3e5ae5aefbd42697b353d875332d296a3882dfb1 --jq .content | base64 --decode | gzip -dc > "$RUNNER_TEMP/detailed-followup.patch"
          echo "3e974a750bb269cbce7eb0ca73b8697780f5c7e75482da0855026e4717572207  $RUNNER_TEMP/detailed-followup.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/detailed-followup.patch"
          git apply "$RUNNER_TEMP/detailed-followup.patch"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/shop-draft-lifecycle.test.mjs')
          s=p.read_text()
          old="('Recreate this adult silver-haired woman, no orb. ' + 'outfit '.repeat(550)).slice(0,3500)"
          new="('Recreate this adult silver-haired woman, no orb. ' + 'outfit '.repeat(550)).slice(0,3499) + '.'"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - run: npm ci
      - name: Verify complete application without paid generation
        shell: bash
        run: |
          set -euo pipefail
          if npm run verify > "$RUNNER_TEMP/detailed-verify.log" 2>&1; then
            grep -E '^>|tests |pass |fail |skipped |PASS|built in|warnings and' "$RUNNER_TEMP/detailed-verify.log" | tail -65
          else
            grep -E '^>|✖|error TS|AssertionError|not ok|tests |pass |fail |actual:|expected:|test at|Error:' "$RUNNER_TEMP/detailed-verify.log" | tail -140 || true
            exit 1
          fi
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: detailed-studio-verification
          path: ${{ runner.temp }}/detailed-verify.log
          retention-days: 3
      - name: Commit verified source on the isolated repair branch
        run: |
          set -euo pipefail
          git config user.name 'WORLDIFACT repair automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/studio.ts src/components/GenerationCostNotice.tsx src/lib/studioClient.ts src/lib/studioProtocol.ts src/lib/detailedStudio.ts src/pages/ShopPage.css src/pages/ShopPage.tsx tests/generation-profile.test.ts tests/shop-draft-lifecycle.test.mjs tests/shop-render-helper.mjs tests/shop-manufacturing.test.ts tests/studio-accounts.test.ts tests/detailed-studio-fixture.ts tests/detailed-studio.test.ts scripts/check-detailed-studio-runtime.mjs scripts/restore-detailed-studio-config.mjs tests/detailed-studio-release.test.mjs docs/CONTEST_STATUS.md
          git diff --cached --check
          git commit -m 'fix: route reference characters through signed Astra Blender jobs'
          git push origin HEAD:fix/restore-detailed-studio-20260930
          echo "Verified implementation commit: $(git rev-parse HEAD)"
  runtime:
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/restore-detailed-studio-20260930
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Extended current runtime read only
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {checkDetailedRuntime} from './scripts/check-detailed-studio-runtime.mjs';
          const evidence=await checkDetailedRuntime(process.env);
          console.log(JSON.stringify(evidence,null,2));
          assert.equal(evidence.verifiedForGuardedRouting,true,'Existing detailed runtime must confirm the unchanged cost and output guards.');
          JS
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
