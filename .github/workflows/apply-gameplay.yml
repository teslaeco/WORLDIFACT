name: Apply reviewed gameplay patch
on:
  push:
    branches: [fix/queen-terrain-loader-20260923]
    paths: [.github/workflows/apply-gameplay.yml]
permissions:
  contents: write
concurrency:
  group: apply-queen-terrain-loader
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.ref == 'refs/heads/fix/queen-terrain-loader-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/queen-terrain-loader-20260923
          fetch-depth: 0
      - name: Validate transport, exact source base and reviewed resulting tree
        shell: bash
        env:
          EXPECTED_EVENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT"
          test "$(git rev-parse origin/main)" = "76c8f8344cd33e1b0bdc5de32863d2ad26a723c0"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, os, shutil
          changed = subprocess.check_output(['git','diff','--name-only','8cc9b7e8cc737895a7525ebc095c651cf1ccd743','HEAD']).decode().splitlines()
          allowed = {'.repair/part-0.b64','.repair/part-1.b64','.repair/part-2.b64','.github/workflows/apply-gameplay.yml'}
          assert set(changed) == allowed, 'Unexpected concurrent source changes'
          encoded = ''.join(pathlib.Path(f'.repair/part-{i}.b64').read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'da4c0b614facad3f8b0e3cfe74fe05118f2ce022cdc07fa52b7700665eb3938a', 'Transport hash mismatch'
          path = pathlib.Path('/tmp/reviewed-gameplay.patch'); path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(path)],check=True)
          staged = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert len(staged)==19 and all(p.startswith(('src/','tests/','docs/')) for p in staged), 'Unexpected mutation scope'
          shutil.copy('.git/index','/tmp/reviewed.index')
          env = dict(os.environ,GIT_INDEX_FILE='/tmp/reviewed.index')
          subprocess.run(['git','update-index','--force-remove',*sorted(allowed)],env=env,check=True)
          tree = subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          assert tree == 'a61f21a8eb82ebe57271713e8e5770c279add162', 'Reviewed source tree mismatch'
          print('Verified patch SHA-256 and exact locally tested source tree:',tree)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair queen poses and fan; add dense meadow and contact-based loader terrain'
          git push origin HEAD:refs/heads/fix/queen-terrain-loader-20260923
