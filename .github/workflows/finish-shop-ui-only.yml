name: Finish the reviewed Shop UI without account mutations
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['scripts/finish-shop-ui.patch', '.github/workflows/finish-shop-ui-only.yml']
permissions:
  contents: write
concurrency:
  group: worldifact-shop-composer-source
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.event.before == '94091e7ff529965666d3a77e89de26b99e407033' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Require exact original sources and transparent UI patch
        run: |
          test "$(git rev-parse HEAD^)" = 94091e7ff529965666d3a77e89de26b99e407033
          test "$(git hash-object scripts/stage-shop-composer.py)" = 2c8b6b9563300497f24430096ccdfd1aaeea18f5
          echo 'fd03929ccf64e35147ed6d9314c81dfb931cfad46df40c125982ff8df5469aa5  scripts/finish-shop-ui.patch' | sha256sum --check
      - run: npm ci
      - name: Reproduce the uncleared original draft without a provider or account
        run: |
          cat scripts/shop-composer-regressions.source >> tests/shop-draft-lifecycle.test.mjs
          if node --test --test-name-pattern='terminal failed request clears its unchanged composer' tests/shop-draft-lifecycle.test.mjs > /tmp/ui-before.txt 2>&1; then
            echo 'Expected original composer failure was not reproduced'; exit 1
          fi
          grep -q 'Original brown chess knight' /tmp/ui-before.txt
          git restore -- tests/shop-draft-lifecycle.test.mjs
      - name: Complete only the staged frontend correction
        run: |
          python3 -B scripts/stage-shop-composer.py
          git apply --check scripts/finish-shop-ui.patch
          git apply scripts/finish-shop-ui.patch
          git diff --exit-code HEAD -- server config wrangler.jsonc package.json package-lock.json src/lib/studioProtocol.ts .github/workflows/cloudflare.yml
          node --test tests/shop-draft-lifecycle.test.mjs tests/shop-draft-reset.test.ts tests/credit-tools-panel.test.mjs tests/credits-membership-lifecycle.test.mjs
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Create exact verified UI source objects without advancing any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,lstat,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const expected={
            'docs/CONTEST_STATUS.md':'3e814c64ac2faf08866a0ccb43521a13719dac9a485f6438c675b802a1858062',
            'src/components/GenerationCostNotice.tsx':'cba9463feb8a7b306280e3a2eb61e34f431b3d953e88f6f907947d9cd4fc9577',
            'src/lib/generationQuote.ts':'85daf95ac5a1604cdb3793a553ff5e14c0507f2e889c1e19c04ac4c865e9e8c5',
            'src/lib/studioDraft.ts':'854109092753b8ef0f019298762b9c6c500b6c2fd1a55c34a410a74095c46fe1',
            'src/lib/useGenerationQuote.ts':'8f497b3b84768395bc81854c426a15d41e60d1d7d473746c1f9f14c72b4a850c',
            'src/pages/ShopPage.css':'ee937740fb1a7d6c1f96b45cfaeae51c1a1c550480896baa2e305032473d4991',
            'src/pages/ShopPage.tsx':'5ac76e681c95c465d6aa24dfd9d3342973aff4fec23e42ae68809efe906b11e4',
            'tests/shop-draft-lifecycle.test.mjs':'8586178d12a5a3b5d00a8315c12697b47aa3072d5616af7e643ac25dfc59220d',
            'tests/shop-draft-reset.test.ts':'797615bae459208747b9e76006e46459e6560fa0139a28cd3acbd7738cf5d4a2',
            'src/components/CreditToolsPanel.tsx':'ab93cd80bb63973d3b1f594a4229f6da242062a15cca35e325977a6c81efd269',
            'src/components/CreditToolsPanel.css':'3455d3a907279edce1d05137d75e7555a3c6f23d47ace7f66a047b81113bd8e7',
            'src/pages/CreditsPage.tsx':'689085d08aad7d63ff7b8395fbfa4c0ede7cee9ee9d7f0610bda397a737d9ca6',
            'tests/credit-tools-helper.mjs':'66df9df551b756624d3e08f51388e0bfdc79856a1d1d734dc219525d761ed111',
            'tests/credit-tools-panel.test.mjs':'83a86d510e0a3c03d4a6ef554dfd205184147adc7e008f2e4601f2cb0e2df30f',
            'tests/credits-membership-lifecycle.test.mjs':'1fafe4f861c1d513358a32058484d04bee4623917e5ff5c5926d50a51b105597'};
          const branch='fix/generation-audit-recovery-20261009',parent=process.env.GITHUB_SHA;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(process.env.GITHUB_REPOSITORY!=='teslaeco/WORLDIFACT'||process.env.GITHUB_REF!=='refs/heads/'+branch||git('rev-parse','HEAD')!==parent||git('rev-parse','HEAD^')!=='94091e7ff529965666d3a77e89de26b99e407033')throw Error('Unexpected scope');
          const api=async(method,path,body)=>{const r=await fetch('https://api.github.com/repos/teslaeco/WORLDIFACT/'+path,{method,redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok)throw Error('Source operation failed:'+r.status);return r.json();};
          if((await api('GET','git/ref/heads/'+branch)).object.sha!==parent)throw Error('Concurrent change');
          const entries=[];
          for(const[path,sha]of Object.entries(expected)){
            const info=await lstat(path),raw=await readFile(path);
            if(!info.isFile()||info.isSymbolicLink()||raw.length>1048576||createHash('sha256').update(raw).digest('hex')!==sha)throw Error('Unexpected output: '+path);
            const blob=await api('POST','git/blobs',{encoding:'base64',content:raw.toString('base64')});
            if(blob.sha!==createHash('sha1').update(Buffer.from('blob '+raw.length+'\0')).update(raw).digest('hex'))throw Error('Blob mismatch');
            entries.push({path,mode:'100644',type:'blob',sha:blob.sha});
          }
          const retired=['scripts/stage-shop-composer.py','scripts/shop-composer-regressions.source','scripts/shop-composer-unit.source','.github/workflows/stage-shop-composer.yml','.github/workflows/check-composer-reference-fixtures.yml','scripts/finish-shop-ui.patch','.github/workflows/finish-shop-ui-only.yml'];
          for(const path of retired)entries.push({path,mode:'100644',type:'blob',sha:null});
          const tree=await api('POST','git/trees',{base_tree:git('rev-parse','HEAD^{tree}'),tree:entries});
          if(tree.sha!=='0e12c6fe0ce733cb9398c8052ccb5102559680d6')throw Error('Complete source tree mismatch');
          const commit=await api('POST','git/commits',{message:'fix: clear finished Shop drafts and show honest held-point and coupon status\n\nFrontend only: preserve next edits, receipts, original models and server selection; collapse old errors and display validated available/held amounts. Add a clearly inactive promo section with no submission path. No point grant/reset, coupon registration, payment, generation, backend change or production access. Full verification and Worker dry-run passed. Retire completed UI staging entrypoints.',tree:tree.sha,parents:[parent]});
          const receipt={parent,commit:commit.sha,tree:tree.sha,changedFiles:Object.keys(expected),retired,branchUpdated:false,productionChanged:false,paidGenerationRequested:false,heldPointsReleased:false,couponsActivated:false};
          await mkdir('ui-source-evidence',{recursive:true});await writeFile('ui-source-evidence/commit.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-shop-ui-source-${{ github.run_id }}
          path: ui-source-evidence/commit.json
          retention-days: 7
          if-no-files-found: error
# Source-only publication adapter for independently permitted UI work. No
# production environment, provider credentials, account writes or coupon grants.
