name: ECOMECH V6 part-wise open neural 3D — 6 real meshes on FREE CPU
on:
  push:
    branches: ['feat/ecomech-v6-open-neural-reconstruction-20261015']
    paths:
      - 'tools/ecomech/v6_prepare_open_neural_input.py'
      - 'tools/ecomech/v6_triposr_cpu_inference.py'
      - 'tools/ecomech/v6_partwise_open_reconstruction.py'
      - 'tools/ecomech/ecomech_v6_approved_photo_mask_DRAFT.json'
      - '.github/workflows/ecomech-v6-neural-parts-cpu.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-v6-part-wise-neural-cpu-once
  cancel-in-progress: false
jobs:
  cpu-open-neural-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Fetch immutable user-authorized original photo from old Actions run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ecomech-reference
          gh run download 38653687131 --repo teslaeco/WORLDIFACT \
            --name ECOMECH-V4-ASTRA-WITH-ACTUAL-REFERENCE-8fcffb86c571a8cca7ad09e1401247bf08f41104 \
            --dir .ecomech-reference
          printf '%s  %s\n' '9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053' '.ecomech-reference/input-reference.png' | sha256sum --check
      - name: Install pinned CPU image-processing and neural inference dependencies (NO GPU/PAID API)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'torch==2.5.1' 'torchvision==0.20.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'Pillow==10.4.0' 'omegaconf==2.3.0' \
            'einops==0.7.0' 'transformers==4.35.2' 'trimesh==4.0.5' \
            'scikit-image==0.24.0' 'huggingface_hub==0.20.3' \
            'imageio==2.37.0'
          python -m py_compile tools/ecomech/v6_partwise_open_reconstruction.py tools/ecomech/v6_triposr_cpu_inference.py
      - name: Original source SHA and neural software prerequisites check
        run: |
          printf '%s  %s\n' '9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053' '.ecomech-reference/input-reference.png' | sha256sum --check
          python -m py_compile tools/ecomech/v6_partwise_open_reconstruction.py
      - name: Load reviewed MIT TripoSR source at exact commit; no third-party API call
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr-open-source
          git -C /tmp/triposr-open-source checkout --detach 107cefdc244c39106fa830359024f6a2f1c78871
          test "$(git -C /tmp/triposr-open-source rev-parse HEAD)" = 107cefdc244c39106fa830359024f6a2f1c78871
          grep -q 'Copyright (c) 2024 Tripo AI & Stability AI' /tmp/triposr-open-source/LICENSE
      - name: Infer six genuine part-wise neural meshes using source image on CPU (NO PAID API)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          python tools/ecomech/v6_partwise_open_reconstruction.py \
            --source .ecomech-reference/input-reference.png \
            --annotation tools/ecomech/ecomech_v6_approved_photo_mask_DRAFT.json \
            --open-code /tmp/triposr-open-source \
            --runner tools/ecomech/v6_triposr_cpu_inference.py \
            --out ecomech-v6-partwise-evidence \
            --resolution 144
          test -s ecomech-v6-partwise-evidence/ecomech-v6-neural-parts-original.glb
          test -s ecomech-v6-partwise-evidence/assembly-manifest.json
      - name: Preserve only ORIGINAL actual GLB and provider lineage, NOT a false hero result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecomech-v6-open-neural-six-part-geometry-${{ github.sha }}
          path: ecomech-v6-partwise-evidence/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
