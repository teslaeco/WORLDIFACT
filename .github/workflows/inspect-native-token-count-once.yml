name: Measure native inspection input counts without generation
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['.github/workflows/inspect-native-token-count-once.yml']
permissions:
  contents: read
concurrency:
  group: worldifact-native-token-count-20261010
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.run_number == 1 && github.run_attempt == 1
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bdc2950047a1c526058a8901164f3a2fcad2d848
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/WORLDIFACT
          ref: 2380a7e2dad05a40b3753faf06c2635ed444be51
          path: .context-ancestor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/Froge-MPC-2-test
          ref: d3f61b842dcfeda2ed794210caafc391919a75be
          path: .model-completion-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assemble immutable public runtime and Blender
        run: |
          python -B - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('.model-completion-source');pin='d3f61b842dcfeda2ed794210caafc391919a75be'
          def git(*args): return subprocess.check_output(['git','--no-replace-objects','-C',str(root),*args])
          assert git('rev-parse','HEAD').decode().strip()==pin
          entries=[]
          for entry in git('ls-tree','-r','-z',pin).split(b'\0'):
              if entry:
                  metadata,path=entry.split(b'\t',1);mode,kind,sha=metadata.decode().split()
                  entries.append({'path':path.decode(),'mode':mode,'type':kind,'sha':sha})
          (root/'pinned-tree.json').write_text(json.dumps({'sha':pin,'truncated':False,'tree':entries}))
          PY
          python -B tools/model_construction/assemble_test_runtime.py --ancestor .context-ancestor --source .model-completion-source/oracle_connector --destination .construction-existing
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0-linux-x64.tar.xz --output /tmp/blender-4.3.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0.sha256 --output /tmp/blender-4.3.0.sha256
          (cd /tmp && sha256sum --check --ignore-missing blender-4.3.0.sha256 && tar -xf blender-4.3.0-linux-x64.tar.xz)
          python -m pip install Pillow==11.3.0
      - name: Capture native fixture count inputs without provider credentials
        env:
          MODEL_CONTEXT_ANCESTOR_REPOSITORY: ${{ github.workspace }}/.context-ancestor
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import json,sys
          root=Path.cwd();sys.path.insert(0,str(root/'tools/model_construction'))
          import test_native_pipeline as native
          target=root/'count-fixture-inputs';target.mkdir()
          original=native.ScriptedProvider.open
          def capture(self,original_open,opener,request,*args,**kwargs):
              response=original(self,original_open,opener,request,*args,**kwargs)
              if request.full_url=='https://api.openai.com/v1/responses/input_tokens':
                  wire=json.loads(request.data);document=json.loads(wire['input'][0]['content'][0]['text'])
                  index=int(self.folder.name[-12:]);phase=document['phase']
                  if index in (1,4) and phase in ('construction','inspection'):
                      (target/('%d-%s.json'%(index,phase))).write_bytes(request.data)
              return response
          native.ScriptedProvider.open=capture
          native.run_worker(root/'.model-completion-source/oracle_connector',root/'.construction-existing',root/'.context-ancestor',root/'.count-native-work',Path('/tmp/blender-4.3.0-linux-x64/blender'))
          assert sorted(p.name for p in target.iterdir())==['1-construction.json','1-inspection.json','4-construction.json','4-inspection.json']
          PY
      - name: Count four exact synthetic inputs, never generate a response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -I -B - <<'PY'
          import base64,hashlib,json,os,struct,time,urllib.error,urllib.request
          from pathlib import Path
          key=os.environ.get('OPENAI_API_KEY','')
          if not key or any(c.isspace() for c in key):raise SystemExit('COUNT_CREDENTIAL_UNAVAILABLE')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          results=[]
          paths=sorted(Path('count-fixture-inputs').glob('*.json'))
          assert len(paths)==4
          for path in paths:
              raw=path.read_bytes();assert len(raw)<32*1024**2
              payload=json.loads(raw);assert payload['model']=='gpt-6-astra' and payload['tools']==[]
              content=payload['input'][0]['content'];document=json.loads(content[0]['text']);phase=document['phase']
              row={'case':path.stem,'payloadBytes':len(raw),'payloadSha256':hashlib.sha256(raw).hexdigest(),'textCharacters':sum(len(v.get('text','')) for v in content),'images':[],'phaseInputLimit':65536 if phase=='construction' else 32768}
              for block in content:
                  if block['type']=='input_image':
                      assert block['image_url'].startswith('data:image/png;base64,')
                      image=base64.b64decode(block['image_url'].split(',',1)[1],validate=True)
                      row['images'].append({'bytes':len(image),'size':list(struct.unpack('>II',image[16:24]))})
              start=time.monotonic()
              request=urllib.request.Request('https://api.openai.com/v1/responses/input_tokens',data=raw,method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'})
              try:
                  with opener.open(request,timeout=30) as response:
                      body=response.read(16385);row['httpStatus']=response.status
                  if len(body)>16384:raise ValueError()
                  value=json.loads(body)
                  if value.get('object')!='response.input_tokens' or type(value.get('input_tokens')) is not int or value['input_tokens']<0:raise ValueError()
                  row['countedInput']=value['input_tokens'];row['withinPhaseLimit']=value['input_tokens']<=row['phaseInputLimit']
              except urllib.error.HTTPError as error:
                  row['httpStatus']=error.code
                  try:
                      value=json.loads(error.read(16384)).get('error',{})
                      codes={'invalid_value','unsupported_value','invalid_request_error','invalid_image','invalid_base64','image_too_large','model_not_found','insufficient_quota','rate_limit_exceeded'}
                      row['errorCode']=value.get('code') if value.get('code') in codes else 'UNRECOGNIZED'
                      row['errorType']=value.get('type') if value.get('type') in codes else 'UNRECOGNIZED'
                  except Exception:row['errorCode']='UNAVAILABLE'
                  finally:error.close()
              except TimeoutError:row['failure']='COUNT_TIMEOUT'
              except Exception:row['failure']='COUNT_UNAVAILABLE'
              row['elapsedSeconds']=round(time.monotonic()-start,3);results.append(row)
          Path('count-evidence').mkdir()
          result={'generationRequested':False,'countRequests':len(results),'originalHostChanged':False,'results':results}
          Path('count-evidence/counts.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-input-count-${{ github.run_id }}
          path: count-evidence/
          if-no-files-found: ignore
          retention-days: 3
# No Oracle/customer data, generation endpoint, direct deployment or main update.
