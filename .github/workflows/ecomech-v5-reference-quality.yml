name: Character V5 — original pixel identity and existing GLB QA (ZERO AI spend)
on:
  push:
    branches: ['feat/character-engine-v5-router-reference-qa-20261015']
    paths:
      - 'scripts/ecomech-v5-reference-evidence.py'
      - '.github/workflows/ecomech-v5-reference-quality.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-v5-original-photo-qa
  cancel-in-progress: true
jobs:
  immutable-existing-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve EXACT original user photo from already-spent Astra job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ecomech-input
          gh run download 38653687131 --repo teslaeco/WORLDIFACT \
            --name ECOMECH-V4-ASTRA-WITH-ACTUAL-REFERENCE-8fcffb86c571a8cca7ad09e1401247bf08f41104 \
            --dir .ecomech-input
          printf '%s  %s\n' '9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053' '.ecomech-input/input-reference.png' | sha256sum --check
      - name: Retrieve unchanged old V4 geometry, not a new generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .existing-v4
          gh run download 38686151848 --repo teslaeco/WORLDIFACT \
            --name ecomech-v4-native-reference-rebuild-c4b85f1557df058b6bac37c6f04f9fa5e9d64966 \
            --dir .existing-v4
          printf '%s  %s\n' '629cca8ce22e7463a4af981d7004f7703124efc6090460b3da42f6660767ea27' '.existing-v4/ECOMECH_V4_REFERENCE_RECONSTRUCTED_GAME.glb' | sha256sum --check
      - name: Audit true PNG pixels and actual GLB; report NO-GO visual fidelity
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'numpy==2.2.6' 'trimesh==4.11.1'
          python -m py_compile scripts/ecomech-v5-reference-evidence.py
          python scripts/ecomech-v5-reference-evidence.py \
            --original .ecomech-input/input-reference.png \
            --glb .existing-v4/ECOMECH_V4_REFERENCE_RECONSTRUCTED_GAME.glb \
            --out ecomech-v5-readonly-evidence/qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('ecomech-v5-readonly-evidence/qa.json').read_text())
          assert v['reference']['pixelRgbSha256']=='3d601608694b61932ccf11a4e0eff979f49e0c08c2a20e161c117f8e10126508'
          assert v['geometry']['actualInstantiatedTriangles']==391248
          assert v['geometry']['sha256']=='629cca8ce22e7463a4af981d7004f7703124efc6090460b3da42f6660767ea27'
          assert v['finalDecision']=='NO_GO_VISUAL_REVIEW_REQUIRED'
          assert v['paidRequestsStarted']==v['apiLiabilityUsd']==v['newCustomerCharges']==0
          print('REFERENCE_RGB_AND_REAL_V4_GLB_VERIFIED_NO_NEW_AI')
          PY
      - name: Preserve read-only evidence, not the source photo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecomech-v5-real-photo-and-existing-glb-${{ github.sha }}
          path: ecomech-v5-readonly-evidence/
          if-no-files-found: ignore
          retention-days: 14
