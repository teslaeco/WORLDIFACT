name: WORLDIFACT 3-GPU trials — CPU-only GLB fixture and RunPod SDK contracts
on:
  push:
    branches: ['ops/three-gpu-ephemeral-trials-20261016']
    paths:
      - 'tools/gpu_trials/**'
      - 'tests/test_three_gpu_procedural_models.py'
      - 'tests/test_three_gpu_dispatch.py'
      - 'tests/test_three_gpu_workflow_safety.py'
      - '.github/workflows/three-gpu-trials-*.yml'
  pull_request:
    paths:
      - 'tools/gpu_trials/**'
      - 'tests/test_three_gpu_procedural_models.py'
      - 'tests/test_three_gpu_dispatch.py'
      - 'tests/test_three_gpu_workflow_safety.py'
      - '.github/workflows/three-gpu-trials-*.yml'
permissions:
  contents: read
jobs:
  cpu-only-real-glb:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned CPU geometry and official new RunPod SDK (no GPU)
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.3.5 trimesh==4.11.1 Pillow==12.3.0 runpod==2.0.0rc1
      - name: Test three separate GLB/PBR meshes and no false model claims
        run: python -m unittest discover -s tests -p test_three_gpu_procedural_models.py -v
      - name: Test one-attempt operator and RunPod SDK decorator contract
        run: python -m unittest discover -s tests -p test_three_gpu_dispatch.py -v
      - name: 'Static review — no idle GPU or permanent disk, required --once and postflight'
        run: python -m unittest discover -s tests -p test_three_gpu_workflow_safety.py -v
      - name: Create three real offline geometric GLB examples for reviewer (NOT GPU and NOT AI)
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from tools.gpu_trials.procedural_models import construct, verified_model
          output=Path('cpu-procedural-glb-examples')
          output.mkdir()
          for key in ('L4','A100','H100'):
              data=construct(key,require_cuda=False)
              (output/(data['task']+'.glb')).write_bytes(verified_model(data))
              receipt={k:v for k,v in data.items() if k!='glbBase64'}
              receipt['testExecution']='CPU_OFFLINE_NOT_RUNPOD'
              (output/(data['task']+'.json')).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
              print(key,data['task'],data['meshCount'],data['triangleCount'],data['glbSha256'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WORLDIFACT-three-real-GLB-CPU-FIXTURES-NOT-NEURAL
          path: cpu-procedural-glb-examples/
          if-no-files-found: error
          retention-days: 14
