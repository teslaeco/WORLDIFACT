name: Arm approved MCP2 Shop pilot once

on:
  workflow_run:
    workflows: ["Publish WORLDIFACT and verify OpenAI setup"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: worldifact-shop-mcp2-pilot
  cancel-in-progress: false

jobs:
  arm-shop-pilot:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    environment:
      name: production
      url: https://worldifact.xodobrox.workers.dev/shop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact deployed main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Gate to the approved AI Shop E2E re-arm marker
        id: gate
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -m -r HEAD | grep -qx 'ops/SHOP_AI_E2E_REARM_20260916'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Approved AI Shop E2E re-arm marker found in this deployment commit.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No AI Shop E2E re-arm marker in this deployment commit; exiting without changing pilot state.'
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Check deployment credentials
        if: steps.gate.outputs.run == 'true'
        run: node scripts/release-check.ts credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Verify exact source
        if: steps.gate.outputs.run == 'true'
        run: npm run verify

      - name: Assemble pinned foundation apps
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/foundations

      - name: Sync Oracle connector secrets
        if: steps.gate.outputs.run == 'true'
        run: node scripts/connect-platform.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}

      - name: Build exactly one additional cumulative Shop reservation
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-shop-mcp2-pilot-config.ts
        env:
          SHOP_PILOT_CONFIRMATION: MCP2-SHOP-PILOT
          SHOP_PILOT_REQUEST_LIMIT: '6'
          SHOP_PILOT_DURATION_MINUTES: '180'

      - name: Dry-run exact Shop pilot config
        if: steps.gate.outputs.run == 'true'
        run: npx wrangler deploy --dry-run --config .shop-pilot.wrangler.json --outdir .wrangler/shop-pilot-preview

      - name: Deploy hard-capped MCP2 Shop pilot
        if: steps.gate.outputs.run == 'true'
        run: npx wrangler deploy --config .shop-pilot.wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Shop pilot without spending
        if: steps.gate.outputs.run == 'true'
        run: node scripts/shop-mcp2-pilot-smoke.ts
        env:
          WORLDIFACT_URL: https://worldifact.xodobrox.workers.dev

      - name: Record operator handoff
        if: steps.gate.outputs.run == 'true'
        run: |
          echo 'AI Shop E2E pilot armed. CI executed no paid generation.'
          echo 'Cumulative ceiling is exactly 6; prior reservations remain counted, leaving at most one additional REAL 3D job after the failed-fetch attempt.'
