name: Source mask integrity regression (real archived pixels, no inference)
on:
  push:
    branches: ['feat/reference-reconstruction-trellis2-20261015']
    paths:
      - 'tools/reference_reconstruction/mask_selection.py'
      - 'tools/reference_reconstruction/test_mask_selection.py'
      - '.github/workflows/reference-mask-integrity-tests.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: source-mask-integrity-replay
  cancel-in-progress: true
jobs:
  preserve_original_parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Read the existing SAM masks, never submit another GPU job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .original-sam-masks
          gh run download 38751646199 -R teslaeco/WORLDIFACT \
            --name ecomech-sam21-real-mask-7fcd71c5572dbb70db3c376718b74c1489a0c94d \
            --dir .original-sam-masks
          printf '%s  %s\n' 'be6c7ab26b295d564ba0f4d9a89c9ce86ce02cba31224cee831844ebf5435210' '.original-sam-masks/mask.png' | sha256sum --check
      - run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0'
      - name: Run seven tests including exact real archived masks and read-only invariants
        env:
          ECOMECH_MASK_ARCHIVE: .original-sam-masks
        run: python tools/reference_reconstruction/test_mask_selection.py
      - name: Preserve the corrected original RGB and alpha, not a claimed 3D result
        run: |
          python tools/reference_reconstruction/mask_selection.py \
            --existing-masks .original-sam-masks --out verified-mask-input
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('verified-mask-input/selection-report.json').read_text())
          assert q['selectedIndex']==3 and q['previousSelectedIndex']==5
          assert q['originalRgbUnchanged'] and not q['printReady']
          assert q['newInferenceCalls']==q['new3DCalls']==0
          assert min(q['candidates'][3]['protectedRegionRetention'].values()) >= .95
          assert not q['candidates'][5]['passesIntegrityScreen']
          print('REAL_SOURCE_PARTS_PRESERVED_WITHOUT_NEW_GPU_OR_NEURAL_CALL')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-source-mask-${{ github.sha }}
          path: verified-mask-input/
          if-no-files-found: ignore
          retention-days: 14
