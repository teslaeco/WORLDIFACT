name: Visual asset review
on:
  push:
    branches: [fix/portal-queen-polish-20260923]
    paths: [.github/workflows/visual-asset-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot tracked source and inspect the existing avatar without generation
        run: |
          mkdir -p /tmp/visual-review
          git archive --format=tar.gz HEAD > /tmp/visual-review/source.tar.gz
          python3 - <<'PY'
          import json, struct, urllib.request
          from pathlib import Path
          result = {}
          try:
              with urllib.request.urlopen('https://worldifact.xodobrox.workers.dev/api/avatar/neptune-queen', timeout=45) as response:
                  data = response.read(60_000_000)
              assert data[:4] == b'glTF', 'Not a GLB response'
              length = struct.unpack_from('<I', data, 12)[0]
              doc = json.loads(data[20:20+length])
              result = {'bytes': len(data), 'skins': doc.get('skins', []), 'animations': doc.get('animations', []), 'materials': [m.get('name') for m in doc.get('materials', [])], 'nodes': doc.get('nodes', []), 'meshes': []}
              for mesh in doc.get('meshes', []):
                  primitives = []
                  for p in mesh.get('primitives', []):
                      a = doc['accessors'][p['attributes']['POSITION']]
                      primitives.append({'min': a.get('min'), 'max': a.get('max'), 'vertices': a.get('count'), 'indices': doc['accessors'][p['indices']]['count'] if 'indices' in p else a.get('count'), 'material': p.get('material')})
                  result['meshes'].append({'name': mesh.get('name'), 'primitives': primitives})
          except Exception as error:
              result = {'error': str(error)}
          Path('/tmp/visual-review/avatar-summary.json').write_text(json.dumps(result, indent=2))
          print(json.dumps({'bytes': result.get('bytes'), 'skins': len(result.get('skins', [])), 'animations': len(result.get('animations', [])), 'nodes': len(result.get('nodes', [])), 'error': result.get('error')}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-source
          path: /tmp/visual-review/
          retention-days: 2
