name: Apply verified portal repair
on:
  push:
    branches: [fix/portal-queen-polish-20260923]
    paths: [.github/workflows/visual-asset-review.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'teslaeco/WORLDIFACT'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/portal-queen-polish-20260923
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply only the reviewed source changes with before and after hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          changes = []
          for number in (1, 2, 3):
              changes.extend(json.loads(Path(f'ops/portal-polish-batch{number}.json').read_text()))
          assert len(changes) == 17 and len({c['path'] for c in changes}) == 17
          writes = []
          for change in changes:
              name = change['path']
              assert name.startswith(('src/', 'tests/')) or name == 'docs/PORTAL_REPAIR_20260923.md'
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert path.resolve().is_relative_to(root)
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == change['before'], f'Source changed: {name}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              edits = change['edits']
              assert edits == sorted(edits, key=lambda edit: edit['start'])
              last = 0
              for edit in edits:
                  assert last <= edit['start'] <= edit['end'] <= len(lines)
                  last = edit['end']
              for edit in reversed(edits):
                  lines[edit['start']:edit['end']] = [edit['text']]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == change['after'], f'Patch differs: {name}'
              writes.append((path, new))
          for path, new in writes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
              print(f'PASS original and reviewed-output hashes: {path}')
          PY
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - name: Original geometry, lowered fan, GET lifecycle and portal regressions
        run: node --test tests/avatar-asset.test.ts tests/avatar-locomotion.test.ts tests/world-presentation.test.ts tests/contest-hotfix.test.ts tests/portal-entry.test.mjs
      - name: Commit only verified product changes and remove this temporary helper
        run: |
          rm ops/portal-polish-batch1.json ops/portal-polish-batch2.json ops/portal-polish-batch3.json .github/workflows/visual-asset-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tests docs/PORTAL_REPAIR_20260923.md ops/portal-polish-batch1.json ops/portal-polish-batch2.json ops/portal-polish-batch3.json .github/workflows/visual-asset-review.yml
          git diff --cached --check
          git commit -m 'Preserve detailed Queen, articulate walking and fan, improve portal presentation'
          git push origin HEAD:refs/heads/fix/portal-queen-polish-20260923
