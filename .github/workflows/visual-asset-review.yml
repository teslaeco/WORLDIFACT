name: Visual code verification snapshot
on:
  push:
    branches: [fix/portal-queen-polish-20260923]
    paths: [.github/workflows/visual-asset-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package only public source and installed dependencies for offline code tests
        run: |
          mkdir -p /tmp/visual-code-review
          git archive --format=tar.gz HEAD > /tmp/visual-code-review/source.tar.gz
          tar -czf /tmp/visual-code-review/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: visual-code-dependencies
          path: /tmp/visual-code-review/
          retention-days: 2
