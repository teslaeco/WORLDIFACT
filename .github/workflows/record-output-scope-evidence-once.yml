name: Record exact release and failed live-test evidence
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['.github/workflows/record-output-scope-evidence-once.yml']
permissions:
  contents: write
jobs:
  record:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.ref == 'refs/heads/fix/generation-audit-recovery-20261009' && github.event.before == 'ac9e9f8f506aff041a5b6a6662c9191af3462751' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Preserve the historical ledger and replace only its stale current heading
        run: |
          test "$(git rev-parse HEAD^)" = ac9e9f8f506aff041a5b6a6662c9191af3462751
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path('docs/CONTEST_STATUS.md');old=path.read_bytes()
          assert hashlib.sha256(old).hexdigest()=='af2f716d8e4b7bc8653429a07a1d0762210d695a4a43ee3943d726ae0e34dd99'
          heading='# WORLDIFACT — TerraformingPlanet Astra heroine released\n\nUpdated 7 October 2026.\n\n'.encode()
          assert old.startswith(heading)
          prefix='''# WORLDIFACT — release deployed; live model acceptance still failing

          Current operational evidence: 9 October 2026, 22:45 UTC.
          **NO-GO for claiming that production 3D generation is restored.**

          The owner explicitly approved the output-scope release and one test within the
          existing USD 1.75 cap, including failure. Duplicate chat approval was treated as
          one authorization. This current section supersedes earlier installation-pending
          or release-pending statements below; the remaining record is historical evidence.

          The exact application source `49a02609a3730976ec0744ecf01877d1fbf16859` was
          published by run 37999173987 as Cloudflare version
          `7d88f9d7-0c32-413f-bcae-b6d0776b54f3`. Its 12 HTML routes, 428 exact built assets
          and exclusive 100% traffic were verified at 22:28:38 UTC. The dedicated approved
          branch workflow omitted declared variables, used `--keep-vars`, retained original
          bindings/migrations and did not synchronize credentials or financial settings.
          Main remains `38e7048c4176fac4c9808203af5bd58a1ae7d10e`; no generic main release
          was invoked. The previous deployment ID is retained in the release artifact.

          The new public synthetic MCC test in run 37999751697 submitted exactly one job
          using the deployed Shop request adapter and the original authenticated Oracle.
          It returned `MODEL_FAILED`, not a deliverable. No customer point, hold, billing or
          library row was changed by this engineering test. It is not a signed-in browser
          or owned-library test. Its permanent approval tag is consumed; do not replay it,
          delete the tag/job, or run another paid attempt under this authorization. The
          maximum authorized provider cost was USD 1.75; actual invoiced cost is UNKNOWN.

          GET-only reads of this same synthetic test in runs 38000622694 and 38000867858
          confirmed a different boundary from the earlier empty-plan user report:

          - One Blender build reached candidate revision 1 with zero recorded tool failures.
          - Recorded total time: 227.53 seconds; AI: 113.44; Blender: 114.08.
          - The host recorded two request attempts, 11,261 input and 6,323 output tokens,
            with `unknown_usage=false`. These counts are not an invoice or proof that both
            attempts reached a billable generation endpoint.
          - Terminal detail: `construction_response_unconfirmed`; guard:
            `WORLDIFACT_ASTRA_COST_GUARD`, reason `TOKEN_COUNT_UNAVAILABLE`, stage `count`.
          - Final assessment was not completed and no accepted final model was returned.

          The current typed Gateway wraps both a failed input-token-count call and a
          counted context/deadline/cancellation rejection into TOKEN_COUNT_UNAVAILABLE.
          Therefore this observation does NOT establish exhausted USD funds, a specific
          HTTP error, a too-large context, a 900-second deadline, or a provider outage.
          Do not remove the cost guard, fabricate an acceptance, relabel the preserved
          candidate as completed, or buy another trial to replace missing diagnostic data.
          The source review and retained same-job evidence, not another health check, are
          now the basis for the next correction. Source/CI success remains separate from
          new GLB, preview, download and account-library acceptance.

          Evidence artifact SHA-256 values:
          - Deployment: `6e716235c3355a53ac82ad758251b91bfb76b966146d66a2d87591a81a9e5490`
          - One-model report: `33be9b18d00de47d63a4fc716aa14d129c770391f7269d68186ea34ce6ecd431`
          - Same-job stage report: `80ffa88d6a2b6f1ad60c07ac9c38909b6a95fa842562b764bae7a679f95c37fa`
          - Count-guard reason: `2f8b62b6bfe0160adb296f831b192e29dfc85f7d46cf62c077dd1f9c7e901e2d`

          The completed one-off release/test/read workflow entrypoints are retired in the
          same evidence commit; their scripts, tests, runs, artifacts and consumed approval
          remain available. No production behavior is changed by this documentation cleanup.

          ## Historical ledger (earlier claims are scoped to their recorded milestones)

          '''
          output=prefix.encode()+old[len(heading):]
          assert hashlib.sha256(output).hexdigest()=='89255550d7f1bf3d5c4ec421b7c81cfb0e770d58a762436871a454e1f1cbfd1c'
          path.write_bytes(output)
          PY
          node --test tests/release.test.ts tests/output-scope-live-smoke.test.mjs
          node scripts/read-output-scope-result.mjs --test
      - name: Create the exact documentation-and-retirement commit object
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const parent=process.env.GITHUB_SHA,branch='fix/generation-audit-recovery-20261009';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(git('rev-parse','HEAD')!==parent||git('rev-parse','HEAD^')!=='ac9e9f8f506aff041a5b6a6662c9191af3462751')throw Error('Unexpected source');
          const api=async(method,path,body)=>{const r=await fetch('https://api.github.com/repos/teslaeco/WORLDIFACT/'+path,{method,redirect:'error',signal:AbortSignal.timeout(15000),headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok)throw Error('Source operation failed:'+r.status);return r.json();};
          if((await api('GET','git/ref/heads/'+branch)).object.sha!==parent)throw Error('Concurrent branch edit');
          const raw=await readFile('docs/CONTEST_STATUS.md');
          if(createHash('sha256').update(raw).digest('hex')!=='89255550d7f1bf3d5c4ec421b7c81cfb0e770d58a762436871a454e1f1cbfd1c')throw Error('Unexpected evidence bytes');
          const blob=await api('POST','git/blobs',{encoding:'base64',content:raw.toString('base64')});
          if(blob.sha!==createHash('sha1').update(Buffer.from('blob '+raw.length+'\0')).update(raw).digest('hex'))throw Error('Blob mismatch');
          const retired=['release-output-scope-once.yml','output-scope-live-smoke-once.yml','output-scope-result-once.yml','output-scope-cost-reason-once.yml','record-output-scope-evidence-once.yml'];
          const entries=[{path:'docs/CONTEST_STATUS.md',mode:'100644',type:'blob',sha:blob.sha},...retired.map(name=>({path:'.github/workflows/'+name,mode:'100644',type:'blob',sha:null}))];
          const tree=await api('POST','git/trees',{base_tree:git('rev-parse','HEAD^{tree}'),tree:entries});
          const commit=await api('POST','git/commits',{message:'docs: record deployed correction and failed live MCC acceptance\n\nKeep the original historical ledger and exact evidence. Retire completed one-off workflow entrypoints without touching consumed approval, source scripts, current product code, main, production or financial state. No new generation or background retry.',tree:tree.sha,parents:[parent]});
          const receipt={parent,commit:commit.sha,tree:tree.sha,documentSha256:'89255550d7f1bf3d5c4ec421b7c81cfb0e770d58a762436871a454e1f1cbfd1c',retired,branchUpdated:false,productionChanged:false};
          await mkdir('status-evidence',{recursive:true});await writeFile('status-evidence/commit.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-scope-status-${{ github.run_id }}
          path: status-evidence/commit.json
          retention-days: 7
          if-no-files-found: error
# No production environment, provider key, paid operation or branch update.
