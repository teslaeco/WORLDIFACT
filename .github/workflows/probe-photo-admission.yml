name: Probe photo validation without creating a job
on:
  push:
    branches: [fix/generation-diagnosis-20261011]
    paths: ['scripts/probe-photo-admission.mjs', '.github/workflows/probe-photo-admission.yml']
permissions:
  contents: read
concurrency:
  group: incident-generation-readonly-20261011
  cancel-in-progress: false
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test tests/probe-photo-admission.test.mjs
      - name: Verify non-billable invalid-ID probe
        run: echo "4a7a4bdfc54471bd1f300304457584ca98209bc11c043e44f152736d54aadbcc  scripts/probe-photo-admission.mjs" | sha256sum -c -
      - name: Validate synthetic photo with invalid ID and empty prompt
        run: node scripts/probe-photo-admission.mjs
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
