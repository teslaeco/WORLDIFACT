name: ECOMECH V4 genuine native Blender reconstruction — ZERO provider calls
on:
  push:
    branches: ['feat/ecomech-v4-real-sculpt-20261015']
    paths:
      - 'tools/ecomech/reconstruct_suit_from_reference_v4.py'
      - 'tools/ecomech/v4_reference_sculpt_pass.py'
      - 'tools/ecomech/render_reference_sculpt_v4.py'
      - 'tools/ecomech/ecomech_v4_approved_photo_annotation_DRAFT.json'
      - 'tools/ecomech/reference_silhouette_v4_draft.py'
      - '.github/workflows/ecomech-v4-native-sculpt.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-v4-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-original-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download existing Astra source GLB — DO NOT REGENERATE OR CHARGE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .astra-source
          gh run download 38638422388 --repo teslaeco/WORLDIFACT \
            --name ecomech-real-astra-original-evidence-7797880f6410bdb19636e242af22b0041b79b28c \
            --dir .astra-source
          printf '%s  %s\n' '7e7f3aea755dfdd0ad957124d7e1dc33004905e0052fdab3d60b587f34cdc7b4' '.astra-source/original.glb' | sha256sum --check
      - name: Download the exact approved IMAGE already sent with failed V4 job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .source-image
          gh run download 38653687131 --repo teslaeco/WORLDIFACT \
            --name ECOMECH-V4-ASTRA-WITH-ACTUAL-REFERENCE-8fcffb86c571a8cca7ad09e1401247bf08f41104 \
            --dir .source-image
          printf '%s  %s\n' '9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053' '.source-image/input-reference.png' | sha256sum --check
      - name: Check authored V4 geometry and exact-image QA scripts compile
        run: |
          python -m py_compile tools/ecomech/reconstruct_suit_from_reference_v4.py \
            tools/ecomech/v4_reference_sculpt_pass.py \
            tools/ecomech/render_reference_sculpt_v4.py \
            tools/ecomech/reference_silhouette_v4_draft.py
      - name: Install native Blender 4.3 from verified official release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0-linux-x64.tar.xz -o /tmp/blender-4.3.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0.sha256 -o /tmp/blender-4.3.0.sha256
          (cd /tmp && sha256sum --check --ignore-missing blender-4.3.0.sha256 && tar -xf blender-4.3.0-linux-x64.tar.xz)
      - name: Rebuild actual editable 3D mesh from exact V4 image and manually-guided anatomy
        shell: bash
        run: |
          mkdir -p .ecomech-v4-sculpt
          /tmp/blender-4.3.0-linux-x64/blender --background --factory-startup --python-exit-code 3 -t 4 \
            --python tools/ecomech/reconstruct_suit_from_reference_v4.py -- \
            .astra-source/original.glb \
            .source-image/input-reference.png \
            tools/ecomech/ecomech_v4_approved_photo_annotation_DRAFT.json \
            .ecomech-v4-sculpt
      - name: Validate ORIGINAL GLB v2 + real geometry + native PBR material images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          root=Path('.ecomech-v4-sculpt')
          report=json.loads((root/'MANIFEST_REFERENCE_V4.json').read_text())
          glb=root/'ECOMECH_V4_REFERENCE_RECONSTRUCTED_GAME.glb'
          blend=root/'ECOMECH_V4_EDITABLE_REAL_MESH.blend'
          assert glb.is_file() and blend.is_file()
          data=glb.read_bytes()
          assert data[:4]==b'glTF' and struct.unpack_from('<II',data,4)==(2,len(data))
          ln,code=struct.unpack_from('<II',data,12)
          assert code==0x4e4f534a
          doc=json.loads(data[20:20+ln])
          assert len(doc.get('meshes',[]))>=250
          names=[m.get('name','') for m in doc['meshes']]
          for required in ('V4_DOWNWARD_CURVED_GREEN_CHILI','V4_SKULL_STRUCTURAL_TAPER',
                           'V4_ARMOR_MAIN_SHOULDER','V4_LEFT_ARMOR_MORPHED_THIGH'):
              assert any(required in x for x in names),required
          assert len(doc.get('images',[]))>=8
          assert len(doc.get('materials',[]))>=8
          assert report['v4PackedPbrTextureMaps']>=8
          assert report['v4UvMeshObjects']>=100
          assert report['oracleOriginalSha256']=='7e7f3aea755dfdd0ad957124d7e1dc33004905e0052fdab3d60b587f34cdc7b4'
          assert report['userReferenceSourceSha256']=='9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053'
          assert report['referencePixelsAutomaticallyReconstructed'] is False
          assert report['astrARebilled'] is False and report['paidExternalCalls']==0
          assert report['modelQuality']=='UNREVIEWED' and report['makeApproved'] is False
          print('REAL_V4_GAME_BINARY_PASS',len(data),len(names),
            len(doc['images']),len(doc['materials']),hashlib.sha256(data).hexdigest())
          print('REAL_V4_BLEND_BYTES_SHA',blend.stat().st_size,hashlib.sha256(blend.read_bytes()).hexdigest())
          PY
      - name: Install independent physical triangle / reference outline QA
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'trimesh==4.11.1' 'opencv-python-headless==4.13.0.92' 'Pillow==11.3.0'
      - name: Compare actual GLB triangles against EXACT original photo; never auto-approve
        run: |
          python tools/ecomech/reference_silhouette_v4_draft.py \
            --glb .ecomech-v4-sculpt/ECOMECH_V4_REFERENCE_RECONSTRUCTED_GAME.glb \
            --source-image .source-image/input-reference.png \
            --target tools/ecomech/ecomech_v4_approved_photo_annotation_DRAFT.json \
            --output .ecomech-v4-sculpt \
            --expect-no-go --report-only
      - name: Real native PBR Blender render in four directions
        run: |
          /tmp/blender-4.3.0-linux-x64/blender --background --factory-startup --python-exit-code 3 -t 4 \
            --python tools/ecomech/render_reference_sculpt_v4.py -- \
            .ecomech-v4-sculpt/ECOMECH_V4_REFERENCE_RECONSTRUCTED_GAME.glb \
            .ecomech-v4-sculpt
          for view in front three_quarter side back; do
            test -s ".ecomech-v4-sculpt/ECOMECH_V4_NATIVE_${view}.png"
          done
      - name: Preserve REAL GLB + editable BLEND + renders + manifest/hashes even on errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecomech-v4-native-reference-rebuild-${{ github.sha }}
          path: .ecomech-v4-sculpt/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          compression-level: 0
