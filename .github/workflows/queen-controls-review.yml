name: Apply verified Queen controls
on:
  push:
    branches: [fix/queen-flight-controls-20260923]
    paths: [.github/workflows/queen-controls-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply exact public-source revisions with before and after hashes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          digest=lambda b:hashlib.sha256(b).hexdigest()
          seen=set()
          manifests=[('.queen-edits-1.json','aa0b93b639cb9cb4faf0cd00adffa09f748122cc22a8c65fba4f6ac8ccbeb170'),('.queen-edits-2.json','a3127a260e5dd220778a9f58522b14f130e1edb3b73e40aadf53707adad6c32a'),('.queen-edits-3.json','fad2962225a14a7c1ef4f608ecb46d3cbded1cae497f6ffef379ecc9ffbaf883')]
          for name,expected in manifests:
              raw=Path(name).read_bytes()
              assert digest(raw)==expected, 'Transport hash mismatch: '+name
              for item in json.loads(raw):
                  path=Path(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts and str(path) not in seen
                  assert path.parts[0] in ('src','tests','docs')
                  seen.add(str(path))
                  if item['before'] is None:
                      assert not path.exists(), 'New path already exists'
                      result=item['content']
                  else:
                      original=path.read_bytes()
                      assert digest(original)==item['before'], 'Baseline moved: '+str(path)
                      result=original.decode('utf-8')
                      end=len(result)
                      for start,stop,text in reversed(item['edits']):
                          assert 0<=start<=stop<=end
                          result=result[:start]+text+result[stop:]
                          end=start
                  encoded=result.encode('utf-8')
                  assert digest(encoded)==item['after'], 'Output mismatch: '+str(path)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(encoded)
                  print('Verified',path)
          assert len(seen)==11
          for name,_ in manifests: Path(name).unlink()
          Path('.github/workflows/queen-controls-review.yml').unlink()
          PY
      - run: npm ci
      - run: npm run typecheck
      - name: Focused behavior and preserved-geometry regressions
        run: node --test tests/queen-controls.test.ts tests/avatar-locomotion.test.ts tests/avatar-asset.test.ts tests/water-equipment.test.ts tests/world-presentation.test.ts tests/portal-entry.test.mjs
      - name: Commit only the exact reviewed final tree
        run: |
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = b8106362ce2f7c8530b6268a97c73a1b64d8913b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve original Queen flight, double jump, camera, meadow and mobile presentation'
          git push origin HEAD:refs/heads/fix/queen-flight-controls-20260923
