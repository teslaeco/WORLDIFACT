name: Complete Shop UI and repair historical test coupling
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['scripts/complete-shop-recovery.py', '.github/workflows/complete-shop-recovery.yml']
permissions:
  contents: write
concurrency:
  group: worldifact-shop-composer-source
  cancel-in-progress: false
jobs:
  verify-source:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.event.before == 'b67cb54b76c05e6e613d58b20779238022a42c4e' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Require reviewed original sources
        run: |
          test "$(git rev-parse HEAD^)" = b67cb54b76c05e6e613d58b20779238022a42c4e
          test "$(git hash-object scripts/stage-shop-composer.py)" = 2c8b6b9563300497f24430096ccdfd1aaeea18f5
          echo 'fd03929ccf64e35147ed6d9314c81dfb931cfad46df40c125982ff8df5469aa5  scripts/finish-shop-ui.patch' | sha256sum --check
      - run: npm ci
      - name: Reproduce and correct historical-worktree coupling
        run: python3 -B scripts/complete-shop-recovery.py
      - name: Verify preserved runtime, financial and deployment source
        run: git diff --exit-code HEAD -- server config wrangler.jsonc package.json package-lock.json src/lib/studioProtocol.ts .github/workflows/cloudflare.yml
      - run: node --test tests/failed-hold-release.test.mjs tests/shop-draft-lifecycle.test.mjs tests/shop-draft-reset.test.ts tests/credit-tools-panel.test.mjs tests/credits-membership-lifecycle.test.mjs
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Publish verified source objects, without advancing a branch or accessing production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFile,lstat,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const branch='fix/generation-audit-recovery-20261009', parent=process.env.GITHUB_SHA;
          const changed=['docs/CONTEST_STATUS.md','src/components/GenerationCostNotice.tsx','src/lib/generationQuote.ts','src/lib/studioDraft.ts','src/lib/useGenerationQuote.ts','src/pages/ShopPage.css','src/pages/ShopPage.tsx','tests/shop-draft-lifecycle.test.mjs','tests/shop-draft-reset.test.ts','src/components/CreditToolsPanel.tsx','src/components/CreditToolsPanel.css','src/pages/CreditsPage.tsx','tests/credit-tools-helper.mjs','tests/credit-tools-panel.test.mjs','tests/credits-membership-lifecycle.test.mjs','tests/failed-hold-release.test.mjs','tests/fixtures/failed-hold-release-38e7048c.source.txt'];
          const retired=['scripts/stage-shop-composer.py','scripts/shop-composer-regressions.source','scripts/shop-composer-unit.source','.github/workflows/stage-shop-composer.yml','.github/workflows/check-composer-reference-fixtures.yml','scripts/finish-shop-ui.patch','.github/workflows/finish-shop-ui-only.yml','scripts/complete-shop-recovery.py','.github/workflows/complete-shop-recovery.yml'];
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(process.env.GITHUB_REPOSITORY!=='teslaeco/WORLDIFACT'||process.env.GITHUB_REF!=='refs/heads/'+branch||git('rev-parse','HEAD')!==parent||git('rev-parse','HEAD^')!=='b67cb54b76c05e6e613d58b20779238022a42c4e')throw Error('Source scope mismatch');
          if(git('diff','--name-only','HEAD').split('\n').filter(Boolean).some(p=>!changed.includes(p)))throw Error('Unreviewed tracked source change');
          const api=async(method,path,body)=>{const r=await fetch('https://api.github.com/repos/teslaeco/WORLDIFACT/'+path,{method,redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok)throw Error('Source API failed: '+r.status);return r.json();};
          if((await api('GET','git/ref/heads/'+branch)).object.sha!==parent)throw Error('Concurrent branch change');
          git('add','--',...changed);git('rm','--',...retired);
          const expectedTree=git('write-tree'), entries=[];
          for(const path of changed){const info=await lstat(path),raw=await readFile(path);if(!info.isFile()||info.isSymbolicLink()||raw.length>4000000)throw Error('Invalid source object');const value=await api('POST','git/blobs',{encoding:'base64',content:raw.toString('base64')});if(value.sha!==createHash('sha1').update(Buffer.from('blob '+raw.length+'\0')).update(raw).digest('hex'))throw Error('Blob mismatch');entries.push({path,mode:'100644',type:'blob',sha:value.sha});}
          for(const path of retired)entries.push({path,mode:'100644',type:'blob',sha:null});
          const tree=await api('POST','git/trees',{base_tree:git('rev-parse','HEAD^{tree}'),tree:entries});if(tree.sha!==expectedTree)throw Error('Entire candidate tree mismatch');
          const commit=await api('POST','git/commits',{message:'fix: complete Shop recovery and verify historical releases against immutable source\n\nApply the existing composer and honest points UI. Keep original historical manifest and deployment guard unchanged; verify historical payload independently and test tampering. Full verification, foundations and Worker dry-run passed before source publication. No account mutation, coupon activation, paid generation or production deployment.',tree:tree.sha,parents:[parent]});
          const receipt={parent,commit:commit.sha,tree:tree.sha,changedFiles:changed,retired,fullVerificationPassed:true,foundationsPassed:true,workerDryRunPassed:true,branchUpdated:false,productionChanged:false,heldPointsReleased:false,couponsActivated:false};
          await mkdir('ui-source-evidence',{recursive:true});await writeFile('ui-source-evidence/commit.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-recovery-verified-source-${{ github.run_id }}
          path: ui-source-evidence/commit.json
          retention-days: 7
          if-no-files-found: error
# No production environment, provider secret, financial write or automatic merge.
