name: Inspect reported 3D failures without generation
on:
  push:
    branches: [fix/generation-diagnosis-20261011]
    paths: ['scripts/inspect-generation-failures.mjs', '.github/workflows/inspect-generation-failures.yml']
permissions:
  contents: read
concurrency:
  group: incident-generation-readonly-20261011
  cancel-in-progress: false
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test tests/inspect-generation-failures.test.mjs
      - name: Verify read-only collector
        run: echo "42f5109d74d43851548cb73c68b4b1640be9fe1fcd6581a4719b34125c74d20b  scripts/inspect-generation-failures.mjs" | sha256sum -c -
      - name: Read existing incident status and quality only
        run: node scripts/inspect-generation-failures.mjs
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
