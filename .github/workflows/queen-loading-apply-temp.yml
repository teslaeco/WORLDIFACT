name: Apply Queen loading patch (temporary)
on:
  push:
    branches: [fix/queen-loading-20260924]
    paths: [.github/workflows/queen-loading-apply-temp.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/queen-loading-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: queen-loading-transport-check
          path: ops/queen-loading.patch.b64
          retention-days: 1
      - name: Verify exact reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = pathlib.Path('ops/queen-loading.patch.b64').read_text()
          patch = gzip.decompress(base64.b64decode(encoded, validate=False))
          assert hashlib.sha256(patch).hexdigest() == 'c45d05164eee4b5d8a46be7daebc63a2204058c76c112db81d6fffda92d4817b', 'Transport hash mismatch; no application'
          pathlib.Path('/tmp/queen-loading.patch').write_bytes(patch)
          PY
          git apply --check /tmp/queen-loading.patch
          git apply /tmp/queen-loading.patch
      - name: Commit only the reviewed repair and remove transport files
        shell: bash
        run: |
          rm ops/queen-loading.patch.b64 .github/workflows/queen-loading-diagnostic-temp.yml .github/workflows/queen-loading-apply-temp.yml
          git add docs/AVATAR_LOADING_REPAIR_20260924.md docs/CONTEST_STATUS.md scripts/check-avatar-delivery.mjs server/avatar.ts server/worker.ts src/components/StartingWorld.tsx src/lib/avatarAsset.ts tests/avatar-delivery.test.ts tests/avatar-mobile-loading.test.ts ops/queen-loading.patch.b64 .github/workflows/queen-loading-diagnostic-temp.yml .github/workflows/queen-loading-apply-temp.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix original Queen delivery, caching and slow-network recovery'
          git push origin HEAD:fix/queen-loading-20260924
