name: ECOMECH TRELLIS2 audited session recovery (one free request, supervised)
on:
  push:
    branches: ['feat/reference-reconstruction-trellis2-20261015']
    paths: ['ops/reference-trellis2-session-recovery-once.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-trellis2-audited-session-recovery
  cancel-in-progress: false
jobs:
  recover-unsubmitted-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Only an explicit marker-only first attempt may execute
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          git diff-tree --no-commit-id --name-only -r HEAD | grep -qx ops/reference-trellis2-session-recovery-once.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Download original cancelled receipt and verify zero generation submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .session-audit
          test "$(gh run view 38735532844 -R teslaeco/WORLDIFACT --json conclusion --jq .conclusion)" = cancelled
          test "$(gh run view 38742089974 -R teslaeco/WORLDIFACT --json conclusion --jq .conclusion)" = success
          gh api repos/teslaeco/WORLDIFACT/actions/artifacts/11974132372/zip > .session-audit/previous.zip
          python tools/reference_reconstruction/recover_unsubmitted.py \
            --archive .session-audit/previous.zip --marker ops/reference-trellis2-session-recovery-once.json \
            --out session-recovery-evidence
      - name: Retrieve exact original PNG and reviewed draft mask coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .reference-source
          gh run download 38653687131 -R teslaeco/WORLDIFACT \
            --name ECOMECH-V4-ASTRA-WITH-ACTUAL-REFERENCE-8fcffb86c571a8cca7ad09e1401247bf08f41104 \
            --dir .reference-source
          printf '%s  %s\n' '9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053' '.reference-source/input-reference.png' | sha256sum --check
          gh api 'repos/teslaeco/WORLDIFACT/contents/tools/ecomech/v7_reference_annotation_DRAFT.json?ref=bd6de4e3d40c6671c6136bbc707bf7d397c179c4' --jq '.content' | base64 -d > .reference-source/annotation.json
      - name: Test transport and shutdown before accessing the free GPU service
        run: |
          python -m pip install --disable-pip-version-check 'gradio_client==2.0.3' 'Pillow==12.3.0' 'numpy==2.3.5' 'trimesh==4.11.1' 'opencv-python-headless==4.13.0.92'
          python -m unittest discover -s tools/reference_reconstruction -p 'test_*.py' -v
          python tools/reference_reconstruction/mask_reference.py --source .reference-source/input-reference.png --annotation .reference-source/annotation.json --out .reference-source/mask.png
      - name: One supervised official GPU session; do not restart on quota or failure
        run: |
          python tools/reference_reconstruction/official_demo_once.py \
            --source .reference-source/input-reference.png --mask .reference-source/mask.png \
            --job session-recovery-evidence/job.json --out session-recovery-evidence/result
      - name: Require real GLB bytes, not a green networking test or a generated poster
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/reference_reconstruction')
          from core import inspect_glb
          d=Path('session-recovery-evidence/result')
          receipt=json.loads((d/'attempt.json').read_text())
          assert receipt['status']=='ORIGINAL_GLB_RECEIVED_REQUIRES_INDEPENDENT_REVIEW'
          assert receipt['generationRequestsAttempted']==1 and receipt['exportRequestsAttempted']==1
          actual=inspect_glb(d/'ECOMECH_TRELLIS2_ORIGINAL_UNREVIEWED.glb')
          assert actual['sha256']==receipt['glb']['sha256']
          assert not receipt['visualAccepted'] and not receipt['printReady']
          assert receipt['newOpenAIRequests']==receipt['paidVendorRequests']==0
          print(json.dumps({'originalGLB':actual,'visualReview':'PENDING','supplierApproval':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ecomech-trellis2-audited-recovery-${{ github.sha }}
          path: |
            session-recovery-evidence/reconciliation.json
            session-recovery-evidence/result-supervisor.json
            session-recovery-evidence/result/attempt.json
            session-recovery-evidence/result/ECOMECH_TRELLIS2_ORIGINAL_UNREVIEWED.glb
            session-recovery-evidence/result/provider_renders/
          if-no-files-found: ignore
          retention-days: 14
