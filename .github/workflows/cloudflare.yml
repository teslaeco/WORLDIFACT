name: Publish WORLDIFACT and verify OpenAI setup
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to republish the reviewed release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY')
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Check deployment input names and format
        run: node scripts/release-check.ts credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - name: Select reviewed deployment configuration
        id: mode
        shell: bash
        run: |
          if test -f ops/LIVE_GENERATION_ONGOING_20260919; then
            node scripts/build-live-generation-config.ts
            echo 'config=.live-generation.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'mode=LIVE' >> "$GITHUB_OUTPUT"
            echo 'Ongoing LIVE marker present: deploying public generation without an application-level cumulative quota.'
          else
            echo 'config=wrangler.jsonc' >> "$GITHUB_OUTPUT"
            echo 'mode=DEMO' >> "$GITHUB_OUTPUT"
            echo 'No ongoing LIVE marker: deploying reviewed disabled-cost base configuration.'
          fi
      - name: Dry-run selected deployment configuration
        run: npx wrangler deploy --dry-run --config "${{ steps.mode.outputs.config }}" --outdir .wrangler/preview
      - name: Verify and sync OpenAI secrets
        id: openai
        run: node scripts/connect-openai.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_ACCESS_TOKEN: ${{ secrets.GENERATION_ACCESS_TOKEN }}
      - name: Sync owner and Oracle connection secrets
        run: node scripts/connect-platform.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
      - name: Sync optional payment credentials without activating checkout
        run: node scripts/connect-billing.ts
        env:
          STRIPE_CONFIG_SOURCE: ${{ vars.STRIPE_CONFIG_SOURCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SUBSCRIPTION_PRICE_ID: ${{ secrets.STRIPE_SUBSCRIPTION_PRICE_ID }}
          STRIPE_TOPUP_PRICE_ID: ${{ secrets.STRIPE_TOPUP_PRICE_ID }}
          STRIPE_PREVIOUS_TOPUP_PRICE_IDS: ${{ secrets.STRIPE_PREVIOUS_TOPUP_PRICE_IDS }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_MERCHANT_ID: ${{ secrets.PAYPAL_MERCHANT_ID }}
      - name: Prepare verified subscription cancellation before activating Stripe
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { prepareStripePortal, stripePortalErrorMessage } from './scripts/prepare-stripe-portal.ts';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          if (config.vars.ENABLE_BILLING === 'true') {
            try { console.log(JSON.stringify(await prepareStripePortal(process.env))); }
            catch (error) { console.error(stripePortalErrorMessage(error)); process.exitCode = 1; }
          } else console.log('Stripe activation is disabled; no portal settings changed.');
          JS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Verify Stripe can open and expire an unpaid subscription checkout
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { checkStripeCheckout, stripeCheckoutCheckErrorMessage } from './scripts/check-stripe-checkout.ts';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          if (config.vars.ENABLE_BILLING === 'true') {
            try { console.log(JSON.stringify(await checkStripeCheckout(process.env))); }
            catch (error) { console.error(stripeCheckoutCheckErrorMessage(error)); process.exitCode = 1; }
          } else console.log('Stripe activation is disabled; no checkout check performed.');
          JS
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Deploy reviewed WORLDIFACT release
        run: npx wrangler deploy --config "${{ steps.mode.outputs.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-deploy.ndjson
      - name: Verify published HTML, assets and no-cost DEMO API path
        id: release
        run: node scripts/release-check.ts smoke
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-deploy.ndjson
      - name: Report deployed generation capability without spending
        run: |
          node --input-type=module - <<'JS'
          import { inspectWorldifactServices } from './scripts/check-froge-external.mjs'
          const services = await inspectWorldifactServices()
          console.log(JSON.stringify({ checkedAt: new Date().toISOString(), deploymentMode: '${{ steps.mode.outputs.mode }}', services }, null, 2))
          console.log('Read-only deployment diagnostic. No model request is made by this step.')
          JS
      - name: Verify activated Stripe readiness and payment request guards without a charge
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          if (config.vars.ENABLE_BILLING !== 'true') {
            console.log('Stripe activation is disabled in the reviewed configuration.');
            process.exit(0);
          }
          const origin = 'https://worldifact.xodobrox.workers.dev';
          async function request(path, expectedStatus, options = {}) {
            const response = await fetch(origin + path, { ...options, redirect: 'error', signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, expectedStatus, `${path}: expected HTTP ${expectedStatus}`);
            assert.match(response.headers.get('content-type') ?? '', /application\/json/);
            return response.json();
          }
          const status = await request('/api/billing/status', 200);
          assert.equal(status.status, 'CONFIGURED');
          assert.equal(status.mode, 'live');
          assert.equal(status.cardReady, true);
          assert.equal(status.topupReady, true);
          assert.equal(status.checkoutReady, true);
          assert.equal(status.googlePay, 'eligible_devices');
          assert.deepEqual(status.price, { amount: 2999, currency: 'USD', credits: 1500, kind: 'one_time' });
          assert.deepEqual(status.subscriptionPrice, { amount: 2999, currency: 'USD', credits: 1500, kind: 'subscription', interval: 'month' });
          const post = { method: 'POST', headers: { 'Content-Type': 'application/json', Origin: origin }, body: JSON.stringify({ kind: 'topup' }) };
          await request('/api/billing/checkout', 401, post);
          await request('/api/billing/checkout', 403, { ...post, headers: { ...post.headers, Origin: 'https://example.invalid' } });
          const webhook = await request('/api/billing/webhook', 400, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          assert.equal(webhook.error, 'Invalid webhook signature.');
          console.log('PASS: live Stripe configuration, USD 29.99 / 1500 credits, monthly and one-time offers, Google Pay eligibility, login/origin/signature guards. No checkout, charge or credit grant was created; settlement remains unverified.');
          JS
