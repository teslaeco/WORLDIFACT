name: Publish WORLDIFACT and verify OpenAI setup
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to republish the reviewed release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  deploy:
    needs: context_tools_preflight
    if: needs.context_tools_preflight.result == 'success' && needs.context_tools_preflight.outputs.deploy_allowed == 'true' && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY'))
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify one-time pipeline release scope before credential setup
        id: billing_scope
        run: node scripts/select-pipeline-only-release.mjs >> "$GITHUB_OUTPUT"
      - name: Check deployment input names and format
        run: node scripts/release-check.ts credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - name: Select reviewed deployment configuration
        id: mode
        env:
          AI_SHOP_UI: ${{ steps.billing_scope.outputs.ai_shop_ui }}
          PAID_POINTS_ADMISSION: ${{ steps.billing_scope.outputs.paid_points_admission }}
          BOUNDED_SOFTWARE_PREVIEW: ${{ steps.billing_scope.outputs.bounded_software_preview }}
          OWNER_RESERVE_ADJUSTMENT: ${{ steps.billing_scope.outputs.owner_reserve_adjustment }}
          ACCOUNT_PURCHASE_EVIDENCE: ${{ steps.billing_scope.outputs.account_purchase_evidence }}
          SUBSCRIPTION_UPGRADE_REPAIR: ${{ steps.billing_scope.outputs.subscription_upgrade_repair }}
        shell: bash
        run: |
          case "${AI_SHOP_UI:-false}" in
            true|false) ;;
            *) echo '::error::Unrecognized AI Shop UI release scope; publication stopped.'; exit 1 ;;
          esac
          if test "${AI_SHOP_UI:-false}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs --ai-shop-ui
            echo 'config=.ai-shop-ui.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'ai_shop_ui=true' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'AI Shop UI and public gallery: preserve deployed variables, secrets, prices, payment settings and generation guards.'
          elif test "${PAID_POINTS_ADMISSION:-false}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs --paid-points-admission
            echo 'config=.paid-points-admission.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'paid_points_admission=true' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'Paid points admission: preserve deployed variables, secrets, prices, per-job caps and operator guards; no ledger mutation or model test during deployment.'
          elif test "${BOUNDED_SOFTWARE_PREVIEW:-false}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs --bounded-software-preview
            echo 'config=.bounded-software-preview.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'bounded_software_preview=true' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'Bounded software preview: preserve deployed variables, secrets, payments and per-job limits.'
          elif test "${OWNER_RESERVE_ADJUSTMENT:-false}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs --owner-reserve-adjustment
            echo 'config=.owner-reserve-adjustment.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'owner_reserve_adjustment=true' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'Owner reserve adjustment: preserve deployed variables and secrets; no allocation or model test during deployment.'
          elif test "${ACCOUNT_PURCHASE_EVIDENCE:-false}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs --account-purchase-evidence
            echo 'config=.account-purchase-evidence.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'account_purchase_evidence=true' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'Account purchase evidence: preserve runtime gates, prices, variables and secrets.'
          elif test "${SUBSCRIPTION_UPGRADE_REPAIR:-false}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs --subscription-upgrade-repair
            echo 'config=.subscription-upgrade.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'subscription_upgrade_repair=true' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'Subscription upgrade repair: preserve runtime gates, prices, variables and secrets.'
          elif test "${{ steps.billing_scope.outputs.compatible_mcc_rollback }}" = 'true'; then
            node scripts/build-compatible-mcc-config.mjs
            echo 'config=.compatible-mcc.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'mode=PRESERVE' >> "$GITHUB_OUTPUT"
            echo 'Compatible UI rollback: no declared vars; preserve deployed variables and secrets.'
          elif test -f ops/LIVE_GENERATION_ONGOING_20260919; then
            node scripts/build-live-generation-config.ts
            echo 'config=.live-generation.wrangler.json' >> "$GITHUB_OUTPUT"
            echo 'mode=LIVE' >> "$GITHUB_OUTPUT"
            echo 'Ongoing LIVE marker present: deploying public generation without an application-level cumulative quota.'
          else
            echo 'config=wrangler.jsonc' >> "$GITHUB_OUTPUT"
            echo 'mode=DEMO' >> "$GITHUB_OUTPUT"
            echo 'No ongoing LIVE marker: deploying reviewed disabled-cost base configuration.'
          fi
      - name: Verify guarded detailed worker before restoring signed model route
        if: steps.mode.outputs.mode == 'LIVE'
        run: node scripts/restore-detailed-studio-config.mjs "${{ steps.mode.outputs.config }}"
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
      - name: Dry-run selected deployment configuration
        run: npx wrangler deploy --dry-run --config "${{ steps.mode.outputs.config }}" --outdir .wrangler/preview
      - name: Verify and sync OpenAI secrets
        id: openai
        if: steps.mode.outputs.mode != 'PRESERVE'
        run: node scripts/connect-openai.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_ACCESS_TOKEN: ${{ secrets.GENERATION_ACCESS_TOKEN }}
      - name: Sync owner and Oracle connection secrets
        if: steps.mode.outputs.mode != 'PRESERVE'
        run: node scripts/connect-platform.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
      - name: Sync optional payment credentials without activating checkout
        if: steps.billing_scope.outputs.preserve_billing == 'false'
        run: node scripts/connect-billing.ts
        env:
          STRIPE_CONFIG_SOURCE: ${{ vars.STRIPE_CONFIG_SOURCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SUBSCRIPTION_PRICE_ID: ${{ secrets.STRIPE_SUBSCRIPTION_PRICE_ID }}
          STRIPE_TOPUP_PRICE_ID: ${{ secrets.STRIPE_TOPUP_PRICE_ID }}
          STRIPE_PREVIOUS_TOPUP_PRICE_IDS: ${{ secrets.STRIPE_PREVIOUS_TOPUP_PRICE_IDS }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_MERCHANT_ID: ${{ secrets.PAYPAL_MERCHANT_ID }}
      - name: Prepare verified subscription cancellation before activating Stripe
        if: steps.billing_scope.outputs.preserve_billing == 'false'
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { prepareStripePortal, stripePortalErrorMessage } from './scripts/prepare-stripe-portal.ts';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          if (config.vars.ENABLE_BILLING === 'true') {
            try { console.log(JSON.stringify(await prepareStripePortal(process.env))); }
            catch (error) { console.error(stripePortalErrorMessage(error)); process.exitCode = 1; }
          } else console.log('Stripe activation is disabled; no portal settings changed.');
          JS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Verify Stripe can open and expire an unpaid subscription checkout
        if: steps.billing_scope.outputs.preserve_billing == 'false'
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { checkStripeCheckout, stripeCheckoutCheckErrorMessage } from './scripts/check-stripe-checkout.ts';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          if (config.vars.ENABLE_BILLING === 'true') {
            try { console.log(JSON.stringify(await checkStripeCheckout(process.env))); }
            catch (error) { console.error(stripeCheckoutCheckErrorMessage(error)); process.exitCode = 1; }
          } else console.log('Stripe activation is disabled; no checkout check performed.');
          JS
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Verify Pro and Studio Stripe checkouts can open and expire without charge
        if: steps.billing_scope.outputs.preserve_billing == 'false'
        run: node --experimental-strip-types scripts/check-stripe-astra-checkouts.ts
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Verify both pinned public gallery models before UI deployment
        if: steps.mode.outputs.ai_shop_ui == 'true'
        run: node scripts/prepare-public-gallery.mjs --verify-dist
      - name: Deploy reviewed WORLDIFACT release
        run: |
          if test "${{ steps.billing_scope.outputs.preserve_remote_vars }}" = 'true'; then
            # Wrangler can print dashboard-only values in its configuration diff.
            # Keep the deployment receipt, but discard potentially private CLI output.
            if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false \
              npx wrangler deploy --config "${{ steps.mode.outputs.config }}" --keep-vars > /dev/null 2>&1; then
              echo 'Deployment command completed with remote variables preserved; strict receipt and asset verification follows.'
            else
              echo '::error::Deployment failed. Potentially private command output was suppressed.'
              exit 1
            fi
          else
            npx wrangler deploy --config "${{ steps.mode.outputs.config }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-deploy.ndjson
      - name: Verify published HTML, assets and no-cost DEMO API path
        id: release
        run: |
          case "${AI_SHOP_UI:-false}" in
            true|false) ;;
            *) echo '::error::Unrecognized AI Shop UI release scope; verification stopped.'; exit 1 ;;
          esac
          if test "${AI_SHOP_UI:-false}" = 'true'; then
            node --input-type=module <<'JS'
          import { appendFile, readFile } from 'node:fs/promises';
          import { selectPipelineReleaseOptions } from './scripts/select-pipeline-only-release.mjs';
          import { readDeployment } from './scripts/release-check.ts';
          import { checkCompatibleMccRelease } from './scripts/check-compatible-mcc-release.mjs';
          import { verifyPublicGalleryAssets } from './scripts/prepare-public-gallery.mjs';
          let stage = 'release_scope';
          try {
            const options = selectPipelineReleaseOptions();
            if (options.aiShopUi !== true || options.preserveBilling !== true || options.preserveRemoteVars !== true || options.preserveSecrets !== true) throw new Error('Unreviewed AI Shop UI and public gallery release.');
            stage = 'deployment_receipt';
            const deployment = readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8'));
            console.log(`Cloudflare version: ${deployment.versionId}`);
            stage = 'public_gallery';
            await verifyPublicGalleryAssets();
            const result = await checkCompatibleMccRelease(deployment, { onStage: value => {
              if (['health', 'local_assets', 'foundation_manifest', 'html_routes', 'static_assets'].includes(value)) stage = value;
            } });
            stage = 'report';
            console.log(`PASS: AI Shop UI and public gallery; ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} exact built files. GET-only health/static verification; no financial probes, secret synchronization or generation requests.`);
            if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, `url=${result.origin}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `## WORLDIFACT AI Shop UI and public gallery\n\n[Open WORLDIFACT](${result.origin})\n\nCloudflare version: \`${result.versionId}\`\n\nGET-only verification matched ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} built files. Deployed variables, secrets, bindings and migrations were preserved. No financial probes or generation requests. Browser/device appearance remains unverified.\n`);
          } catch {
            console.error(`PRESERVING_RELEASE_NOT_VERIFIED: ${stage}; read-only publication checks failed. No generation, payment or secret synchronization was attempted.`);
            process.exitCode = 1;
          }
          JS
          elif test "${PAID_POINTS_ADMISSION:-false}" = 'true'; then
            node --input-type=module <<'JS'
          import { appendFile, readFile } from 'node:fs/promises';
          import { selectPipelineReleaseOptions } from './scripts/select-pipeline-only-release.mjs';
          import { readDeployment } from './scripts/release-check.ts';
          import { checkCompatibleMccRelease } from './scripts/check-compatible-mcc-release.mjs';
          let stage = 'release_scope';
          try {
            const options = selectPipelineReleaseOptions();
            if (options.paidPointsAdmission !== true || options.preserveBilling !== true || options.preserveRemoteVars !== true || options.preserveSecrets !== true) throw new Error('Unreviewed paid points admission release.');
            stage = 'deployment_receipt';
            const deployment = readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8'));
            console.log(`Cloudflare version: ${deployment.versionId}`);
            const result = await checkCompatibleMccRelease(deployment, { onStage: value => {
              if (['health', 'local_assets', 'foundation_manifest', 'html_routes', 'static_assets'].includes(value)) stage = value;
            } });
            stage = 'report';
            console.log(`PASS: paid points admission; ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} exact built files. GET-only health/static verification; no ledger mutation, financial probes, secret synchronization or generation requests.`);
            if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, `url=${result.origin}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `## WORLDIFACT paid points admission\n\n[Open WORLDIFACT](${result.origin})\n\nCloudflare version: \`${result.versionId}\`\n\nGET-only verification matched ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} built files. Deployed variables, secrets, bindings and migrations were preserved. No ledger mutation, financial probes or generation requests. Browser/device appearance remains unverified.\n`);
          } catch {
            console.error(`PRESERVING_RELEASE_NOT_VERIFIED: ${stage}; read-only publication checks failed. No ledger mutation, generation, payment or secret synchronization was attempted.`);
            process.exitCode = 1;
          }
          JS
          elif test "${BOUNDED_SOFTWARE_PREVIEW:-false}" = 'true'; then
            node --input-type=module <<'JS'
          import { appendFile, readFile } from 'node:fs/promises';
          import { selectPipelineReleaseOptions } from './scripts/select-pipeline-only-release.mjs';
          import { readDeployment } from './scripts/release-check.ts';
          import { checkCompatibleMccRelease } from './scripts/check-compatible-mcc-release.mjs';
          let stage = 'release_scope';
          try {
            const options = selectPipelineReleaseOptions();
            if (options.boundedSoftwarePreview !== true || options.preserveBilling !== true || options.preserveRemoteVars !== true || options.preserveSecrets !== true) throw new Error('Unreviewed bounded software preview release.');
            stage = 'deployment_receipt';
            const deployment = readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8'));
            console.log(`Cloudflare version: ${deployment.versionId}`);
            const result = await checkCompatibleMccRelease(deployment, { onStage: value => {
              if (['health', 'local_assets', 'foundation_manifest', 'html_routes', 'static_assets'].includes(value)) stage = value;
            } });
            stage = 'report';
            console.log(`PASS: bounded software preview; ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} exact built files. GET-only health/static verification; no financial probes, secret synchronization or generation requests.`);
            if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, `url=${result.origin}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `## WORLDIFACT bounded software preview\n\n[Open WORLDIFACT](${result.origin})\n\nCloudflare version: \`${result.versionId}\`\n\nGET-only verification matched ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} built files. Deployed variables, secrets, bindings and migrations were preserved. No financial probes or generation requests. Browser/device appearance remains unverified.\n`);
          } catch {
            console.error(`PRESERVING_RELEASE_NOT_VERIFIED: ${stage}; read-only publication checks failed. No generation, payment or secret synchronization was attempted.`);
            process.exitCode = 1;
          }
          JS
          elif test "${OWNER_RESERVE_ADJUSTMENT:-false}" = 'true'; then
            node --input-type=module <<'JS'
          import { appendFile, readFile } from 'node:fs/promises';
          import { selectPipelineReleaseOptions } from './scripts/select-pipeline-only-release.mjs';
          import { readDeployment } from './scripts/release-check.ts';
          import { checkCompatibleMccRelease } from './scripts/check-compatible-mcc-release.mjs';
          let stage = 'release_scope';
          try {
            const options = selectPipelineReleaseOptions();
            if (options.ownerReserveAdjustment !== true || options.preserveBilling !== true || options.preserveRemoteVars !== true || options.preserveSecrets !== true) throw new Error('Unreviewed owner reserve release.');
            stage = 'deployment_receipt';
            const deployment = readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8'));
            console.log(`Cloudflare version: ${deployment.versionId}`);
            const result = await checkCompatibleMccRelease(deployment, { onStage: value => {
              if (['health', 'local_assets', 'foundation_manifest', 'html_routes', 'static_assets'].includes(value)) stage = value;
            } });
            stage = 'report';
            console.log(`PASS: owner reserve adjustment; ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} exact built files. GET-only health/static verification; no reserve allocation, financial probes, secret synchronization or generation requests.`);
            if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, `url=${result.origin}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `## WORLDIFACT owner reserve adjustment\n\n[Open WORLDIFACT](${result.origin})\n\nCloudflare version: \`${result.versionId}\`\n\nGET-only verification matched ${result.htmlRoutes} HTML routes and ${result.verifiedAssets} built files. Deployed variables, secrets, bindings and migrations were preserved. No reserve allocation, financial probes or generation requests. Browser/device appearance remains unverified.\n`);
          } catch {
            console.error(`PRESERVING_RELEASE_NOT_VERIFIED: ${stage}; read-only publication checks failed. No reserve allocation, generation, payment or secret synchronization was attempted.`);
            process.exitCode = 1;
          }
          JS
          elif test "${ACCOUNT_PURCHASE_EVIDENCE:-false}" = 'true'; then
            node scripts/check-compatible-mcc-release.mjs --account-purchase-evidence
          elif test "${SUBSCRIPTION_UPGRADE_REPAIR:-false}" = 'true'; then
            node scripts/check-compatible-mcc-release.mjs --subscription-upgrade-repair
          elif test "${{ steps.mode.outputs.mode }}" = 'PRESERVE'; then
            node scripts/check-compatible-mcc-release.mjs
          else
            node scripts/release-check.ts smoke
          fi
        env:
          AI_SHOP_UI: ${{ steps.mode.outputs.ai_shop_ui }}
          PAID_POINTS_ADMISSION: ${{ steps.mode.outputs.paid_points_admission }}
          BOUNDED_SOFTWARE_PREVIEW: ${{ steps.mode.outputs.bounded_software_preview }}
          OWNER_RESERVE_ADJUSTMENT: ${{ steps.mode.outputs.owner_reserve_adjustment }}
          ACCOUNT_PURCHASE_EVIDENCE: ${{ steps.mode.outputs.account_purchase_evidence }}
          SUBSCRIPTION_UPGRADE_REPAIR: ${{ steps.mode.outputs.subscription_upgrade_repair }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-deploy.ndjson
      - name: Verify published detailed route without creating a model
        if: steps.mode.outputs.mode == 'LIVE'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin = 'https://worldifact.xodobrox.workers.dev';
          const response = await fetch(origin + '/api/studio/status', {redirect:'error',signal:AbortSignal.timeout(20000)});
          assert.equal(response.status,200);
          const status = await response.json();
          assert.equal(status.ready,true);
          assert.equal(status.detailedReady,true);
          assert.equal(status.costGuardReady,true);
          assert.equal(status.outputPolicyReady,true);
          assert.equal(status.photoReady,true);
          assert.equal(status.detailedReferenceLimit,4);
          assert.equal(status.accountRequired,true);
          assert.equal(status.newJobPolicy,'legacy-usd175-v1');
          assert.notEqual(status.tiersReady,true);
          const denied = await fetch(origin + '/api/studio/prepare', {method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({worldId:'enchanted-ai-shop',prompt:'Character reference routing guard probe',purpose:'game',textureMaxSize:4096,photos:[]})});
          assert.equal(denied.status,401);
          const fundingDenied = await fetch(origin + '/api/studio/reconcile-budget', {method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({cursor:null})});
          assert.equal(fundingDenied.status,401);
          const foreignFunding = await fetch(origin + '/api/studio/reconcile-budget', {method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Origin:'https://example.invalid','Content-Type':'application/json'},body:JSON.stringify({cursor:null})});
          assert.equal(foreignFunding.status,403);
          console.log('PASS: published funding reconciliation requires same-origin authenticated ownership; no account change or provider generation.');
          console.log('PASS: detailed route READY, four views, current cost/output guards, unauthenticated preparation rejected; no paid generation.');
          JS
      - name: Report deployed generation capability without spending
        if: steps.mode.outputs.mode != 'PRESERVE'
        run: |
          node --input-type=module - <<'JS'
          import { inspectWorldifactServices } from './scripts/check-froge-external.mjs'
          const services = await inspectWorldifactServices()
          console.log(JSON.stringify({ checkedAt: new Date().toISOString(), deploymentMode: '${{ steps.mode.outputs.mode }}', services }, null, 2))
          console.log('Read-only deployment diagnostic. No model request is made by this step.')
          JS
      - name: Verify activated Stripe readiness and payment request guards without a charge
        if: steps.billing_scope.outputs.preserve_billing == 'false'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          if (config.vars.ENABLE_BILLING !== 'true') {
            console.log('Stripe activation is disabled in the reviewed configuration.');
            process.exit(0);
          }
          const origin = 'https://worldifact.xodobrox.workers.dev';
          async function request(path, expectedStatus, options = {}) {
            const response = await fetch(origin + path, { ...options, redirect: 'error', signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, expectedStatus, `${path}: expected HTTP ${expectedStatus}`);
            assert.match(response.headers.get('content-type') ?? '', /application\/json/);
            return response.json();
          }
          const status = await request('/api/billing/status', 200);
          assert.equal(status.status, 'CONFIGURED');
          assert.equal(status.mode, 'live');
          assert.equal(status.cardReady, true);
          assert.equal(status.topupReady, true);
          assert.equal(status.checkoutReady, true);
          assert.equal(status.plans?.pro?.checkoutReady, true);
          assert.equal(status.plans?.studio?.checkoutReady, true);
          assert.equal(status.plans?.pro?.amountCents, 9999);
          assert.equal(status.plans?.studio?.amountCents, 14999);
          assert.equal(status.googlePay, 'eligible_devices');
          assert.deepEqual(status.price, { amount: 2999, currency: 'USD', credits: 1500, kind: 'one_time' });
          assert.deepEqual(status.subscriptionPrice, { amount: 2999, currency: 'USD', credits: 1500, kind: 'subscription', interval: 'month' });
          const post = { method: 'POST', headers: { 'Content-Type': 'application/json', Origin: origin }, body: JSON.stringify({ kind: 'topup' }) };
          await request('/api/billing/checkout', 401, post);
          await request('/api/billing/checkout', 403, { ...post, headers: { ...post.headers, Origin: 'https://example.invalid' } });
          const webhook = await request('/api/billing/webhook', 400, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          assert.equal(webhook.error, 'Invalid webhook signature.');
          console.log('PASS: live Stripe configuration, USD 29.99 / 1500 credits, monthly and one-time offers, Google Pay eligibility, login/origin/signature guards. No checkout, charge or credit grant was created; settlement remains unverified.');
          JS

  context_tools_preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_allowed: ${{ steps.scope.outputs.deploy_allowed }}
      failed_hold_waiver: ${{ steps.scope.outputs.failed_hold_waiver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify exact tools-only release before production admission
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  scripts/select-context-tools-release.mjs\n' '7c97d618461501290b1f1a95d345cf4911abbf54c16ab121ab48fefac343ea5a' | sha256sum -c - >&2
          printf '%s  scripts/select-construction-tools-release.mjs\n' '0837a2346e339f4e2510e5e000fb58baeeb074df50d36afb832d6fab68ad05bf' | sha256sum -c - >&2
          printf '%s  config/oracle-construction-tools-release.json\n' '6f0480500ed3ac2f5fb7f4099a8abb9c7e480524289c18feb52900426ae70c0e' | sha256sum -c - >&2
          printf '%s  scripts/select-failed-hold-release.mjs\n' '1d226e43f5ad1cea1c05bfdfb9cbf0b6131871b15f628d65d76f591f41ce7bda' | sha256sum -c - >&2
          printf '%s  config/failed-hold-release.json\n' 'acd8e35de14db79a5e9d3b4b1fa92d5f637543df3e9301958d0b2e70b087e17e' | sha256sum -c - >&2
          node scripts/select-failed-hold-release.mjs >> "$GITHUB_OUTPUT"

  failed_hold_release:
    needs: context_tools_preflight
    if: needs.context_tools_preflight.result == 'success' && needs.context_tools_preflight.outputs.failed_hold_waiver == 'true' && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY'))
    environment:
      name: production
      url: ${{ steps.failed_hold_receipt.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Reverify exact incident release before credential setup
        run: node scripts/select-failed-hold-release.mjs --require-waiver
      - name: Check incident deployment input names and format
        run: node scripts/release-check.ts credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - name: Prepare configuration preserving incident release
        run: node scripts/prepare-failed-hold-release.mjs
      - name: Dry-run incident Worker and assets
        run: npx wrangler deploy --dry-run --config .failed-hold-release.wrangler.json --outdir .wrangler/preview
      - name: Verify pinned public gallery files
        run: node scripts/prepare-public-gallery.mjs --verify-dist
      - name: Deploy incident Worker and assets with remote configuration preserved
        run: |
          if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false \
            npx wrangler deploy --config .failed-hold-release.wrangler.json --keep-vars > /dev/null 2>&1; then
            echo 'Deployment command completed; strict receipt and static verification follows.'
          else
            echo '::error::Deployment failed. Potentially private command output was suppressed.'
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-failed-hold-deploy.ndjson
      - name: Verify incident assets and exclusive Worker traffic
        id: failed_hold_receipt
        run: node scripts/check-failed-hold-release.mjs
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-failed-hold-deploy.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
