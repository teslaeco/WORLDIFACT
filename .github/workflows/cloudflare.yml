name: Review and explicitly publish full MCC restoration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_REVIEWED_FULL_MCC after the exact cutover review is approved
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Prove the whole committed source against the exact historical tree
        run: node scripts/check-full-mcc-source.mjs --committed > "$RUNNER_TEMP/full-mcc-source-proof.json"
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - name: Build minimal reviewed configuration without syncing runtime settings
        run: node scripts/build-full-mcc-config.mjs
      - name: Package only; no remote operation or paid request
        run: npx wrangler deploy --dry-run --keep-vars --config .wrangler/full-mcc.wrangler.json --outdir .wrangler/full-mcc-preview
      - name: Preserve exact source proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-mcc-source-proof
          path: ${{ runner.temp }}/full-mcc-source-proof.json
          if-no-files-found: error
  deploy:
    needs: review
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH_REVIEWED_FULL_MCC'
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Fail closed before preparing publication
        run: node scripts/check-full-mcc-cutover.mjs
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/foundations
      - run: node scripts/build-full-mcc-config.mjs
      - name: Recheck exact source and cutover expiry immediately before deployment
        id: deploy
        shell: bash
        run: |
          node scripts/check-full-mcc-cutover.mjs
          node scripts/release-check.ts credentials
          test ! -e "$WRANGLER_OUTPUT_FILE_PATH"
          npx wrangler deploy --keep-vars --config .wrangler/full-mcc.wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/full-mcc-deploy.ndjson
      - name: GET-only health and exact static hashes using the original deployment receipt
        id: release
        run: node scripts/check-full-mcc-release.mjs
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/full-mcc-deploy.ndjson
      - name: Preserve the original unmodified deployment records even when smoke fails
        if: always() && steps.deploy.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-mcc-original-deployment-receipt
          path: ${{ runner.temp }}/full-mcc-deploy.ndjson
          if-no-files-found: warn
