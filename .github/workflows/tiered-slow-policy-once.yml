name: Activate tiered Slow policy once

on:
  push:
    branches: [main]
    paths:
      - 'ops/TIERED_SLOW_POLICY_20261014.json'
      - '.github/workflows/tiered-slow-policy-once.yml'

permissions:
  contents: read

concurrency:
  group: worldifact-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production
      url: ${{ steps.verify.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact policy activation envelope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bbb987cfa68ec17328a3da510782de4f6cd0bb22"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/tiered-slow-policy-once.yml"
          test "${changed[1]}" = "ops/TIERED_SLOW_POLICY_20261014.json"
      - name: Check deployment credentials
        run: node scripts/release-check.ts credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - name: Verify tier and Studio contracts
        run: node --experimental-strip-types --test tests/studio-priced-submission.test.ts tests/studio-api.test.ts tests/paid-points-settlement-api.test.ts
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - name: Build config preserving every existing remote value except reviewed policy
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises'
          import { buildAiShopUiConfig } from './scripts/build-compatible-mcc-config.mjs'
          const base=JSON.parse(await readFile('wrangler.jsonc','utf8'))
          const config=buildAiShopUiConfig(base,{aiShopUi:true,preserveBilling:true,preserveRemoteVars:true,preserveSecrets:true})
          config.vars={STUDIO_NEW_JOB_POLICY:'tiered-v1'}
          await writeFile('.tiered-slow.wrangler.json',JSON.stringify(config,null,2)+'\n',{mode:0o600})
          JS
      - name: Dry-run exact policy release
        run: npx wrangler deploy --dry-run --config .tiered-slow.wrangler.json --outdir .wrangler/preview
      - name: Deploy policy while retaining all other remote variables
        run: |
          set -euo pipefail
          if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false \
            npx wrangler deploy --config .tiered-slow.wrangler.json --keep-vars > /dev/null 2>&1; then
            echo "Policy deployment completed; read-only verification follows."
          else
            echo "::error::Policy deployment failed; potentially private output suppressed."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-tiered-slow.ndjson
      - name: Verify tiered Slow policy live without generation
        id: verify
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile } from 'node:fs/promises'
          const origin='https://worldifact.xodobrox.workers.dev'
          const r=await fetch(origin+'/api/studio/status',{redirect:'error',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)})
          assert.equal(r.status,200)
          const s=await r.json()
          assert.equal(s.ready,true)
          assert.equal(s.detailedReady,true)
          assert.equal(s.newJobPolicy,'tiered-v1')
          assert.equal(s.tiersReady,true)
          assert.equal(s.pricingRevision,'studio-pricing-v1')
          assert.equal(s.studioAdmissionRevision,'oracle-durable-admission-v1')
          assert.equal(s.studioExecutionRevision,'studio-execution-v1')
          assert.deepEqual([...s.studioExecutionModels].sort(),['astra','luna','sol'])
          if(process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT,'url='+origin+'\n')
          console.log(JSON.stringify({ready:s.ready,newJobPolicy:s.newJobPolicy,tiersReady:s.tiersReady,pricingRevision:s.pricingRevision,models:s.studioExecutionModels}))
          JS
