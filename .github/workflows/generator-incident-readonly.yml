name: Read failed generator incident without generation
on:
  push:
    branches: [fix/generator-budget-diagnosis-20261010]
    paths:
      - scripts/inspect-generator-incident.mjs
      - .github/workflows/generator-incident-readonly.yml
permissions:
  contents: read
concurrency:
  group: generator-incident-20261010
  cancel-in-progress: false
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify reviewed GET-only reader
        run: echo "06f92d9e7576ad0afbbc8302e65c455af0d099a7f3770c0a7abae140dec934d1  scripts/inspect-generator-incident.mjs" | sha256sum -c -
      - run: node --test tests/generator-incident.test.mjs
      - name: Read fixed failed job and sanitized cost evidence
        run: node scripts/inspect-generator-incident.mjs
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
