name: Verify deployed library and reference quality once
on:
  push:
    branches: ['ops/verify-library-quality-production-20261002']
    paths: ['.github/workflows/verify-library-quality-production-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only production library assets and Studio status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          origin='https://worldifact.xodobrox.workers.dev'
          def get(path,limit=2_000_000):
              req=urllib.request.Request(origin+path,headers={'User-Agent':'WORLDIFACT-readonly-smoke/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(limit+1)
                  assert len(body)<=limit
                  return r.status,body
          for route in ['/lab','/builder','/shop']:
              status,body=get(route)
              assert status==200,(route,status)
          status,lab=get('/assets/PrivateGameLab-B6oeTXfV.js')
          assert status==200
          lab=lab.decode('utf-8','replace')
          for marker in ['DEVICE ARCHIVE','ACCOUNT VERIFIED','Use local GLB']:
              assert marker in lab,('PrivateGameLab marker missing',marker)
          status,archive=get('/assets/studioArchive-JqJtwgkA.js')
          assert status==200
          archive=archive.decode('utf-8','replace')
          for marker in ['worldifact:studio-archive-changed','worldifact-studio-archive-revision-v1']:
              assert marker in archive,('studioArchive marker missing',marker)
          status,body=get('/api/studio/status',100_000)
          assert status==200
          v=json.loads(body)
          assert v.get('ready') is True
          assert v.get('detailedReady') is True
          assert v.get('costGuardReady') is True
          assert v.get('outputPolicyReady') is True
          assert v.get('photoReady') is True
          assert v.get('detailedReferenceLimit')==4
          print(json.dumps({
              'production':'VERIFIED',
              'gameLabDeviceArchiveSync':True,
              'sameTabArchiveSignal':True,
              'crossTabArchiveSignal':True,
              'studioReady':True,
              'paidGenerationRequested':False
          },sort_keys=True))
          PY
