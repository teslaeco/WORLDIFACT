name: Verify private 3D reference pack contracts (synthetic only)
on:
  pull_request:
    paths:
      - 'scripts/verify-reference-trial-pack.py'
      - 'tests/test_reference_trial_pack.py'
      - 'scripts/verify-3d-trial-result.py'
      - 'tests/test_3d_trial_result.py'
      - 'scripts/compose-private-scene.py'
      - 'tests/test_private_scene_composition.py'
      - '.github/workflows/reference-trial-pack.yml'
  push:
    branches: ['feat/ecomech-halloween-reference-trials-20261016']
permissions:
  contents: read
jobs:
  validate-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact source-trial QA dependencies (no GPU)
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.3.5 trimesh==4.11.1 Pillow==12.3.0
      - name: Validate synthetic source-pack contracts
        run: python -m unittest discover -s tests -p test_reference_trial_pack.py -v
      - name: Validate real 3D GLB/PBR structural QA contracts (synthetic fixtures only)
        run: python -m unittest discover -s tests -p test_3d_trial_result.py -v
      - name: Compose synthetic independently hashed 3D scene parts (no Astra/RunPod)
        run: python -m unittest discover -s tests -p test_private_scene_composition.py -v
