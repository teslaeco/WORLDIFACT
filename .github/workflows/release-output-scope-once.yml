name: Approved output-scope release (preserve configuration)
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['.github/workflows/release-output-scope-once.yml']
permissions:
  contents: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.ref == 'refs/heads/fix/generation-audit-recovery-20261009' && github.event.before == '49a02609a3730976ec0744ecf01877d1fbf16859' && github.run_attempt == 1
    environment:
      name: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact approved parent, payload and unchanged main
        shell: bash
        run: |
          set -euo pipefail
          C=49a02609a3730976ec0744ecf01877d1fbf16859
          B=38e7048c4176fac4c9808203af5bd58a1ae7d10e
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $C"
          test "$(git diff --name-status "$C" HEAD)" = $'A\t.github/workflows/release-output-scope-once.yml'
          test "$(git rev-parse "$C^{tree}")" = f6f6f99c8ef507461bcdac5340e179e24395e0bb
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$B"
          test "$(git diff --name-only "$B" "$C" -- src server public config package.json package-lock.json wrangler.jsonc)" = src/lib/studioProtocol.ts
          git diff --exit-code "$B" "$C" -- .github/workflows/cloudflare.yml scripts/select-pipeline-only-release.mjs scripts/select-construction-tools-release.mjs scripts/select-context-tools-release.mjs scripts/select-failed-hold-release.mjs
          git checkout --detach "$C"
          test "$(git rev-parse HEAD)" = "$C"
          echo 'Exact reviewed source selected; existing main and its release guards remain unchanged.'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Build configuration with no declared variables
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          const base=JSON.parse(await readFile('wrangler.jsonc','utf8'));
          assert.equal(base.name,'worldifact'); assert.equal(base.main,'server/worker.ts');
          assert.ok(Array.isArray(base.durable_objects?.bindings)); assert.ok(Array.isArray(base.migrations));
          function omitVars(v){return Array.isArray(v)?v.map(omitVars):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>k!=='vars').map(([k,x])=>[k,omitVars(x)])):v;}
          const config=omitVars(base);
          assert.deepEqual(config.durable_objects,base.durable_objects);
          assert.deepEqual(config.migrations,base.migrations);
          assert.deepEqual(omitVars({vars:{secret:'INERT'},env:{prod:{vars:{key:'INERT'},name:'same'}}}),{env:{prod:{name:'same'}}});
          assert.ok(!JSON.stringify(config).includes('"vars":'));
          await writeFile('.output-scope.wrangler.json',JSON.stringify(config,null,2)+'\n',{mode:0o600,flag:'wx'});
          console.log('Declared variables omitted at every level. Bindings and migrations unchanged. Deployment requires --keep-vars.');
          NODE
      - name: Dry-run exact preserving configuration and verify original gallery
        run: |
          npx wrangler deploy --dry-run --config .output-scope.wrangler.json --outdir .wrangler/output-scope-preview
          node scripts/prepare-public-gallery.mjs --verify-dist
      - name: Retain only previous deployment identifier for recovery
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {verifyExclusiveDeployment} from './scripts/check-failed-hold-release.mjs';
          try {
            const e=process.env;
            if(!/^[a-f0-9]{32}$/i.test(e.CLOUDFLARE_ACCOUNT_ID||'')||!/^[a-zA-Z0-9_-]{20,256}$/.test(e.CLOUDFLARE_API_TOKEN||''))throw Error();
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${e.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/worldifact/deployments`,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+e.CLOUDFLARE_API_TOKEN}});
            if(r.status!==200||!r.headers.get('content-type')?.includes('application/json'))throw Error();
            const text=await r.text(); if(Buffer.byteLength(text)>262144)throw Error();
            const data=JSON.parse(text), versionId=data?.result?.deployments?.[0]?.versions?.[0]?.version_id;
            await verifyExclusiveDeployment({versionId});
            await mkdir('release-evidence',{recursive:true});
            await writeFile('release-evidence/previous.json',JSON.stringify({versionId,sourceBefore:'38e7048c4176fac4c9808203af5bd58a1ae7d10e',sourceBeforeIsRepositoryBaseline:true},null,2)+'\n');
            console.log('Previous exclusive deployment identifier saved; no settings or secrets exported.');
          } catch {console.error('PREVIOUS_DEPLOYMENT_NOT_VERIFIED; no deployment attempted.');process.exitCode=1;}
          NODE
      - name: Deploy reviewed source without syncing any secrets or billing configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/output-scope-deploy.ndjson
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = 38e7048c4176fac4c9808203af5bd58a1ae7d10e
          if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false npx wrangler deploy --config .output-scope.wrangler.json --keep-vars >/dev/null 2>&1; then
            echo 'Deployment command completed. Exact public bytes and traffic must still be verified.'
          else
            echo '::error::DEPLOYMENT_NOT_CONFIRMED. Private command output suppressed; do not retry automatically.'
            exit 1
          fi
      - name: Verify public routes, exact artifacts and exclusive traffic
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/output-scope-deploy.ndjson
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {readDeployment} from './scripts/release-check.ts';
          import {checkCompatibleMccRelease} from './scripts/check-compatible-mcc-release.mjs';
          import {verifyExclusiveDeployment} from './scripts/check-failed-hold-release.mjs';
          let stage='deployment_receipt';
          try {
            const deployment=readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8'));
            const result=await checkCompatibleMccRelease(deployment,{onStage:s=>{if(['health','local_assets','foundation_manifest','html_routes','static_assets'].includes(s))stage=s;}});
            stage='exclusive_traffic'; await verifyExclusiveDeployment(deployment);
            const proof={...result,sourceCommit:'49a02609a3730976ec0744ecf01877d1fbf16859',checkedAt:new Date().toISOString(),status:'DEPLOYED_STATIC_VERIFIED',remoteVariablesPreserved:true,secretsSynchronized:false,financialOperations:0,generationRequested:false,liveModelVerified:false};
            await writeFile('release-evidence/deployment.json',JSON.stringify(proof,null,2)+'\n');
            console.log(JSON.stringify(proof,null,2));
            await appendFile(process.env.GITHUB_STEP_SUMMARY,`## Approved output-scope release\n\nSource: ${proof.sourceCommit}\nVersion: ${proof.versionId}\nRoutes: ${proof.htmlRoutes}; exact files: ${proof.verifiedAssets}.\nNo secret synchronization, financial operation or generation request. Live model acceptance is separate.\n`);
          } catch {console.error('PUBLICATION_NOT_VERIFIED:'+stage+'; do not retry or claim generation works.');process.exitCode=1;}
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: output-scope-release-${{ github.run_id }}
          path: release-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
# The owner explicitly approved this exact release and a separate capped model
# test. This workflow only deploys the reviewed source. It does not expose secrets,
# change main, run an Oracle installer, inspect private jobs or perform a paid test.
