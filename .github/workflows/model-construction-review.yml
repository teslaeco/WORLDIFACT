name: Verify bounded construction without paid generation
on:
  pull_request:
    paths:
      - 'tools/model_construction/**'
      - 'docs/STANDARD_CONSTRUCTION_REPAIR_20261007.md'
      - '.github/workflows/model-construction-review.yml'
permissions:
  contents: read
jobs:
  policy-and-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/WORLDIFACT
          ref: 2380a7e2dad05a40b3753faf06c2635ed444be51
          path: .context-ancestor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/Froge-MPC-2-test
          ref: d3f61b842dcfeda2ed794210caafc391919a75be
          path: .model-completion-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify policy, source identity and maintenance transaction
        env:
          MODEL_CONTEXT_ANCESTOR_REPOSITORY: ${{ github.workspace }}/.context-ancestor
          MODEL_COMPLETION_SOURCE: ${{ github.workspace }}/.model-completion-source/oracle_connector
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile tools/model_construction/*.py
          python -B -m unittest discover -s tools/model_construction -p 'test_*.py' -v
  native-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/WORLDIFACT
          ref: 2380a7e2dad05a40b3753faf06c2635ed444be51
          path: .context-ancestor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/Froge-MPC-2-test
          ref: d3f61b842dcfeda2ed794210caafc391919a75be
          path: .model-completion-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assemble exact existing runtime fixture
        run: python tools/model_construction/assemble_test_runtime.py --ancestor .context-ancestor --source .model-completion-source/oracle_connector --destination .construction-existing
      - name: Install official checksum-verified native Blender for inert fixtures
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0-linux-x64.tar.xz --output /tmp/blender-4.3.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0.sha256 --output /tmp/blender-4.3.0.sha256
          (cd /tmp && sha256sum --check --ignore-missing blender-4.3.0.sha256 && tar -xf blender-4.3.0-linux-x64.tar.xz)
      - name: Actual geometry, renders, edits, export and original ledger
        env:
          MODEL_CONTEXT_ANCESTOR_REPOSITORY: ${{ github.workspace }}/.context-ancestor
          MODEL_NATIVE_SOURCE: ${{ github.workspace }}/.model-completion-source/oracle_connector
          MODEL_NATIVE_INSTALLED: ${{ github.workspace }}/.construction-existing
          MODEL_NATIVE_BLENDER: /tmp/blender-4.3.0-linux-x64/blender
          MODEL_NATIVE_EVIDENCE: ${{ github.workspace }}/.construction-evidence
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tools/model_construction -p 'test_native_pipeline.py' -v
