name: Release the live-verified supervised STANDARD route
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['.github/workflows/release-supervised-standard-once.yml']
permissions:
  contents: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.ref == 'refs/heads/fix/generation-audit-recovery-20261009' && github.event.before == '3e86e009fd400f2185de67b1ecdd92761bc863ab' && github.run_attempt == 1
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested source and unchanged financial configuration
        run: |
          set -euo pipefail
          C=3e86e009fd400f2185de67b1ecdd92761bc863ab
          P=49a02609a3730976ec0744ecf01877d1fbf16859
          B=38e7048c4176fac4c9808203af5bd58a1ae7d10e
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $C"
          test "$(git diff --name-status "$C" HEAD)" = $'A\t.github/workflows/release-supervised-standard-once.yml'
          test "$(git rev-parse "$C^{tree}")" = 8052ba753fbdc1bcc03231e3c055de3bcb84ec00
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$B"
          test "$(git diff --name-only "$P" "$C" -- src server public config package.json package-lock.json wrangler.jsonc tools)" = src/lib/studioProtocol.ts
          git diff --exit-code "$P" "$C" -- .github/workflows/cloudflare.yml scripts/select-pipeline-only-release.mjs scripts/select-construction-tools-release.mjs scripts/select-context-tools-release.mjs scripts/select-failed-hold-release.mjs
          git checkout --detach "$C"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Require the exact accepted live request form
        run: node --test tests/studio-supervised-standard.test.ts
      - name: Keep all remote variables and original bindings
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          const base=JSON.parse(await readFile('wrangler.jsonc','utf8'));
          assert.equal(base.name,'worldifact');assert.equal(base.main,'server/worker.ts');
          assert.ok(Array.isArray(base.durable_objects?.bindings));assert.ok(Array.isArray(base.migrations));
          function omitVars(v){return Array.isArray(v)?v.map(omitVars):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>k!=='vars').map(([k,x])=>[k,omitVars(x)])):v;}
          const config=omitVars(base);
          assert.deepEqual(config.durable_objects,base.durable_objects);assert.deepEqual(config.migrations,base.migrations);
          assert.ok(!JSON.stringify(config).includes('"vars":'));
          await writeFile('.supervised.wrangler.json',JSON.stringify(config,null,2)+'\n',{mode:0o600,flag:'wx'});
          NODE
          npx wrangler deploy --dry-run --config .supervised.wrangler.json --outdir .wrangler/supervised-preview
          node scripts/prepare-public-gallery.mjs --verify-dist
      - name: Verify and retain the exact previous exclusive version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {verifyExclusiveDeployment} from './scripts/check-failed-hold-release.mjs';
          try {
            const versionId='7d88f9d7-0c32-413f-bcae-b6d0776b54f3';await verifyExclusiveDeployment({versionId});
            await mkdir('release-evidence',{recursive:true});
            await writeFile('release-evidence/previous.json',JSON.stringify({versionId,sourceBefore:'49a02609a3730976ec0744ecf01877d1fbf16859'},null,2)+'\n');
            console.log('Previous exact 100% deployment verified. No settings or secrets exported.');
          }catch{console.error('PREVIOUS_DEPLOYMENT_NOT_VERIFIED; no deploy.');process.exitCode=1;}
          NODE
      - name: Publish the reviewed route without changing secrets or billing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/supervised-deploy.ndjson
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = 38e7048c4176fac4c9808203af5bd58a1ae7d10e
          if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false npx wrangler deploy --config .supervised.wrangler.json --keep-vars >/dev/null 2>&1; then
            echo 'Deployment command completed; exact public bytes and traffic verification follow.'
          else
            echo '::error::DEPLOYMENT_NOT_CONFIRMED. Do not replay automatically.'
            exit 1
          fi
      - name: Verify actual public bytes, deep routes and exclusive deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/supervised-deploy.ndjson
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {readDeployment} from './scripts/release-check.ts';
          import {checkCompatibleMccRelease} from './scripts/check-compatible-mcc-release.mjs';
          import {verifyExclusiveDeployment} from './scripts/check-failed-hold-release.mjs';
          let stage='deployment_receipt';
          try {
            const deployment=readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8'));
            const result=await checkCompatibleMccRelease(deployment,{onStage:s=>{if(['health','local_assets','foundation_manifest','html_routes','static_assets'].includes(s))stage=s;}});
            stage='exclusive_traffic';await verifyExclusiveDeployment(deployment);
            const proof={...result,sourceCommit:'3e86e009fd400f2185de67b1ecdd92761bc863ab',checkedAt:new Date().toISOString(),status:'SUPERVISED_ROUTE_DEPLOYED',remoteVariablesPreserved:true,secretsSynchronized:false,financialOperations:0,newGenerationRequested:false,acceptedEngineeringModelRun:38004410388,acceptedModelSha256:'fecefbf591d37f65f12aa8bcf44ad56efbfc58aa8bd0010356091adb7f9ba6d0',signedInShopFlowVerified:false,accountLibrarySaveVerified:false};
            await writeFile('release-evidence/deployment.json',JSON.stringify(proof,null,2)+'\n');console.log(JSON.stringify(proof,null,2));
            await appendFile(process.env.GITHUB_STEP_SUMMARY,`## Supervised STANDARD route released\nSource: ${proof.sourceCommit}\nVersion: ${proof.versionId}\nRoutes: ${proof.htmlRoutes}; exact files: ${proof.verifiedAssets}.\nAccepted real model: run 38004410388. No new generation or financial operation in this release. Account/browser acceptance remains separate.\n`);
          }catch{console.error('PUBLICATION_NOT_VERIFIED:'+stage+'; no automatic replay.');process.exitCode=1;}
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supervised-route-release-${{ github.run_id }}
          path: release-evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
# This owner-approved preserving release deploys the same request form already
# accepted by the original worker. No Oracle installation, credential sync,
# customer mutation, paid retry, main merge or financial configuration update.
