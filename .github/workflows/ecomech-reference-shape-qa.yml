name: ECOMECH image-reference shape QA (existing GLB only)
on:
  pull_request:
    paths:
      - 'tools/ecomech/reference_target_20261015.json'
      - 'tools/ecomech/reference_silhouette_qa.py'
      - '.github/workflows/ecomech-reference-shape-qa.yml'
permissions:
  contents: read
  actions: read
jobs:
  silhouette-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned standalone CPU-only QA dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 trimesh==4.5.3 opencv-python-headless==4.10.0.84
      - name: Fetch ORIGINAL already-generated mobile GLB, no new AI job or backend write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ecomech-evidence
          gh run download 38644423079 --repo teslaeco/WORLDIFACT             --name ECOMECH-ULTRA-MOBILE-LOD --dir .ecomech-evidence
          printf '%s  %s\n' '868fd2018e357f0039f93d70e57748cf2282d39e2e87dab0dab877a688d2be23'             '.ecomech-evidence/ECOMECH_ASTRA_BLENDER_MOBILE_LOD.glb' | sha256sum --check
      - name: Reproduce baseline no-go of real reference silhouette, do not infer likeness from polygon count
        run: |
          python tools/ecomech/reference_silhouette_qa.py             --glb .ecomech-evidence/ECOMECH_ASTRA_BLENDER_MOBILE_LOD.glb             --target tools/ecomech/reference_target_20261015.json             --output .ecomech-reference-qa --expect-no-go
      - name: Preserve human-annotated reference baseline image and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ECOMECH-REFERENCE-SILHOUETTE-BASELINE
          path: .ecomech-reference-qa/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
