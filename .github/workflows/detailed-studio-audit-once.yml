name: Detailed Studio read-only incident audit
on:
  push:
    branches: ['fix/restore-detailed-studio-20260930']
    paths: ['.github/workflows/detailed-studio-audit-once.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read current output policy through the verified health probe
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { checkAstraRuntime } from './scripts/check-astra-runtime.mjs';
          let details = null;
          const evidence = await checkAstraRuntime(process.env, async (url, init) => {
            const response = await fetch(url, init);
            const reader = response.body.getReader(); let size = 0; const parts = [];
            try {
              for (;;) { const part = await reader.read(); if (part.done) break; size += part.value.length; if (size > 16384) throw new Error('OVERSIZED'); parts.push(part.value); }
            } finally { await reader.cancel().catch(() => {}); }
            const bytes = Buffer.concat(parts);
            if (response.ok) {
              const v = JSON.parse(bytes);
              details = { outputPolicyReady: v.astraOutputPolicy === 'astra-low-reconciled-v2', lowReasoning: v.astraReasoningEffort === 'low', boundedOutput: v.astraMaxOutputTokens === 16000, verifiedUsageSettlement: v.astraUsageSettlement === 'authenticated-completed-only', photoInput: v.photoInput === true, prompt5000: v.promptMaxLength === 5000 };
            }
            return new Response(bytes, {status:response.status, headers:response.headers});
          });
          console.log(JSON.stringify({checkedAt:new Date().toISOString(), evidence, details, paidGenerationRequested:false},null,2));
          JS
