name: Activate the approved private ten-code batch once
on:
  push:
    branches: [ops/promo-readiness-20261010]
    paths: ['.github/activation/private-promotion-20261010.json']
permissions:
  contents: read
concurrency:
  group: worldifact-promotion-activation
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.actor == 'teslaeco' && github.event_name == 'push' && github.ref == 'refs/heads/ops/promo-readiness-20261010' && github.run_attempt == 1
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify newly added owner-approved activation marker before credentials
        run: node scripts/activate-private-promotion-batch.mjs --check
      - name: Run synthetic preservation and no-retry tests without credentials
        run: node --test tests/private-promotion-activation.test.mjs
      - name: Register and activate only the approved private batch
        run: node scripts/activate-private-promotion-batch.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORLDIFACT_PROMOTION_BATCH_20261010: ${{ secrets.WORLDIFACT_PROMOTION_BATCH_20261010 }}
