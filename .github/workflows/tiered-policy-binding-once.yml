name: Set tiered policy binding once

on:
  push:
    branches: [main]
    paths:
      - 'ops/TIERED_POLICY_BINDING_20261014.json'
      - '.github/workflows/tiered-policy-binding-once.yml'

permissions:
  contents: read

concurrency:
  group: worldifact-production
  cancel-in-progress: false

jobs:
  set-policy:
    environment:
      name: production
      url: ${{ steps.verify.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact one-binding scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6bbe2132c885f95bf24e922e3fdf2f07422e9392"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/tiered-policy-binding-once.yml"
          test "${changed[1]}" = "ops/TIERED_POLICY_BINDING_20261014.json"
      - run: npm ci
      - name: Recheck exact tier contracts before changing one binding
        run: node --experimental-strip-types --test tests/studio-priced-submission.test.ts tests/studio-api.test.ts tests/paid-points-settlement-api.test.ts tests/studio-rollback-policy.test.ts
      - name: Set only STUDIO_NEW_JOB_POLICY
        run: printf '%s\n' 'tiered-v1' | npx wrangler secret put STUDIO_NEW_JOB_POLICY --name worldifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify tiered policy live
        id: verify
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile } from 'node:fs/promises'
          const origin='https://worldifact.xodobrox.workers.dev'
          let s
          for(let n=0;n<8;n++){
            const r=await fetch(origin+'/api/studio/status',{redirect:'error',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)})
            assert.equal(r.status,200)
            s=await r.json()
            if(s.newJobPolicy==='tiered-v1' && s.tiersReady===true) break
            await new Promise(resolve=>setTimeout(resolve,3000))
          }
          assert.equal(s.ready,true)
          assert.equal(s.detailedReady,true)
          assert.equal(s.newJobPolicy,'tiered-v1')
          assert.equal(s.tiersReady,true)
          assert.equal(s.pricingRevision,'studio-pricing-v1')
          assert.equal(s.studioAdmissionRevision,'oracle-durable-admission-v1')
          if(process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT,'url='+origin+'\n')
          console.log(JSON.stringify({ready:s.ready,newJobPolicy:s.newJobPolicy,tiersReady:s.tiersReady,pricingRevision:s.pricingRevision}))
          JS
