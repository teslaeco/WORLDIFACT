name: Deploy Studio admission status hotfix once

on:
  push:
    branches: [main]
    paths:
      - 'ops/STUDIO_ADMISSION_STATUS_HOTFIX_20261014.json'
      - '.github/workflows/studio-admission-status-hotfix-once.yml'

permissions:
  contents: read

concurrency:
  group: worldifact-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production
      url: ${{ steps.verify.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact hotfix envelope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "80135a0968cdc8d45a4c78dde598b56f328e1e60"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/studio-admission-status-hotfix-once.yml"
          test "${changed[1]}" = "ops/STUDIO_ADMISSION_STATUS_HOTFIX_20261014.json"
      - name: Check Cloudflare credential shape
        run: node scripts/release-check.ts credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - name: Run targeted regression
        run: node --experimental-strip-types --test tests/studio-export-capability.test.ts
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - name: Build preserving config
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises'
          import { buildAiShopUiConfig } from './scripts/build-compatible-mcc-config.mjs'
          const base=JSON.parse(await readFile('wrangler.jsonc','utf8'))
          const config=buildAiShopUiConfig(base,{aiShopUi:true,preserveBilling:true,preserveRemoteVars:true,preserveSecrets:true})
          await writeFile('.status-hotfix.wrangler.json',JSON.stringify(config,null,2)+'\n',{mode:0o600})
          JS
      - name: Dry-run
        run: npx wrangler deploy --dry-run --config .status-hotfix.wrangler.json --outdir .wrangler/preview
      - name: Deploy preserving remote variables and secrets
        run: |
          set -euo pipefail
          if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false \
            npx wrangler deploy --config .status-hotfix.wrangler.json --keep-vars > /dev/null 2>&1; then
            echo "Deployment completed; verifying status."
          else
            echo "::error::Deployment failed; private Wrangler output suppressed."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-status-hotfix.ndjson
      - name: Verify public Studio admission status
        id: verify
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile, readFile } from 'node:fs/promises'
          import { readDeployment } from './scripts/release-check.ts'
          import { checkCompatibleMccRelease } from './scripts/check-compatible-mcc-release.mjs'
          const deployment=readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8'))
          const release=await checkCompatibleMccRelease(deployment)
          const r=await fetch(release.origin+'/api/studio/status',{headers:{'Cache-Control':'no-cache'},redirect:'error',signal:AbortSignal.timeout(20000)})
          assert.equal(r.status,200)
          const s=await r.json()
          assert.equal(s.ready,true)
          assert.equal(s.studioAdmissionRevision,'oracle-durable-admission-v1')
          assert.equal(s.studioExecutionRevision,'studio-execution-v1')
          assert.deepEqual([...s.studioExecutionModels].sort(),['astra','luna','sol'])
          assert.deepEqual([...s.studioExecutionModes].sort(),['fast','standard'])
          if(process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT,'url='+release.origin+'\n')
          console.log(JSON.stringify({origin:release.origin,versionId:release.versionId,studioAdmissionRevision:s.studioAdmissionRevision,studioExecutionRevision:s.studioExecutionRevision,models:s.studioExecutionModels,modes:s.studioExecutionModes}))
          JS
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worldifact-status-hotfix.ndjson
