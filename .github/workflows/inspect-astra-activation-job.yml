name: Inspect failed Astra activation job — read only
on:
  push:
    branches: ['fix/pro-studio-billing-ui-20260929']
    paths: ['ops/INSPECT_ASTRA_ACTIVATION_JOB_20260929']
permissions:
  contents: read
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: GET the exact failed job; no generation request
        run: node --experimental-strip-types scripts/inspect-astra-activation-job.mjs
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: astra-activation-readonly-inspection
          path: astra-activation-inspection/
          if-no-files-found: ignore
          retention-days: 7
