name: Verify ASTRA profit guard without paid API
on:
  pull_request:
    paths:
      - 'tools/profit_guard/**'
      - '.github/workflows/astra-profit-guard-review.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile guard, launcher and reviewed installer
        run: python3 -m py_compile tools/profit_guard/*.py
      - name: Test concurrent spending, price expiry, replay and rollback with fixtures
        run: python3 -B -m unittest discover -s tools/profit_guard -p 'test_*.py' -v
