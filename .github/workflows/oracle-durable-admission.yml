name: Oracle durable admission (no paid calls)
on:
  pull_request:
    paths:
      - 'tools/oracle_admission/**'
      - 'server/studio.ts'
      - 'tests/oracle-durable*'
      - '.github/workflows/oracle-durable-admission.yml'
permissions:
  contents: read
jobs:
  sqlite-and-observed-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/WORLDIFACT
          ref: 2380a7e2dad05a40b3753faf06c2635ed444be51
          path: .upstream/admission-ancestor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/WORLDIFACT
          ref: 496b8c9f2120346993720357c3f920a4e3e9f2ae
          path: .upstream/admission-transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teslaeco/Froge-MPC-2-test
          ref: d3f61b842dcfeda2ed794210caafc391919a75be
          path: .upstream/model-completion
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Reconstruct the exact observed source without installing it
        run: |
          python -B tools/model_construction/assemble_test_runtime.py --ancestor .upstream/admission-ancestor --source .upstream/model-completion/oracle_connector --destination .upstream/admission-context
          python -B tools/oracle_admission/assemble_observed_runtime.py --context .upstream/admission-context --transport .upstream/admission-transport/tools/mcp_transport_repair/repair.py --destination .upstream/admission-observed
      - name: Exercise real SQLite, abrupt process death and the original HTTP handler
        env:
          ORACLE_ADMISSION_SOURCE: .upstream/admission-observed
          ORACLE_ADMISSION_PHOTO_SOURCE: .upstream/model-completion/oracle_connector
        run: python -B -m unittest discover -s tools/oracle_admission -v
