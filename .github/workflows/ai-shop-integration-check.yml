name: Verify AI Shop integration without deployment
on:
  push:
    branches: ['review/ai-shop-integration-20261007']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-shop-integration-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/review/ai-shop-integration-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact single-parent preserving release scope
        run: |
          node --input-type=module <<'JS'
          import { selectPipelineReleaseOptions } from './scripts/select-pipeline-only-release.mjs';
          const options = selectPipelineReleaseOptions();
          if (options.aiShopUi !== true || options.preserveBilling !== true || options.preserveRemoteVars !== true || options.preserveSecrets !== true) throw new Error('AI_SHOP_UI_INTEGRATION_SCOPE_NOT_VERIFIED');
          console.log('Verified exact AI Shop integration parent, file scope, marker and preserving mode. No deployment access used.');
          JS
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Package the separate static preview without publishing it
        run: |
          node scripts/build-shop-ui-preview.mjs
          npx wrangler deploy --dry-run --config wrangler.shop-ui-preview.jsonc --outdir .review/shop-ui-preview-package
