name: Reference reconstruction contracts (offline, no inference or billing)
on:
  push:
    branches: ['feat/reference-reconstruction-trellis2-20261015']
    paths: ['tools/reference_reconstruction/**', '.github/workflows/reference-reconstruction-tests.yml']
  pull_request:
    paths: ['tools/reference_reconstruction/**', '.github/workflows/reference-reconstruction-tests.yml']
permissions:
  contents: read
concurrency:
  group: reconstruction-contract-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1' 'Pillow==12.3.0' 'gradio_client==2.0.3'
      - run: python -m py_compile tools/reference_reconstruction/*.py
      - name: Run all source, GPU and transport lifecycle contracts, no network calls
        run: python -m unittest discover -s tools/reference_reconstruction -p 'test_*.py' -v
      - name: Inspect pinned Gradio executor implementation without connecting to a Space
        run: |
          python - <<'PY'
          import inspect,json
          from importlib.metadata import version
          from gradio_client import Client
          src=inspect.getsource(Client)
          info={'version':version('gradio_client'),'maxWorkersDefault':inspect.signature(Client).parameters['max_workers'].default,
            'streamScheduledOnPredictionExecutor':'self.executor.submit(self.stream_messages' in src,
            'dedicatedHelperExecutorPresent':'self.helper_executor' in src,
            'evidenceLines':[l.strip() for l in src.splitlines() if 'executor.submit' in l or 'max_workers=' in l]}
          open('transport-evidence.json','w').write(json.dumps(info,indent=2)+'\n')
          print(json.dumps(info))
          PY
      - name: A standard CPU runner must not pretend to provide the GPU engine
        run: |
          python tools/reference_reconstruction/native_trellis2.py --preflight > preflight.json
          python - <<'PY'
          import json
          v=json.load(open('preflight.json'))
          assert v['ready'] is False and 'CUDA_GPU_NOT_AVAILABLE' in v['blockers']
          print('GPU_ABSENCE_CORRECTLY_REPORTED; no inference executed')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reconstruction-preflight-${{ github.sha }}
          path: |
            preflight.json
            transport-evidence.json
          retention-days: 14
