name: ECOMECH V8 MAKE candidate — actual mesh repair, no paid API or release
on:
  push:
    branches: ['feat/ecomech-v8-make-repair-20261015']
    paths:
      - 'tools/ecomech/printprep_v8/**'
      - '.github/workflows/ecomech-v8-make-candidate.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-v8-make-candidate
  cancel-in-progress: true
jobs:
  source-bound-make-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Retrieve existing original V7 GLB only; no source image or provider task upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .v7-original
          gh run download 38711528467 --repo teslaeco/WORLDIFACT \
            --name ecomech-v7-PBR-TRUE-GLB-research-c2b15bfb0fed3954882819fe8d30a27626ae2431 \
            --dir .v7-original
          printf '%s  %s\n' 'a9cf5b06e450577ef420a3c95b80017f401caf6c1674e10cc09e254be057dd48' '.v7-original/ecomech-v7-projected-pbr-EXPERIMENTAL.glb' | sha256sum --check
      - name: Install pinned CPU-only geometry tools
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'scipy==1.17.0' 'scikit-image==0.26.0' \
            'trimesh==4.11.1' 'vtk==9.6.2' 'Pillow==12.3.0'
          python -m py_compile tools/ecomech/printprep_v8/*.py
      - name: Repair only the separate MAKE copy using a provisional 200 mm profile
        run: |
          python tools/ecomech/printprep_v8/prepare_make.py \
            --source .v7-original/ecomech-v7-projected-pbr-EXPERIMENTAL.glb \
            --out ecomech-v8-make-evidence --height-mm 200 --pitch-mm 0.4 --thicken-mm 0.6
      - name: Reopen actual STL/GLB and run all eight tests including physical unit invariants
        env:
          ECOMECH_V8_RESULT: ecomech-v8-make-evidence
        run: |
          python tools/ecomech/printprep_v8/test_make.py
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('ecomech-v8-make-evidence/MAKE_QA.json').read_text())
          assert q['sourceOriginalUnmodified']
          assert q['structuralGatePassed']
          assert q['structuralAudit']['connectedComponents']==1
          assert q['structuralAudit']['boundaryEdges']==0
          assert q['structuralAudit']['nonManifoldEdges']==0
          assert q['structuralAudit']['degenerateFaces']==0
          assert abs(q['structuralAudit']['sizeMm'][2]-200)<0.005
          assert not q['thicknessScreen']['fullMinimumThicknessVerified']
          assert not q['supplierAccepted'] and not q['slicerAccepted'] and not q['printReady']
          assert q['newOpenAiCalls']==q['newPaidVendorCalls']==0
          print('STRUCTURAL_TESTS_PASSED_BUT_PRINT_AND_ART_APPROVAL_REMAIN_FALSE')
          PY
      - name: Render real STL geometry with neutral clay, not the original photo as a shader
        run: |
          python tools/ecomech/printprep_v8/render_make.py \
            --stl ecomech-v8-make-evidence/ECOMECH_V8_MAKE_CANDIDATE_200mm.stl \
            --out ecomech-v8-make-evidence/renders
          for view in front three_quarter side back; do
            test -s "ecomech-v8-make-evidence/renders/${view}.png"
          done
      - name: Preserve actual research artifacts and reports; not a product deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecomech-v8-make-candidate-${{ github.sha }}
          path: ecomech-v8-make-evidence/
          if-no-files-found: ignore
          retention-days: 21
