name: Verify expired billing recovery
on:
  push:
    branches: ['fix/billing-expired-recovery-20260929']
    paths: ['scripts/prepare-expired-billing-recovery.py', '.github/workflows/expired-billing-recovery-review.yml']
permissions:
  contents: write
concurrency:
  group: worldifact-expired-billing-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/prepare-expired-billing-recovery.py
      - run: npm ci
      - run: npm run verify
      - run: npm run deploy:check
      - name: Commit tested expiry recovery only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/billing-expired-recovery-20260929
          git diff --check
          git add server/billing.ts tests/billing-recovery.test.ts
          git -c user.name='WORLDIFACT review' -c user.email='noreply@users.noreply.github.com' commit -m 'Allow safe recovery after pending upgrades expire and reconcile terminal state'
          git push origin HEAD:refs/heads/fix/billing-expired-recovery-20260929
