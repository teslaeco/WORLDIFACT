name: Apply bounded jogging cadence correction once
on:
  push:
    branches: [fix/visual-excavation-20260924]
    paths: [.github/workflows/jog-cadence-review-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply and hash-check the locally tested cadence correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p=Path('src/lib/avatarPose.ts');s=p.read_text().replace('export const STANCE=.60','export const STANCE=.60\n/** A faster travel speed becomes a jog, rather than doubling walking cadence. */\nexport function gaitStance(amount:number){ return STANCE-.22*THREE.MathUtils.smoothstep(amount,.60,1) }\nexport function gaitFrequency(amount:number){ return Math.max(0,amount)*WALK_SPEED*gaitStance(amount)/(2*STRIDE) }')
          s=s.replace('footCycle(phase:number,amount:number){','footCycle(phase:number,amount:number,stance=STANCE){').replace('if(p<STANCE)return {z:(-STRIDE+2*STRIDE*p/STANCE)*amount,lift:0}','if(p<stance)return {z:(-STRIDE+2*STRIDE*p/stance)*amount,lift:0}').replace('const t=(p-STANCE)/(1-STANCE),ease=t*t*(3-2*t)','const t=(p-stance)/(1-stance),ease=t*t*(3-2*t)')
          s=s.replace('crouch:0,airborne:false}){','crouch:0,airborne:false},stance=STANCE){').replace('const steps=[footCycle(phase,amount),footCycle(phase+.5,amount)]','const steps=[footCycle(phase,amount,stance),footCycle(phase+.5,amount,stance)]');p.write_text(s)
          p=Path('src/lib/avatarLocomotion.ts');s=p.read_text().replace('gaitPose, STANCE, STRIDE, WALK_SPEED','gaitPose, gaitStance, gaitFrequency').replace('phase += Math.max(0, speed) * WALK_SPEED * STANCE / (2 * STRIDE) * delta','phase += gaitFrequency(speed) * delta').replace('const pose = gaitPose(phase, blend, motion)','const pose = gaitPose(phase, blend, motion, gaitStance(speed))');p.write_text(s)
          p=Path('tests/visual-repair-regressions.test.ts');s=p.read_text().replace("import { WALK_SPEED } from '../src/lib/avatarPose.ts'","import { WALK_SPEED, gaitFrequency, gaitStance, footCycle } from '../src/lib/avatarPose.ts'")
          s+='''\n\ntest('fast travel uses a jogging support phase instead of six frantic walking steps per second',()=>{\n assert.ok(gaitFrequency(1)*2>=3 && gaitFrequency(1)*2<=4)\n assert.ok(gaitStance(1)<.5 && gaitStance(.5)>=.5)\n const phase=.42,stance=gaitStance(1)\n assert.ok(footCycle(phase,1,stance).lift>0 && footCycle(phase+.5,1,stance).lift>0,'jog has an actual flight interval')\n})\n''';p.write_text(s)
          expected={'src/lib/avatarPose.ts':'e3f2ab30b954b932c4ae231bb38c4a345c217b2355cc2d0aeed83279bd040b81','src/lib/avatarLocomotion.ts':'c2058d2c6351a3c3ec152660bd34b5fe2b633cdea805fe009080dd6744b29158','tests/visual-repair-regressions.test.ts':'c316ae87deff7a73bfbd314ece2daf0e31429402a75553d850e89771d625c068'}
          for p,h in expected.items(): assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          p=Path('docs/VISUAL_EXCAVATION_REPAIR_20260924.md');s=p.read_text().replace('27 targeted tests passed.','28 targeted tests passed.').replace('retaining the distance-driven stride, crouch/tuck/landing, original footwear and independent feet.','retaining the distance-driven stride, crouch/tuck/landing, original footwear and independent feet. At full speed a jogging support phase holds cadence below four steps/second instead of accelerating the walk to nearly six; the original GLB was numerically re-audited after this correction.');p.write_text(s)
          p=Path('docs/CONTEST_STATUS.md');s=p.read_text();s='## VERIFIED — final fast-travel cadence correction\n\nFull-speed movement uses a jogging support interval rather than six walking steps/second. 28 focused tests and a repeated numerical audit of the exact Queen GLB passed locally; the new CI head must pass before merge. No original-scene rendering or Android FPS is claimed.\n\n'+s;p.write_text(s)
          subprocess.run(['git','add','--',*expected,'docs/VISUAL_EXCAVATION_REPAIR_20260924.md','docs/CONTEST_STATUS.md'],check=True)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run typecheck
      - run: node --test tests/avatar-locomotion.test.ts tests/queen-motion-repair.test.ts tests/queen-controls.test.ts tests/terrain-loader.test.ts tests/visual-repair-regressions.test.ts
      - name: Push only checked files on the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use a jogging support phase for faster Queen travel'
          ASKPASS=$(mktemp)
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/fix/visual-excavation-20260924
