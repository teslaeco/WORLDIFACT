name: Verify exact Shop composer recovery without production access
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['scripts/stage-shop-composer.py', 'scripts/shop-composer-regressions.source', 'scripts/shop-composer-unit.source', '.github/workflows/stage-shop-composer.yml']
permissions:
  contents: write
concurrency:
  group: worldifact-shop-composer-source
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Require exact predecessor and source-expansion bytes
        run: |
          test "$(git rev-parse HEAD^)" = b275486a3d0a07149d5437215f51d7f09fab0146
          test "$(git rev-parse HEAD^^{tree})" = c1a86a8e456fe4d7e3a707096245eff938959504
          test "$(git hash-object scripts/stage-shop-composer.py)" = 2c8b6b9563300497f24430096ccdfd1aaeea18f5
          test "$(git hash-object scripts/shop-composer-regressions.source)" = 3ba7ffb34a901badb3c36869c986a149c7f1c9c2
          test "$(git hash-object scripts/shop-composer-unit.source)" = 9058d6c00e80302daf74a46042a91426cd5590c6
      - run: npm ci
      - name: Reproduce the uncleared failed composer against the original component
        run: |
          cat scripts/shop-composer-regressions.source >> tests/shop-draft-lifecycle.test.mjs
          if node --test --test-name-pattern='terminal failed request clears its unchanged composer' tests/shop-draft-lifecycle.test.mjs > /tmp/composer-before.txt 2>&1; then
            cat /tmp/composer-before.txt
            echo '::error::Expected baseline regression was not reproduced'
            exit 1
          fi
          cat /tmp/composer-before.txt
          grep -q 'Original brown chess knight' /tmp/composer-before.txt
          git restore -- tests/shop-draft-lifecycle.test.mjs
      - name: Expand only the reviewed nine-file correction
        run: python3 -B scripts/stage-shop-composer.py
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Create verified source objects without updating a branch or deploying
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,lstat,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const expected={
            'docs/CONTEST_STATUS.md':'dc3120d6b0644a36759ac93d62c5e5b69ce67676ea7a0ba565f46a1737b05f7c',
            'src/components/GenerationCostNotice.tsx':'cba9463feb8a7b306280e3a2eb61e34f431b3d953e88f6f907947d9cd4fc9577',
            'src/lib/generationQuote.ts':'85daf95ac5a1604cdb3793a553ff5e14c0507f2e889c1e19c04ac4c865e9e8c5',
            'src/lib/studioDraft.ts':'854109092753b8ef0f019298762b9c6c500b6c2fd1a55c34a410a74095c46fe1',
            'src/lib/useGenerationQuote.ts':'8f497b3b84768395bc81854c426a15d41e60d1d7d473746c1f9f14c72b4a850c',
            'src/pages/ShopPage.css':'ee937740fb1a7d6c1f96b45cfaeae51c1a1c550480896baa2e305032473d4991',
            'src/pages/ShopPage.tsx':'5ac76e681c95c465d6aa24dfd9d3342973aff4fec23e42ae68809efe906b11e4',
            'tests/shop-draft-lifecycle.test.mjs':'ed3d8f5ef05e85f4010ee1307f6f2885e2d116bc90bbf8fb7d886986f4d72f04',
            'tests/shop-draft-reset.test.ts':'797615bae459208747b9e76006e46459e6560fa0139a28cd3acbd7738cf5d4a2'};
          const branch='fix/generation-audit-recovery-20261009',parent=process.env.GITHUB_SHA;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(process.env.GITHUB_REPOSITORY!=='teslaeco/WORLDIFACT'||process.env.GITHUB_REF!=='refs/heads/'+branch||git('rev-parse','HEAD')!==parent||git('rev-parse','HEAD^')!=='b275486a3d0a07149d5437215f51d7f09fab0146')throw Error('Source scope mismatch');
          const api=async(method,path,body)=>{const r=await fetch('https://api.github.com/repos/teslaeco/WORLDIFACT/'+path,{method,redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok)throw Error('Source operation failed:'+r.status);return r.json();};
          if((await api('GET','git/ref/heads/'+branch)).object.sha!==parent)throw Error('Concurrent branch edit');
          const entries=[];
          for(const[path,sha]of Object.entries(expected)){
            const info=await lstat(path),raw=await readFile(path);
            if(!info.isFile()||info.isSymbolicLink()||raw.length>1048576||createHash('sha256').update(raw).digest('hex')!==sha)throw Error('Output fingerprint mismatch');
            const blob=await api('POST','git/blobs',{encoding:'base64',content:raw.toString('base64')});
            if(blob.sha!==createHash('sha1').update(Buffer.from('blob '+raw.length+'\0')).update(raw).digest('hex'))throw Error('Blob mismatch');
            entries.push({path,mode:'100644',type:'blob',sha:blob.sha});
          }
          const retired=['scripts/stage-shop-composer.py','scripts/shop-composer-regressions.source','scripts/shop-composer-unit.source','.github/workflows/stage-shop-composer.yml'];
          for(const path of retired)entries.push({path,mode:'100644',type:'blob',sha:null});
          const tree=await api('POST','git/trees',{base_tree:git('rev-parse','HEAD^{tree}'),tree:entries});
          if(tree.sha!=='89f7e077f896f3fa5fa3707e51786e334ce14f1b')throw Error('Entire candidate tree mismatch');
          const commit=await api('POST','git/commits',{message:'fix: reset completed Shop drafts and separate held points from old model errors\n\nClear only unchanged terminal composers, preserve newer edits and original receipts/models, collapse previous failures, and expose validated available/held balances with an existing review link. No billing, waiver, generator routing, stored job or provider-limit change. Full app verification and Worker dry-run passed; signed-in financial resolution is not claimed.',tree:tree.sha,parents:[parent]});
          const receipt={parent,commit:commit.sha,tree:tree.sha,changedFiles:Object.keys(expected),retired,branchUpdated:false,productionChanged:false,paidGenerationRequested:false,heldPointsReleased:false};
          await mkdir('composer-evidence',{recursive:true});await writeFile('composer-evidence/commit.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shop-composer-source-${{ github.run_id }}
          path: composer-evidence/commit.json
          if-no-files-found: error
          retention-days: 3
# Source-only adapter. No production environment, billing, Oracle, customer
# data, model invocation, secrets synchronization or automatic ref update.
