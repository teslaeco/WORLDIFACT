name: Resume original approved Studio allowance once
on:
  workflow_run:
    workflows: ["Publish WORLDIFACT and verify OpenAI setup"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  resume:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Gate to this approved integration release only
        id: gate
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Newer main exists; no stale source or allowance deployment.'
          elif git diff --name-only HEAD^1 HEAD | grep -qx 'ops/STUDIO_RESUME_ORIGINAL_SIX_20260917'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npm run verify
        if: steps.gate.outputs.run == 'true'
      - uses: ./.github/actions/foundations
        if: steps.gate.outputs.run == 'true'
      - name: Read remaining original allowance without starting generation
        id: allowance
        if: steps.gate.outputs.run == 'true'
        run: node scripts/resume-approved-studio.mjs
      - name: Dry run the same reviewed source and original ceiling
        if: steps.allowance.outputs.eligible == 'true'
        run: npx wrangler deploy --dry-run --config .studio-approved.wrangler.json --outdir .wrangler/studio-approved
      - name: Confirm source is still current
        id: current
        if: steps.allowance.outputs.eligible == 'true'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Main advanced while checking. No stale deployment.'
          fi
      - name: Resume only unused original reservations
        if: steps.current.outputs.deploy == 'true'
        run: npx wrangler deploy --config .studio-approved.wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify readiness without requesting a model
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/resume-approved-studio.mjs verify
