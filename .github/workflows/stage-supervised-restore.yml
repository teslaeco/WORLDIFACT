name: Stage the verified supervised STANDARD restoration
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['scripts/restore-supervised-standard.patch', '.github/workflows/stage-supervised-restore.yml']
permissions:
  contents: write
concurrency:
  group: stage-supervised-standard-restore
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.event.before == '018d3c981f9e95d5c392180933acb8dc5d265dbe' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply exact reviewed changes and verify request parity with the accepted live model
        run: |
          test "$(git rev-parse HEAD^)" = 018d3c981f9e95d5c392180933acb8dc5d265dbe
          echo 'e5b128800ec1110ca73482b825a09e238d92a8027ff02bb6170c2cfdd24d6fa1  scripts/restore-supervised-standard.patch' | sha256sum --check
          git apply --check scripts/restore-supervised-standard.patch
          git apply scripts/restore-supervised-standard.patch
          node --test tests/studio-supervised-standard.test.ts tests/studio-manufacturing-scope.test.ts tests/studio-protocol-contract.test.ts tests/generation-profile.test.ts tests/studio-quality-profiles.test.ts tests/shop-manufacturing.test.ts tests/output-scope-live-smoke.test.mjs
          PYTHONPATH=tools/model_construction python3 -B -m unittest test_response_phase test_construction_payload -q
      - name: Create the reviewed source object without updating any branch or service
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,lstat,mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const expected={
            'src/lib/studioProtocol.ts':'e8c8ab8e1dd8a9ea1df9c46ff3f2479b50c65357daeceaea8ec54972c3ebe61a',
            'tests/studio-protocol-contract.test.ts':'8eee7f2c3ac2a03dd61f1efad9596ea5dbad5cea10638eafe66d25e9160602a2',
            'tests/studio-supervised-standard.test.ts':'d1f5250d4bb92b51d72496bd7d00883a7c1b64e9e868e5b408d86818046cfa10',
            'docs/CONTEST_STATUS.md':'32e59f45faf742d19bf2eb722a328c5a224bccce724f7395850e333964dac995'};
          const branch='fix/generation-audit-recovery-20261009',parent=process.env.GITHUB_SHA;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(process.env.GITHUB_REPOSITORY!=='teslaeco/WORLDIFACT'||process.env.GITHUB_REF!=='refs/heads/'+branch||git('rev-parse','HEAD')!==parent)throw Error('Unexpected scope');
          const api=async(method,path,body)=>{
            const r=await fetch('https://api.github.com/repos/teslaeco/WORLDIFACT/'+path,{method,redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});
            if(!r.ok)throw Error('Source operation failed:'+r.status);return r.json();};
          if((await api('GET','git/ref/heads/'+branch)).object.sha!==parent)throw Error('Concurrent branch edit');
          const entries=[];
          for(const[path,sha]of Object.entries(expected)){
            const info=await lstat(path),bytes=await readFile(path);
            if(!info.isFile()||info.isSymbolicLink()||bytes.length>1048576||createHash('sha256').update(bytes).digest('hex')!==sha)throw Error('Unreviewed output');
            const blob=await api('POST','git/blobs',{encoding:'base64',content:bytes.toString('base64')});
            if(blob.sha!==createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex'))throw Error('Blob mismatch');
            entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const retired=['.github/workflows/inspect-native-token-count-once.yml','.github/workflows/export-count-reproduction-source-once.yml','.github/workflows/compare-existing-cli-once.yml','.github/workflows/stage-supervised-restore.yml','scripts/restore-supervised-standard.patch'];
          for(const path of retired)entries.push({path,mode:'100644',type:'blob',sha:null});
          const tree=await api('POST','git/trees',{base_tree:git('rev-parse','HEAD^{tree}'),tree:entries});
          if(tree.sha!=='d262c2e9098e0912726eae2d8e6fb67d5da035ba')throw Error('Entire candidate tree mismatch');
          const commit=await api('POST','git/commits',{message:'fix: restore the verified supervised STANDARD execution route\n\nDefault ordinary USD1.75 requests now match the actual accepted MCC comparison byte-for-byte. Keep original completion, cost and reference checks; preserve priced/specialized/FAST payloads and canonical receipt hashes. Record the verified GLB and retire completed probes. No production publication, Oracle installation, customer financial change or new paid request in this commit.',tree:tree.sha,parents:[parent]});
          const result={parent,commit:commit.sha,tree:tree.sha,changedFiles:Object.keys(expected),retired,branchUpdated:false,productionChanged:false,newGenerationRequested:false};
          await mkdir('source-evidence',{recursive:true});await writeFile('source-evidence/commit.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervised-source-${{ github.run_id }}
          path: source-evidence/commit.json
          retention-days: 3
          if-no-files-found: error
# Source publication only. No production environment, provider key, account,
# generation endpoint, host command or branch update is available in this step.
