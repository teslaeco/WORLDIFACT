name: Verify read-only generation diagnostics
on:
  pull_request:
    paths:
      - 'tools/diagnostics/**'
      - '.github/workflows/generation-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -B -m unittest discover -s tools/diagnostics -p 'test_*.py' -v
