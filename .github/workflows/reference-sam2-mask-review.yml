name: ECOMECH SAM2.1 source mask (local CPU only, no 3D or paid calls)
on:
  push:
    branches: ['feat/reference-reconstruction-trellis2-20261015']
    paths: ['tools/reference_reconstruction/sam2_reference_mask.py', '.github/workflows/reference-sam2-mask-review.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-sam21-source-mask
  cancel-in-progress: true
jobs:
  remove-background-not-rebuild-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Retrieve only the authorized original reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .original-reference
          gh run download 38653687131 -R teslaeco/WORLDIFACT \
            --name ECOMECH-V4-ASTRA-WITH-ACTUAL-REFERENCE-8fcffb86c571a8cca7ad09e1401247bf08f41104 \
            --dir .original-reference
          printf '%s  %s\n' '9f3b9a994315c0578859486a1c9dc17c8916316ba9e96300409772a1b8f5e053' '.original-reference/input-reference.png' | sha256sum --check
      - name: Install CPU segmentation implementation only
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.6.0' 'torchvision==0.21.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers==4.57.3' 'Pillow==12.3.0' 'numpy==2.3.5'
      - name: Mask full intact original using positive and negative-space prompts
        run: |
          python tools/reference_reconstruction/sam2_reference_mask.py \
            --source .original-reference/input-reference.png --out ecomech-sam2-mask
      - name: A passing mask screen is not a new accepted 3D model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('ecomech-sam2-mask/mask-report.json').read_text())
          assert q['originalRgbUnchanged'] and q['anchorScreenPassed']
          assert q['new3DGenerationCalls']==q['newPaidApiCalls']==0
          assert not q['humanFullMaskApproved'] and not q['geometryQualityClaim']
          print('REAL_SAM2_MASK_INFERENCE_COMPLETED_NO_3D_RETRY')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ecomech-sam21-real-mask-${{ github.sha }}
          path: ecomech-sam2-mask/
          if-no-files-found: ignore
          retention-days: 14
