name: Retrieve approved Oracle artifact once

on:
  workflow_run:
    workflows: ["Publish WORLDIFACT and verify OpenAI setup"]
    types: [completed]

permissions:
  contents: read

env:
  WORLDIFACT_URL: https://worldifact.xodobrox.workers.dev
  ORACLE_JOB_ID: 4a1db549-cc82-4b2e-bf15-7877e06fc968

jobs:
  artifact-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact deployed main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Gate to explicit artifact-review marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if git show --pretty='' --name-only HEAD | grep -qx 'ops/ORACLE_ARTIFACT_REVIEW_ARM_20260916'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Approved read-only Oracle artifact review marker found.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No artifact-review marker in this deployment commit; exiting without Oracle artifact access.'
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Verify exact source
        if: steps.gate.outputs.run == 'true'
        run: npm run verify

      - name: Retrieve and inspect existing succeeded Oracle GLB
        if: steps.gate.outputs.run == 'true'
        env:
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
        run: node scripts/oracle-artifact-inspect.mjs

      - name: Upload private review evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worldifact-oracle-generated-unreviewed-${{ github.event.workflow_run.head_sha }}
          path: .evidence/oracle-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
