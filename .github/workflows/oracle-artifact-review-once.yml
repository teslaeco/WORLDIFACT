name: Retrieve approved Oracle artifact once

on:
  workflow_run:
    workflows: ["Publish WORLDIFACT and verify OpenAI setup"]
    types: [completed]

permissions:
  contents: read

env:
  WORLDIFACT_URL: https://worldifact.xodobrox.workers.dev
  ORACLE_JOB_ID: 3fb599e9-c07b-44d9-ac29-af62f04eede9

jobs:
  artifact-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    environment:
      name: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact deployed main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Gate to explicit artifact-review marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -m -r HEAD)"
          if printf '%s\n' "$changed" | grep -qx 'ops/CONTEST_LIVE_ARTIFACT_VERIFY_20260918'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Contest LIVE artifact verification marker added in this deployment commit.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No contest LIVE artifact verification marker added by this deployment commit; exiting without artifact access.'
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Verify exact source
        if: steps.gate.outputs.run == 'true'
        run: npm run verify

      - name: Retrieve and inspect existing succeeded Oracle GLB
        if: steps.gate.outputs.run == 'true'
        env:
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
        run: node scripts/oracle-artifact-inspect.mjs

      - name: Capture no-browser public HTTP evidence
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence/http
          curl --fail --silent --show-error --max-time 20 "$WORLDIFACT_URL/api/health" > .evidence/http/health.json
          curl --fail --silent --show-error --max-time 20 "$WORLDIFACT_URL/lab" > .evidence/http/lab.html
          curl --fail --silent --show-error --max-time 20 "$WORLDIFACT_URL/" > .evidence/http/home.html
          grep -q 'WORLDIFACT' .evidence/http/home.html
          grep -q '<div id="root"' .evidence/http/lab.html
          printf '%s\n' 'PASS: public HTTPS root, /lab and /api/health responded. This is HTTP evidence only, not device/browser QA.' > .evidence/http/summary.txt

      - name: Upload private review evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worldifact-contest-live-artifact-${{ github.event.workflow_run.head_sha }}
          path: |
            .evidence/oracle-artifact/
            .evidence/http/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
