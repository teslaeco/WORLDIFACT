name: Prepare visual repair workspace once
on:
  push:
    branches: [fix/visual-excavation-20260924]
    paths: [.github/workflows/visual-workspace-once.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Archive tracked source without credentials
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-repair-source
          path: source.zip
          retention-days: 1
      - run: npm ci
      - name: Package existing locked dependencies for offline validation
        run: tar -czf dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-repair-dependencies
          path: dependencies.tar.gz
          retention-days: 1
