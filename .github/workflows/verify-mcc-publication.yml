name: Verify published MCC photos and model prices
on:
  workflow_run:
    workflows: ['Publish WORLDIFACT and verify OpenAI setup']
    types: [completed]
permissions:
  contents: read
jobs:
  public-read:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check public comparison HTML, photos and point costs against the deployed commit
        run: node scripts/check-mcc-publication.mjs
