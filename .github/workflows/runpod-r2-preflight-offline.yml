name: RunPod and R2 preflight offline contracts (no secrets)
on:
  pull_request:
    paths:
      - 'scripts/runpod-readonly-preflight.mjs'
      - 'tests/runpod-readonly-preflight.test.mjs'
      - 'scripts/r2-connection-preflight.py'
      - 'tests/test_r2_connection_preflight.py'
      - '.github/workflows/runpod-r2-*.yml'
  push:
    branches: ['ops/runpod-r2-secret-preflight-20261016']
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: node --test tests/runpod-readonly-preflight.test.mjs
      - run: python -m unittest discover -s tests -p test_r2_connection_preflight.py -v
