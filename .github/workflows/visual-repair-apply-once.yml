name: Apply inspected gameplay repair once
on:
  push:
    branches: [fix/visual-excavation-20260924]
    paths: [.github/workflows/visual-repair-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Decode and check exact reviewed patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          parts=[pathlib.Path(f'ops/.visual-repair-transfer-{i}.b64').read_text().strip() for i in range(4)]
          for i,p in enumerate(parts): print('transfer',i,len(p),hashlib.sha256(p.encode()).hexdigest())
          payload=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert len(payload)==49798
          assert hashlib.sha256(payload).hexdigest()=='167533b010fd061f59347aab9afd819c1583b8c66c1f8a0c47efc009451db55f'
          pathlib.Path('/tmp/visual-repair.patch').write_bytes(payload)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/visual-repair.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/visual-repair.patch'],check=True)
          expected={'ASSET_LICENSES.md','docs/CONTEST_STATUS.md','docs/VISUAL_EXCAVATION_REPAIR_20260924.md','docs/evidence/queen-rig-original-2026-09-24.json','src/components/StartingWorld.tsx','src/components/WorldMovement.css','src/lib/avatarLocomotion.ts','src/lib/avatarPose.ts','src/lib/backhoe.ts','src/lib/desertScene.ts','src/lib/desertTerrain.ts','src/lib/excavationCamera.ts','src/lib/pvMaterial.ts','src/lib/solarVehicle.ts','tests/terrain-loader.test.ts','tests/visual-repair-regressions.test.ts','tools/audit-queen-rig.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          assert changed==expected,(changed,expected)
          for p in sorted(expected): print(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(),p)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - name: Exercise real terrain and avatar regression fixtures
        run: node --test tests/avatar-locomotion.test.ts tests/queen-motion-repair.test.ts tests/terrain-loader.test.ts tests/visual-repair-regressions.test.ts
      - name: Commit only the checked gameplay files to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align original Queen rig and fan, make excavation visible, and separate mobile controls'
          ASKPASS=$(mktemp)
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/fix/visual-excavation-20260924
