name: Verify one real image through native runtime
on:
  push:
    branches: [fix/image-worker-transport-20261011]
permissions:
  contents: read
jobs:
  one-image:
    # Only the initial branch creation, never subsequent pushes or reruns/main merges.
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - name: Generate exactly one fixed medium image in an isolated native ledger
        run: node scripts/check-image-runtime.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
