name: Prepare and verify payment recovery
on:
  push:
    branches: ['fix/billing-payment-recovery-20260929']
    paths: ['scripts/prepare-billing-recovery.py', '.github/workflows/billing-recovery-review.yml']
permissions:
  contents: write
concurrency:
  group: worldifact-billing-recovery-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed source changes on isolated branch
        run: python3 scripts/prepare-billing-recovery.py
      - run: npm ci
      - name: Verify application without real provider payments or generation
        run: npm run verify
      - name: Verify Worker packaging
        run: npm run deploy:check
      - name: Commit only verified recovery changes
        run: |
          test "$GITHUB_REF" = refs/heads/fix/billing-payment-recovery-20260929
          git diff --check
          git add server/billing.ts src/pages/CreditsPage.tsx src/lib/paymentError.ts docs/CONTEST_STATUS.md
          git -c user.name='WORLDIFACT review' -c user.email='noreply@users.noreply.github.com' commit -m 'Recover failed subscription payments and preserve paid base periods'
          git push origin HEAD:refs/heads/fix/billing-payment-recovery-20260929
