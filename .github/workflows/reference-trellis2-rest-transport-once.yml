name: TRELLIS2 bounded REST transport repair after ZERO prior inference
on:
  push:
    branches: ['feat/reference-reconstruction-trellis2-20261015']
    paths: ['ops/reference-trellis2-transport-repair-once.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-trellis2-official-free-once
  cancel-in-progress: false
jobs:
  repaired-single-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Exact single activation, never automatic rerun
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          git diff-tree --no-commit-id --name-only -r HEAD | grep -qx ops/reference-trellis2-transport-repair-once.json
          python3 - <<'PY'
          import json
          x=json.load(open('ops/reference-trellis2-transport-repair-once.json'))
          assert x=={'revision':'trellis2-transport-repair-once-v1','previousRunId':38735532844,'previousGenerationCount':0,'newGenerationLimit':1,'paidUpgradeAllowed':False}
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Retrieve prior failed session report and exact already-prepared image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .prior-zero-generation
          gh run download 38735532844 --repo teslaeco/WORLDIFACT \
            --name trellis2-official-free-research-37bcce163c5175b0eef81681a20e7edd23c6fdda \
            --dir .prior-zero-generation
          printf '%s  %s\n' 'a2f1a5a07c6ee1512adf53261837d679b095749d17000829edd9a286ac1eca88' '.prior-zero-generation/attempt.json' | sha256sum --check
          python - <<'PY'
          import json
          q=json.load(open('.prior-zero-generation/attempt.json'))
          assert q['generationRequestsAttempted']==0
          assert q['status']=='BLOCKED_NO_RETRY' and q['reason']=='TimeoutError'
          assert 'imageUploadedToOfficialSpace' not in q
          PY
      - run: python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1' 'Pillow==12.3.0'
      - name: Bounded documented REST client, no Gradio worker threads, no auth/quota bypass
        run: |
          timeout --signal=TERM --kill-after=5s 550s python -u tools/reference_reconstruction/official_rest_once.py \
            --previous .prior-zero-generation --out trellis2-rest-result
      - name: Only an actual original GLB can pass this reconstruction test
        run: |
          python - <<'PY'
          import json
          q=json.load(open('trellis2-rest-result/rest-attempt.json'))
          assert q['newOpenAIRequests']==q['paidVendorRequests']==0
          assert q['generationRequestsAttempted']<=1
          assert q['state']=='ORIGINAL_GLB_RECEIVED_UNREVIEWED',q.get('errorSummary',q['state'])
          assert not q['visualAccepted'] and not q['printReady']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trellis2-official-rest-result-${{ github.sha }}
          path: trellis2-rest-result/
          if-no-files-found: ignore
          retention-days: 14
