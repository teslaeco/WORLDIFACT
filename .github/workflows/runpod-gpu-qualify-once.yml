name: WORLDIFACT native GPU qualification — one disposable worker
on:
  push:
    branches: ['feat/runpod-trellis-runtime-20261016', 'fix/runpod-baked-qualification-20261016']
    paths: ['tools/runpod_qualification/**', 'scripts/runpod-qualify-once.mjs', 'tests/runpod-qualification.test.mjs', '.github/workflows/runpod-gpu-qualify-once.yml']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'QUALIFY-ONE-GPU-MAX-1USD: one A100, max $3/hour, 20 minutes including teardown.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: worldifact-native-gpu-qualification
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: node --test tests/runpod-qualification.test.mjs tests/runpod-provision-on-demand.test.mjs
      - run: python -m py_compile tools/runpod_qualification/worker.py
  qualify:
    needs: review
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation == 'QUALIFY-ONE-GPU-MAX-1USD'
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      RUNPOD_QUALIFY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Require reviewed exact scripts before accessing Production secrets
        run: |
          test "$(git hash-object scripts/runpod-qualify-once.mjs)" = '8e4bc96f8631aaf4ea352b971ad6dc144a6baa62'
          test "$(git hash-object tools/runpod_qualification/worker.py)" = '5789519cb3306c4eefd7d644621b6a6466ee10e4'
          test "$(git hash-object scripts/runpod-provision-on-demand.mjs)" = 'ad7b63aac6e47c0ded62f50c25f0e7a94d53f822'
      - name: One private model qualification, preserve originals and delete worker
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
        run: node scripts/runpod-qualify-once.mjs
      - name: Independent cleanup after failure or interruption
        if: always() && hashFiles('runpod-qualification-state.json') != ''
        timeout-minutes: 2
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: node scripts/runpod-qualify-once.mjs --cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runpod-native-gpu-qualification-${{ github.run_id }}
          path: runpod-qualification-receipt.json
          if-no-files-found: ignore
          retention-days: 14
