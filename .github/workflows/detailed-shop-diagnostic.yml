name: Detailed Shop read-only diagnostic
on:
  push:
    branches: ['fix/restore-detailed-shop-20260930']
    paths: ['.github/workflows/detailed-shop-diagnostic.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Archive source and dependency installation only, never runner credentials
        run: |
          git archive --format=tar.gz -o source.tar.gz HEAD
          tar -czf dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: detailed-shop-repair-inputs
          path: |
            source.tar.gz
            dependencies.tar.gz
          retention-days: 1
  runtime:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read only public capability and fixed Oracle health fields
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { publicGuardEvidence } from './scripts/check-astra-runtime.mjs';
          const origin = 'https://worldifact.xodobrox.workers.dev';
          async function read(url, headers={}) {
            const r=await fetch(url,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok || !r.headers.get('content-type')?.startsWith('application/json')) throw Error('READ_UNAVAILABLE');
            const reader=r.body.getReader(), chunks=[];let length=0;
            try { for(;;){const n=await reader.read();if(n.done)break;length+=n.value.length;if(length>16384)throw Error('RESPONSE_TOO_LARGE');chunks.push(n.value)} }
            finally {await reader.cancel().catch(()=>{})}
            return JSON.parse(Buffer.concat(chunks).toString('utf8'));
          }
          for (const path of ['/api/health','/api/studio/status']) {
            try { const v=await read(origin+path);console.log(JSON.stringify({path,checkedAt:new Date().toISOString(),generationReady:v.generationReady===true,ready:v.ready===true,detailedMeshReady:v.detailedMeshReady===true,photoReady:v.photoReady===true,promptMaxLength:Number.isSafeInteger(v.promptMaxLength)?v.promptMaxLength:null,paidCalls:0})); }
            catch { console.log(JSON.stringify({path,status:'READ_UNAVAILABLE',paidCalls:0})); }
          }
          try {
            const u=new URL(process.env.ORACLE_ENDPOINT || '');
            if(u.protocol!=='https:' || !/^[a-z0-9]+(?:-[a-z0-9]+)*\.trycloudflare\.com$/.test(u.hostname) || u.pathname!=='/' || u.search || u.hash || u.username || u.password || u.port) throw Error('CONFIGURATION_REVIEW');
            const token=process.env.ORACLE_API_TOKEN;if(!token || token.length<32 || token.length>256 || /\s/.test(token))throw Error('CONFIGURATION_REVIEW');
            const v=await read(u.origin+'/v1/health',{Authorization:`Bearer ${token}`,Accept:'application/json'});
            let guard;try{guard=publicGuardEvidence(v)}catch{guard={runtime:'GUARD_NOT_VERIFIED'}}
            console.log(JSON.stringify({checkedAt:new Date().toISOString(),...guard,ready:v.ready===true,codexReady:v.codexReady===true,photoInput:v.photoInput===true,photoInputRevision:Number.isSafeInteger(v.photoInputRevision)?v.photoInputRevision:null,promptMaxLength:Number.isSafeInteger(v.promptMaxLength)?v.promptMaxLength:null,outputPolicyVerified:v.astraOutputPolicy==='astra-low-reconciled-v2',lowReasoning:v.astraReasoningEffort==='low',maxOutputTokens:v.astraMaxOutputTokens===16000?16000:null,completedUsageSettlement:v.astraUsageSettlement==='authenticated-completed-only',paidCalls:0}));
          } catch {console.log(JSON.stringify({runtime:'READ_UNAVAILABLE',paidCalls:0}));}
          JS
