name: Queen loading diagnostics (temporary)
on:
  push:
    branches: [fix/queen-loading-20260924]
    paths: [.github/workflows/queen-loading-diagnostic-temp.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read-only production avatar measurements
        shell: bash
        run: |
          mkdir -p /tmp/queen-loading
          for attempt in 1 2; do
            curl --max-time 110 --silent --show-error --dump-header /tmp/queen-loading/headers-$attempt.txt --output /tmp/queen-loading/body-$attempt --write-out 'attempt=%{num_retries} status=%{http_code} bytes=%{size_download} ttfb=%{time_starttransfer} total=%{time_total}\n' https://worldifact.xodobrox.workers.dev/api/avatar/neptune-queen | tee /tmp/queen-loading/timing-$attempt.txt || true
            grep -Ei '^(HTTP/|content-type:|content-length:|cache-control:|x-worldifact-|cf-cache-status:)' /tmp/queen-loading/headers-$attempt.txt || true
            sha256sum /tmp/queen-loading/body-$attempt || true
          done
          rm -f /tmp/queen-loading/body-*
      - name: Package source and local test dependencies only
        run: tar --exclude=.git -czf /tmp/queen-loading/workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: queen-loading-workspace
          path: /tmp/queen-loading/
          retention-days: 1
