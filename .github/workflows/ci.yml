name: Verify WORLDIFACT
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run npm run verify with bounded diagnostics
        run: |
          set +e
          npm run verify > "$RUNNER_TEMP/worldifact-verify.log" 2>&1
          verify_status=$?
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'worldifact-verify.log').read_text(errors='replace').splitlines()
          print('Verification command: npm run verify. Original exit status is preserved.')
          print('\n'.join(line[:600] for line in lines[:15]))
          print('--- Verification result and failure details (last 85 lines; long lines clipped) ---')
          print('\n'.join(line[:600] for line in lines[-85:]))
          PY
          exit "$verify_status"
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Inspect hosted Studio access without login or generation
        run: node scripts/check-froge-external.mjs
