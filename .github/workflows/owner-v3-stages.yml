name: Owner V3 two separate stages (maximum USD 6)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Fixed stages; paid stages are one-shot and stage 2 requires stage 1 review.'
        required: true
        type: choice
        default: prepare_uploads
        options: [prepare_uploads, stage1, collect1, cleanup1, stage2, collect2, cleanup2]
      confirmation:
        description: 'Exactly two owner generations, bounded total USD 6, no paid retries.'
        required: true
        type: choice
        default: TWO-OWNER-V3-MAX-6USD
        options: [TWO-OWNER-V3-MAX-6USD]
permissions: {contents: read}
concurrency:
  group: worldifact-owner-v3-stages
  cancel-in-progress: false
jobs:
  execute:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.ref == 'refs/heads/main' && inputs.confirmation == 'TWO-OWNER-V3-MAX-6USD' && (github.run_attempt == 1 || inputs.operation == 'collect1' || inputs.operation == 'collect2' || inputs.operation == 'cleanup1' || inputs.operation == 'cleanup2' || inputs.operation == 'prepare_uploads')
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install boto3==1.43.66 cryptography==50.0.2 Pillow==12.3.0
      - name: Pin reviewed application sources and operation
        env: {OWNER_V3_OPERATION: '${{ inputs.operation }}'}
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          c=json.loads(Path('ops/RUNPOD_OWNER_V3_20261017.json').read_text())
          assert c['id']=='owner-models-20261017-v3' and c['maxBatchMicroUsd']==6000000
          op=os.environ['OWNER_V3_OPERATION']
          assert op in ('prepare_uploads','stage1','stage2','collect1','collect2','cleanup1','cleanup2')
          if op in ('stage1','stage2'):
              assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
              assert re.fullmatch(r'[a-f0-9]{40}',c['imageSourceCommit'] or '')
              subprocess.run(['git','diff','--exit-code',c['imageSourceCommit'],'HEAD','--',
                              'tools/runpod_worker','tools/runpod_owner_v3/Dockerfile'],check=True)
          PY
      - name: Prepare encrypted create-only original-image and mask uploads
        if: inputs.operation == 'prepare_uploads'
        env:
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
        run: python tools/runpod_owner_v3/transfer.py prepare_uploads
      - name: Prepare exactly one stage and its bounded Astra review plan
        if: inputs.operation == 'stage1' || inputs.operation == 'stage2'
        env:
          OWNER_V3_OPERATION: ${{ inputs.operation }}
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/runpod_owner_v3/prepare.py --stage "${OWNER_V3_OPERATION#stage}"
      - name: Execute one fixed paid GPU job and delete its dedicated endpoint
        if: inputs.operation == 'stage1' || inputs.operation == 'stage2'
        timeout-minutes: 44
        env:
          OWNER_V3_OPERATION: ${{ inputs.operation }}
          OWNER_V3_CONFIRMATION: ${{ inputs.confirmation }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
        run: python tools/runpod_owner_v3/execute.py --stage "${OWNER_V3_OPERATION#stage}"
      - name: Independent cleanup of only this stage's dedicated endpoint
        if: always() && (inputs.operation == 'stage1' || inputs.operation == 'stage2' || inputs.operation == 'cleanup1' || inputs.operation == 'cleanup2')
        timeout-minutes: 3
        env:
          OWNER_V3_OPERATION: ${{ inputs.operation }}
          OWNER_V3_CONFIRMATION: ${{ inputs.confirmation }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
        run: |
          python tools/runpod_owner_v3/execute.py --stage "${OWNER_V3_OPERATION: -1}" --cleanup
      - name: Verify all completed bytes before accepting the stage
        if: success() && (inputs.operation == 'stage1' || inputs.operation == 'stage2' || inputs.operation == 'collect1' || inputs.operation == 'collect2')
        env:
          OWNER_V3_OPERATION: ${{ inputs.operation }}
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
        run: |
          python tools/runpod_owner_v3/transfer.py verify --stage "${OWNER_V3_OPERATION: -1}"
      - name: Collect encrypted complete or partial checkpoints without regeneration
        if: always() && (inputs.operation == 'stage1' || inputs.operation == 'stage2' || inputs.operation == 'collect1' || inputs.operation == 'collect2')
        env:
          OWNER_V3_OPERATION: ${{ inputs.operation }}
          ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_ACCESS_KEY_ID }}
          ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_SECRET_ACCESS_KEY }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION }}
        run: |
          python tools/runpod_owner_v3/transfer.py collect --stage "${OWNER_V3_OPERATION: -1}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-v3-${{ inputs.operation }}-${{ github.run_id }}
          path: |
            owner-v3-private/*.sealed.json
            owner-v3-private/*.manifest.json
            owner-v3-local/*-receipt.json
          retention-days: 30
          if-no-files-found: warn
