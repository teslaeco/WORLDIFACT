name: Reference reconstruction official resource probe (GET only, no image upload)
on:
  push:
    branches: ['feat/reference-reconstruction-trellis2-20261015']
    paths: ['tools/reference_reconstruction/probe_resources.py', '.github/workflows/reference-reconstruction-resource-probe.yml']
permissions:
  contents: read
concurrency:
  group: reference-resource-probe
  cancel-in-progress: true
jobs:
  public-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python tools/reference_reconstruction/probe_resources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reference-resources-${{ github.sha }}
          path: reconstruction-resource-evidence/
          retention-days: 7
