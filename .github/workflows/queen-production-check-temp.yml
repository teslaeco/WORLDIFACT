name: Verify deployed Queen transport (temporary)
on:
  push:
    branches: [verify/queen-loading-production-20260924]
    paths: [.github/workflows/queen-production-check-temp.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fixed public asset metadata, no private data or generation
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base = 'https://worldifact.xodobrox.workers.dev';
          for (const path of ['/game-assets/queen-1bbc9311605543b459318f212e791d05fbfa5450820e3433c4145d885ee948ba.glb.gz', '/api/avatar/neptune-queen']) {
            for (const method of ['HEAD', 'GET']) {
              const r = await fetch(base + path, { method, redirect: 'manual', headers: { 'Accept-Encoding': 'identity' }, signal: AbortSignal.timeout(15000) });
              console.log(JSON.stringify({ path, method, status: r.status, headers: Object.fromEntries(['content-type','content-encoding','content-length','cache-control','etag','location','x-worldifact-avatar-cache'].map(k => [k,r.headers.get(k)])) }));
              if (r.body) { const reader = r.body.getReader(); const first = await reader.read(); console.log('first12',Array.from(first.value?.slice(0,12) ?? [])); await reader.cancel(); }
            }
          }
          JS
