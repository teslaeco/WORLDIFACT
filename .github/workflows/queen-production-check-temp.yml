name: Verify deployed Queen transport (temporary)
on:
  push:
    branches: [verify/queen-loading-production-20260924]
    paths: [.github/workflows/queen-production-check-temp.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only bounded response diagnostics
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          for (const encoding of ['gzip', 'gzip', 'gzip', 'identity']) {
            const start = performance.now();
            try {
              const r = await fetch('https://worldifact.xodobrox.workers.dev/api/avatar/neptune-queen', { headers: { 'Accept-Encoding': encoding }, redirect: 'error', signal: AbortSignal.timeout(90000) });
              const headers = Object.fromEntries(['content-type','content-encoding','content-length','x-worldifact-glb-length','x-worldifact-avatar-cache','cache-control','cf-ray'].map(k => [k, r.headers.get(k)]));
              if (r.status !== 200) {
                const text = (await r.text()).slice(0, 20000);
                console.log(JSON.stringify({ encoding, status: r.status, headers, signals: text.match(/(?:error code|exceeded|1102|memory|temporarily unavailable)[^<\r\n]{0,100}/gi), ms: Math.round(performance.now()-start) }));
              } else {
                const data = new Uint8Array(await r.arrayBuffer());
                console.log(JSON.stringify({ encoding, status:r.status, headers, bytes:data.length, sha256:createHash('sha256').update(data).digest('hex'), ms:Math.round(performance.now()-start) }));
              }
            } catch (error) { console.log(JSON.stringify({ encoding, error: error.name, code: error.cause?.code, ms:Math.round(performance.now()-start) })); }
            await new Promise(resolve => setTimeout(resolve, 1500));
          }
          JS
