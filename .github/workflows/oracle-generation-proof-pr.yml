name: Oracle generation proof PR

on:
  pull_request:
    paths:
      - 'scripts/oracle-generation-proof.mjs'
      - '.github/workflows/oracle-generation-proof-pr.yml'

permissions:
  contents: read

concurrency:
  group: oracle-generation-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Generate/resume exactly one deterministic Oracle test model
        run: node scripts/oracle-generation-proof.mjs
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
      - name: Upload test GLB proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oracle-generation-proof-${{ github.event.pull_request.head.sha }}
          path: .evidence/oracle-generation-proof/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
