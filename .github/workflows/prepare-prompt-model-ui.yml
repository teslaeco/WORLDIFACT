name: Prepare and verify prompt-adjacent model controls
on:
  push:
    branches: ['fix/prompt-model-controls-20260928']
    paths: ['scripts/prepare-prompt-model-ui.mjs', '.github/workflows/prepare-prompt-model-ui.yml']
permissions:
  contents: write
concurrency:
  group: worldifact-prompt-model-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact reviewed layout edit to the isolated branch
        run: node scripts/prepare-prompt-model-ui.mjs
      - run: npm run verify
      - run: npm run deploy:check
      - name: Commit only tested layout changes to this review branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/prompt-model-controls-20260928
          git diff --check
          git add src/pages/ShopPage.tsx
          git -c user.name='WORLDIFACT review' -c user.email='noreply@users.noreply.github.com' commit -m 'Keep model dropdown and compact point quote directly beside the prompt'
          git push origin HEAD:refs/heads/fix/prompt-model-controls-20260928
