name: ECOMECH reference-shaped v2 — native Blender sculpt and real QA
on:
  pull_request:
    paths:
      - 'tools/ecomech/reconstruct_suit_from_reference.py'
      - 'tools/ecomech/render_reference_sculpt.py'
      - 'tools/ecomech/reference_target_20261015.json'
      - 'tools/ecomech/reference_silhouette_qa.py'
      - '.github/workflows/ecomech-reference-sculpt-v2.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ecomech-reference-sculpt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-sculpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse exact already-paid Astra GLB — no further paid request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .astra-src
          gh run download 38638422388 --repo teslaeco/WORLDIFACT \
            --name ecomech-real-astra-original-evidence-7797880f6410bdb19636e242af22b0041b79b28c \
            --dir .astra-src
          printf '%s  %s\n' '7e7f3aea755dfdd0ad957124d7e1dc33004905e0052fdab3d60b587f34cdc7b4' '.astra-src/original.glb' | sha256sum --check
      - name: Validate script syntax and tracked human landmark outline
        run: python -m py_compile tools/ecomech/reconstruct_suit_from_reference.py tools/ecomech/render_reference_sculpt.py tools/ecomech/reference_silhouette_qa.py
      - name: Install pinned native Blender 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0-linux-x64.tar.xz -o /tmp/blender-4.3.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0.sha256 -o /tmp/blender-4.3.0.sha256
          (cd /tmp && sha256sum --check --ignore-missing blender-4.3.0.sha256 && tar -xf blender-4.3.0-linux-x64.tar.xz)
      - name: Geometry-first custom 3D sculpt from the ORIGINAL user-image annotations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .reference-sculpt-output
          /tmp/blender-4.3.0-linux-x64/blender --background --factory-startup --python-exit-code 3 -t 4 \
            --python tools/ecomech/reconstruct_suit_from_reference.py \
            -- .astra-src/original.glb tools/ecomech/reference_target_20261015.json .reference-sculpt-output
          test -s .reference-sculpt-output/ECOMECH_REFERENCE_SHAPED_GAME.glb
          test -s .reference-sculpt-output/ECOMECH_REFERENCE_SCULPT_EDITABLE.blend
          test -s .reference-sculpt-output/MANIFEST_REFERENCE_V2.json
      - name: Validate physical GLB binary/immutable input SHA (not aesthetic claims)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          root=Path('.reference-sculpt-output')
          meta=json.loads((root/'MANIFEST_REFERENCE_V2.json').read_text())
          assert meta['oracleOriginalSha256']=='7e7f3aea755dfdd0ad957124d7e1dc33004905e0052fdab3d60b587f34cdc7b4'
          assert meta['imagePixelInputToAstraInOriginalJob'] is False
          assert meta['modelQuality']=='UNREVIEWED'
          path=root/'ECOMECH_REFERENCE_SHAPED_GAME.glb'
          raw=path.read_bytes()
          assert raw[:4]==b'glTF' and struct.unpack_from('<II',raw,4)==(2,len(raw))
          length,typecode=struct.unpack_from('<II',raw,12)
          assert typecode==0x4e4f534a
          doc=json.loads(raw[20:20+length])
          assert doc.get('meshes') and doc.get('materials')
          print('REFERENCE_SCULPT_BINARY_PASS',len(raw),len(doc['meshes']),len(doc['materials']),hashlib.sha256(raw).hexdigest())
          PY
      - name: Install pinned CPU-only visual-geometry QA packages
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 trimesh==4.5.3 opencv-python-headless==4.10.0.84
      - name: Human-annotated silhouette projection from REAL rebuilt GLB; no unearned QA pass
        run: |
          python tools/ecomech/reference_silhouette_qa.py \
            --glb .reference-sculpt-output/ECOMECH_REFERENCE_SHAPED_GAME.glb \
            --target tools/ecomech/reference_target_20261015.json \
            --output .reference-sculpt-output --report-only
      - name: CPU-render actual PBR mesh from four angles for human assessment
        shell: bash
        run: |
          /tmp/blender-4.3.0-linux-x64/blender --background --factory-startup --python-exit-code 3 -t 4 \
            --python tools/ecomech/render_reference_sculpt.py \
            -- .reference-sculpt-output/ECOMECH_REFERENCE_SHAPED_GAME.glb .reference-sculpt-output
      - name: Preserve sculpt, original GLB SHA report, true multiview renders and shape evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecomech-vision-first-real-sculpt-${{ github.sha }}
          path: .reference-sculpt-output/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0
