name: Astra RunPod Blender pipeline — offline contracts and real fixture exports
on:
  push:
    branches: ['feat/astra-runpod-blender-pipeline-20261015']
    paths: ['server/runpod*.ts', 'tests/runpod-pipeline.test.ts', 'tests/fixtures/runpod/**', 'tools/runpod_worker/**', '.github/workflows/runpod-pipeline-tests.yml']
  pull_request:
    paths: ['server/runpod*.ts', 'tests/runpod-pipeline.test.ts', 'tests/fixtures/runpod/**', 'tools/runpod_worker/**', '.github/workflows/runpod-pipeline-tests.yml']
permissions:
  contents: read
concurrency:
  group: runpod-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ENABLE_RUNPOD_PIPELINE: 'false'
      ENABLE_RUNPOD_WORKER: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Node mocked provider/transaction contracts — no live request
        run: node --test tests/runpod-pipeline.test.ts
      - name: Install worker SDK and CPU-only test dependencies
        run: |
          python -m pip install -r tools/runpod_worker/requirements.txt
          python -m py_compile tools/runpod_worker/*.py
          python -m unittest discover -s tools/runpod_worker -p 'test_*.py' -v
      - name: Fetch verified Blender CPU runtime — not a paid GPU
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0-linux-x64.tar.xz -o /tmp/blender-4.3.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0.sha256 -o /tmp/blender-4.3.0.sha256
          (cd /tmp && sha256sum --check --ignore-missing blender-4.3.0.sha256 && tar -xf blender-4.3.0-linux-x64.tar.xz)
      - name: Produce a real GLB fixture, never a claimed ECOMECH reconstruction
        run: |
          mkdir -p runpod-fixture/input runpod-fixture/exports
          python - <<'PY'
          import trimesh
          mesh=trimesh.creation.box(extents=(1,.5,2))
          mesh.export('runpod-fixture/input/fixture.glb')
          PY
      - name: Real fixed Blender stage, GLB/BLEND and eight physical-camera renders
        run: |
          /tmp/blender-4.3.0-linux-x64/blender --background --factory-startup --disable-autoexec --python-exit-code 3 --threads 2 \
            --python tools/runpod_worker/blender_export.py -- runpod-fixture/input/fixture.glb runpod-fixture/exports
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,trimesh
          p=Path('runpod-fixture/exports');q=json.loads((p/'qa.json').read_text())
          original=Path('runpod-fixture/input/fixture.glb').read_bytes()
          assert q['sourceSha256']==hashlib.sha256(original).hexdigest()
          assert (p/'source.blend').stat().st_size>1000 and len(q['views'])==8
          mesh=trimesh.load(p/'game.glb',force='mesh',process=False)
          assert len(mesh.faces)==12
          for view in q['views']:
              assert (p/(view+'.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          assert q['printReady'] is False and q['visualAccepted'] is False
          print('REAL_BLENDER_STAGE_PASS_FIXTURE_ONLY_NO_GPU_OR_OPENAI_CALLS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runpod-blender-FIXTURE-NOT-ECOMECH-${{ github.sha }}
          path: runpod-fixture/
          if-no-files-found: ignore
          retention-days: 7
