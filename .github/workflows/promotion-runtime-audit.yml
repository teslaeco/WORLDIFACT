name: Audit production promotion configuration without mutation
on:
  push:
    branches: [ops/promo-readiness-20261010]
    paths:
      - 'scripts/audit-promotion-runtime.mjs'
      - '.github/workflows/promotion-runtime-audit.yml'
permissions:
  contents: read
concurrency:
  group: worldifact-promotion-runtime-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.event_name == 'push' && github.ref == 'refs/heads/ops/promo-readiness-20261010' && github.run_attempt == 1
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test read-only request boundaries with synthetic data
        run: node --test tests/promotion-operations.test.mjs
      - name: Read active Worker configuration using existing credentials
        run: node scripts/audit-promotion-runtime.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
