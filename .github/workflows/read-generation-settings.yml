name: Read live generation settings without changes
on:
  push:
    branches: [fix/generation-diagnosis-20261011]
    paths: ['scripts/read-generation-settings.mjs', '.github/workflows/read-generation-settings.yml']
permissions:
  contents: read
concurrency:
  group: incident-generation-readonly-20261011
  cancel-in-progress: false
jobs:
  inspect:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test tests/read-generation-settings.test.mjs
      - name: Verify read-only collector
        run: echo "629321daa091c6906dd00c0052cb6dd2866204abd762ab12801b75e93725ee36  scripts/read-generation-settings.mjs" | sha256sum -c -
      - name: Read existing production script settings only
        run: node scripts/read-generation-settings.mjs
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
