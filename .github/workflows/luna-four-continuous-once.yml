name: Live Luna four-job continuity once

on:
  push:
    branches: ['ops/luna-four-continuous-test-20261014']
    paths:
      - 'scripts/luna-four-continuous-once.mjs'
      - '.github/workflows/luna-four-continuous-once.yml'

permissions:
  contents: write

concurrency:
  group: worldifact-luna-four-continuous-20261014
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.run_attempt == 1
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run exactly four sequential Luna Standard jobs, no retry
        env:
          WORLDIFACT_LUNA_FOUR_APPROVAL: LUNA_FOUR_ONCE_20261014
          GITHUB_TOKEN: ${{ github.token }}
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
        run: node scripts/luna-four-continuous-once.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: luna-four-continuity-evidence-${{ github.sha }}
          path: luna-four-evidence/
          retention-days: 7
          if-no-files-found: warn
