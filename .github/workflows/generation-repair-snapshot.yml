name: Generation repair source snapshot
on:
  push:
    branches: ['fix/astra-reference-billing-20260930']
    paths: ['.github/workflows/generation-repair-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Archive tracked public source only
        run: git archive --format=tar.gz --output=worldifact-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: generation-repair-public-source
          path: worldifact-source.tar.gz
          retention-days: 1
