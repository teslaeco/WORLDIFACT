name: Verify private Game Lab publication without account writes
on:
  workflow_run:
    workflows: ['Publish WORLDIFACT and verify OpenAI setup']
    types: [completed]
permissions:
  contents: read
jobs:
  public-private-editor:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check exact published editor assets and unauthenticated world-access guards
        run: node scripts/check-private-game-publication.mjs
