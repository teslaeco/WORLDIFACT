name: Release the verified merged Shop recovery
on:
  push:
    branches: ['fix/generation-audit-recovery-20261009']
    paths: ['.github/workflows/release-shop-ui-20261010.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: worldifact-production
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'teslaeco/WORLDIFACT' && github.ref == 'refs/heads/fix/generation-audit-recovery-20261009' && github.event.before == '6bd6715e431e75abd1a401d43b38e4d33a147eac' && github.run_attempt == 1
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require only this release entrypoint and the exact merged source tree
        run: |
          set -euo pipefail
          C=6bd6715e431e75abd1a401d43b38e4d33a147eac
          M=c6b89b42010f24075a2340cbe3d7fa47a5ddc2a9
          P=3e86e009fd400f2185de67b1ecdd92761bc863ab
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $C"
          test "$(git diff --name-status "$C" HEAD)" = $'A\t.github/workflows/release-shop-ui-20261010.yml'
          test "$(git rev-parse "$C^{tree}")" = 4b4d22a22307d1b016aa2b78beb9e118933b8200
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$M"
          git fetch --no-tags origin "$M"
          test "$(git rev-parse "$M^{tree}")" = 4b4d22a22307d1b016aa2b78beb9e118933b8200
          git diff --exit-code "$P" "$C" -- server public config package.json package-lock.json wrangler.jsonc tools src/lib/studioProtocol.ts .github/workflows scripts
          EXPECTED=$'src/components/CreditToolsPanel.css\nsrc/components/CreditToolsPanel.tsx\nsrc/components/GenerationCostNotice.tsx\nsrc/lib/generationQuote.ts\nsrc/lib/studioDraft.ts\nsrc/lib/useGenerationQuote.ts\nsrc/pages/CreditsPage.tsx\nsrc/pages/ShopPage.css\nsrc/pages/ShopPage.tsx'
          test "$(git diff --name-only "$P" "$C" -- src)" = "$EXPECTED"
          git checkout --detach "$C"
      - name: Require every completed exact-head review before credential use
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const runs=[38049840429,38049840424,38049840471,38049840478,38049840469,38049840514];
          try {
            for(const id of runs){
              const response=await fetch('https://api.github.com/repos/teslaeco/WORLDIFACT/actions/runs/'+id,{redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'}});
              assert.equal(response.status,200);const run=await response.json();
              assert.equal(run.id,id);assert.equal(run.head_sha,'6bd6715e431e75abd1a401d43b38e4d33a147eac');
              assert.equal(run.repository?.full_name,'teslaeco/WORLDIFACT');assert.equal(run.event,'pull_request');
              assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');
            }
            console.log('All six pinned exact-head review runs passed.');
          }catch{console.error('EXACT_SOURCE_REVIEW_NOT_VERIFIED; no deploy.');process.exitCode=1;}
          JS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: ./.github/actions/foundations
      - run: npm run deploy:check
      - name: Require restored generator route and new UI regression coverage
        run: node --test tests/studio-supervised-standard.test.ts tests/failed-hold-release.test.mjs tests/shop-draft-reset.test.ts tests/credit-tools-panel.test.mjs
      - name: Preserve every remote variable and original binding
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFile,writeFile} from 'node:fs/promises';
          const base=JSON.parse(await readFile('wrangler.jsonc','utf8'));
          assert.equal(base.name,'worldifact');assert.equal(base.main,'server/worker.ts');
          assert.ok(Array.isArray(base.durable_objects?.bindings));assert.ok(Array.isArray(base.migrations));
          function omitVars(v){return Array.isArray(v)?v.map(omitVars):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>k!=='vars').map(([k,x])=>[k,omitVars(x)])):v;}
          const config=omitVars(base);
          assert.deepEqual(config.durable_objects,base.durable_objects);assert.deepEqual(config.migrations,base.migrations);
          assert.ok(!JSON.stringify(config).includes('"vars":'));
          await writeFile('.shop-ui-release.wrangler.json',JSON.stringify(config,null,2)+'\n',{mode:0o600,flag:'wx'});
          JS
          npx wrangler deploy --dry-run --config .shop-ui-release.wrangler.json --outdir .wrangler/shop-ui-release-preview
          node scripts/prepare-public-gallery.mjs --verify-dist
      - name: Require the previously verified exclusive version before publishing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {verifyExclusiveDeployment} from './scripts/check-failed-hold-release.mjs';
          try{
            const versionId='4278815f-5576-49f9-a74e-e3348302b412';await verifyExclusiveDeployment({versionId});
            await mkdir('release-evidence',{recursive:true});
            await writeFile('release-evidence/previous.json',JSON.stringify({versionId,sourceBefore:'3e86e009fd400f2185de67b1ecdd92761bc863ab'},null,2)+'\n');
            console.log('Previous exact 100% deployment retained. No settings or secrets exported.');
          }catch{console.error('PREVIOUS_DEPLOYMENT_NOT_VERIFIED; no deploy.');process.exitCode=1;}
          JS
      - name: Publish only the merged verified UI with remote configuration preserved
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/shop-ui-release.ndjson
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = c6b89b42010f24075a2340cbe3d7fa47a5ddc2a9
          test "$(git rev-parse HEAD^{tree})" = 4b4d22a22307d1b016aa2b78beb9e118933b8200
          if WRANGLER_LOG=none WRANGLER_WRITE_LOGS=false WRANGLER_SEND_METRICS=false WRANGLER_SEND_ERROR_REPORTS=false npx wrangler deploy --config .shop-ui-release.wrangler.json --keep-vars >/dev/null 2>&1; then
            echo 'Deployment command completed; exact public files and traffic verification follow.'
          else
            echo '::error::DEPLOYMENT_NOT_CONFIRMED. No automatic replay.'
            exit 1
          fi
      - name: Verify actual public routes, source bytes and exclusive traffic
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/shop-ui-release.ndjson
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {readDeployment} from './scripts/release-check.ts';
          import {checkCompatibleMccRelease} from './scripts/check-compatible-mcc-release.mjs';
          import {verifyExclusiveDeployment} from './scripts/check-failed-hold-release.mjs';
          let stage='deployment_receipt';
          try{
            const deployment=readDeployment(await readFile(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8'));
            const result=await checkCompatibleMccRelease(deployment,{onStage:s=>{if(['health','local_assets','foundation_manifest','html_routes','static_assets'].includes(s))stage=s;}});
            stage='exclusive_traffic';await verifyExclusiveDeployment(deployment);
            const proof={...result,sourceCommit:'6bd6715e431e75abd1a401d43b38e4d33a147eac',mergedCommit:'c6b89b42010f24075a2340cbe3d7fa47a5ddc2a9',sourceTree:'4b4d22a22307d1b016aa2b78beb9e118933b8200',checkedAt:new Date().toISOString(),status:'SHOP_UI_DEPLOYED',remoteVariablesPreserved:true,secretsSynchronized:false,financialOperations:0,newGenerationRequested:false,heldPointsReleased:false,couponsActivated:false,signedInShopFlowVerified:false,accountLibrarySaveVerified:false};
            await writeFile('release-evidence/deployment.json',JSON.stringify(proof,null,2)+'\n');console.log(JSON.stringify(proof,null,2));
            await appendFile(process.env.GITHUB_STEP_SUMMARY,`## Verified merged Shop UI released\nSource: ${proof.sourceCommit}\nMain: ${proof.mergedCommit}\nVersion: ${proof.versionId}\nRoutes: ${proof.htmlRoutes}; exact files: ${proof.verifiedAssets}.\nNo new generation, financial operation, coupon activation or Oracle installation. Authenticated account acceptance remains separate.\n`);
          }catch{console.error('PUBLICATION_NOT_VERIFIED:'+stage+'; no automatic replay.');process.exitCode=1;}
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merged-shop-ui-release-${{ github.run_id }}
          path: release-evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
# Owner-approved current-source release. It does not claim old waiver authority,
# change an old release guard, export secrets, mutate customer data or grant codes.
