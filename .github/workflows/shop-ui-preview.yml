name: Publish isolated AI Shop interface preview
on:
  push:
    branches: ['review/ai-shop-original-20261007']
permissions:
  contents: read
concurrency:
  group: worldifact-shop-ui-preview-20261007
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/review/ai-shop-original-20261007'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate actual interface and assets-only isolation
        run: |
          npm run lint
          npm run typecheck
          node --test tests/shop-ui-preview.test.mjs tests/shop-draft-lifecycle.test.mjs tests/shop-account-chrome.test.mjs tests/prompt-model-ui.test.mjs tests/studio-library-gallery.test.mjs
          node scripts/build-shop-ui-preview.mjs
          npx wrangler deploy --dry-run --config wrangler.shop-ui-preview.jsonc --outdir .review/shop-ui-preview-package
      - name: Publish only the separate static preview Worker
        run: |
          test "$GITHUB_REF" = refs/heads/review/ai-shop-original-20261007
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("wrangler.shop-ui-preview.jsonc","utf8")); if(c.name!=="worldifact-shop-ui-preview-20261007" || Object.keys(c).some(k=>!["$schema","name","compatibility_date","workers_dev","preview_urls","assets"].includes(k)) || Object.keys(c.assets).sort().join(",")!=="directory,not_found_handling" || c.assets.directory!=="./.review/shop-ui-preview") throw Error("Refusing non-static or production configuration");'
          node --input-type=module -e 'const target="worldifact-shop-ui-preview-20261007", expectedVersion="a9a6f643-e13b-44b3-9f89-37cf77387a12", account=process.env.CLOUDFLARE_ACCOUNT_ID; if(!/^[a-f0-9]{32}$/.test(account||"")) throw Error("Invalid deployment account identifier"); const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${target}/deployments`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},redirect:"error",signal:AbortSignal.timeout(20000)}); if(response.status!==200){await response.body?.cancel();throw Error(`Preview ownership preflight blocked: HTTP ${response.status}`)} const text=await response.text();if(text.length>100000)throw Error("Oversized preview deployment metadata");const metadata=JSON.parse(text),current=metadata.result?.deployments?.[0]?.versions;if(metadata.success!==true||!Array.isArray(current)||current.length!==1||current[0].version_id!==expectedVersion||current[0].percentage!==100)throw Error("Preview target no longer matches our verified static deployment; refusing overwrite");console.log("Verified the existing isolated preview deployment before updating its UI.");'
          npx wrangler deploy --config wrangler.shop-ui-preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
