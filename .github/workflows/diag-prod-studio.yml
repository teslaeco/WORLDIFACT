name: Diagnose failed Oracle Studio job read-only

on:
  push:
    branches: [diag/prod-studio-20260918-2149]

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read failed job directly from Oracle
        shell: bash
        env:
          ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          const endpoint = (process.env.ORACLE_ENDPOINT || '').replace(/\/$/, '')
          const token = process.env.ORACLE_API_TOKEN || ''
          const id = '4adfab52-df7a-4ec2-b502-4c9ec2e0d8f1'
          if (!/^https:\/\//.test(endpoint) || token.length < 8) throw new Error('Oracle production connection unavailable')

          async function read(path) {
            const r = await fetch(endpoint + path, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
              redirect: 'manual',
              signal: AbortSignal.timeout(25000),
            })
            const body = await r.json().catch(() => ({}))
            if (!r.ok) throw new Error(path + ': HTTP ' + r.status)
            return body
          }

          const health = await read('/v1/health')
          console.log('health', JSON.stringify({
            ready: health.ready,
            provider: health.provider,
            model: health.model,
            connectorVersion: health.connectorVersion,
            generationProfiles: health.generationProfiles,
            generationProfileRevision: health.generationProfileRevision,
            fastBudgetRevision: health.fastBudgetRevision,
            fastBudgetMaxUsd: health.fastBudgetMaxUsd,
          }))

          const job = await read('/v1/jobs/' + id)
          const safe = {
            id: job.id,
            state: job.state,
            detail: typeof job.detail === 'string' ? job.detail.slice(0, 1000) : null,
            stage: job.stage ?? null,
            phase: job.phase ?? null,
            generationProfile: job.generationProfile ?? null,
            errorCode: job.errorCode ?? job.error_code ?? job.code ?? null,
            attempts: job.attempts ?? job.attempt ?? null,
            updatedAt: job.updatedAt ?? job.updated_at ?? null,
            timing: job.timing ?? null,
          }
          console.log('job', JSON.stringify(safe))
          console.log('job-keys', Object.keys(job).sort().join(','))
          JS
