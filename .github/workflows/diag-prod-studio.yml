name: Diagnose production Studio without generation

on:
  push:
    branches: [diag/prod-studio-20260918-2149]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read production health and prepare one no-cost receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          const base = 'https://worldifact.xodobrox.workers.dev'
          async function read(path) {
            const r = await fetch(base + path, { cache: 'no-store', signal: AbortSignal.timeout(20000) })
            const text = await r.text()
            console.log(path, 'HTTP', r.status, text.slice(0, 3000))
            if (!r.ok) process.exitCode = 1
            return { r, text }
          }
          await read('/api/health')
          await read('/api/studio/status')
          await read('/api/oracle/jobs/status')

          const input = {
            worldId: 'enchanted-ai-shop',
            prompt: 'Diagnostic no-cost prepare for a simple cartoon flower character.',
            purpose: 'object',
            textureMaxSize: 2048,
            photos: [],
            generationProfile: 'fast-draft-v1',
          }
          const r = await fetch(base + '/api/studio/prepare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Origin: base },
            body: JSON.stringify(input),
            signal: AbortSignal.timeout(30000),
          })
          const body = await r.json().catch(() => ({}))
          const safe = r.ok
            ? { id: body.id, createdAt: body.createdAt, ticketPresent: typeof body.ticket === 'string' && body.ticket.length > 20 }
            : { error: body.error }
          console.log('/api/studio/prepare', 'HTTP', r.status, JSON.stringify(safe))
          if (!r.ok) process.exitCode = 1
          JS
